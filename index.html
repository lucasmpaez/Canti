<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1a17;--muted:#6f675e;--line:#e6dfd4;--accent:#8a2424;--chip:#f1ebe1;--chord:#1f5f8b;--fs:18px}
.dark{--bg:#15130f;--card:#1f1c17;--ink:#ece6dc;--muted:#a59c90;--line:#35302a;--accent:#e08a7a;--chip:#2a2620;--chord:#7fb8e0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Naskh Arabic",Lora,serif;font-size:16px;line-height:1.5;min-height:100vh}
[dir=ltr] body,body.ltr{font-family:Lora,"Noto Naskh Arabic",serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-weight:600;font-size:19px;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:38px;height:38px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:14px}
.ib.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.search{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{flex:none;border:none;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff}
main{max-width:720px;margin:0 auto;padding:6px 14px 90px}
.sechead{color:var(--accent);font-weight:600;font-size:14px;margin:18px 4px 6px;letter-spacing:.02em}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:none}
.item .t{flex:1;font-size:17px}
.item .t .l{direction:ltr;unicode-bidi:isolate;font-family:Lora,serif}
.item .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.star{color:var(--accent);font-size:15px}
.item.sub .t{font-size:16.5px}.count{font-size:13px;color:var(--muted);min-width:1.5em;text-align:center}.chev{color:var(--muted)}
[dir=rtl] .chev{transform:scaleX(-1)}.item.zero .t{color:var(--muted)}
.sectitle{margin:14px 4px 12px}.sectitle h1{margin:2px 0 0;font-size:23px;color:var(--accent);font-weight:600}.mainname{font-size:13px;color:var(--muted)}
.bi{display:flex;flex-direction:column;gap:1px}.bi .bar{font-family:"Noto Naskh Arabic",serif;text-align:start}
.bi .bit,.bi .bit1{font-family:Lora,serif;text-align:start}.bi .bit{font-size:.82em;color:var(--muted)}
html[dir=rtl] .bi>span{text-align:right}html[dir=ltr] .bi>span{text-align:left}
.sechead{display:flex;align-items:flex-end;gap:8px}.sechead .bi{flex:1}.sechead .n{color:var(--muted);font-weight:400;font-size:13px}
.song h1 .bit{font-size:.62em;font-weight:400}.sectitle h1 .bit{font-size:.62em;font-weight:400}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.fab{position:fixed;bottom:20px;inset-inline-end:20px;width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.song h1{font-size:24px;color:var(--accent);margin:14px 0 2px;font-weight:600}
.meta{color:var(--muted);font-size:14px;margin-bottom:10px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tabs{display:flex;gap:6px;margin:4px 0 14px}
.body{font-size:var(--fs);line-height:1.55}
.body.ltr{direction:ltr;text-align:left;font-family:Lora,serif}
.body.rtl{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",serif}
.st{margin:0 0 1em}
.st.rit{font-style:italic;padding-inline-start:1.1em;border-inline-start:3px solid var(--line)}
.body.rtl .st.rit{font-style:normal;color:var(--accent)}
.ln{display:block;white-space:pre-wrap}
.ln.ch{margin-top:.15em}
.seg{display:inline-flex;flex-direction:column;vertical-align:bottom;white-space:pre}
.seg .c{font-size:.72em;line-height:1.35;font-weight:600;font-style:normal;color:var(--chord);font-family:Lora,serif;direction:ltr;white-space:pre;padding-inline-end:.45em;min-height:1.35em}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:calc(var(--fs) - 1px);white-space:pre-wrap;direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",serif}
.banner{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px;margin:10px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.panel h2{margin:0 0 10px;font-size:19px;color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.fld{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-size:16px}
textarea.fld{min-height:180px;line-height:1.5;resize:vertical}
textarea.ltrf{direction:ltr;text-align:left;font-family:Lora,serif}
.help{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.help code{background:var(--chip);padding:0 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:15px;background:var(--chip)}
.btn.pri{background:var(--accent);color:#fff}.btn.dan{background:transparent;color:#b3261e;border:1px solid #b3261e}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.menu a{display:block;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;color:inherit;text-decoration:none}
.hidden{display:none!important}
.dl{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:14px;padding:10px 12px;margin:12px 0 0;cursor:pointer}
.dl .ic{font-size:22px;line-height:1}.dl .tx{flex:1;line-height:1.3}.dl .tx b{display:block;font-size:15px}.dl .tx span{font-size:12.5px;opacity:.9}
.dl .tx b span{font-size:15px;opacity:1}.dl .tx b .ara{font-family:"Noto Naskh Arabic",serif;font-size:17px;font-weight:600}
.dl .x{border:none;background:transparent;color:#fff;font-size:20px;cursor:pointer;padding:2px 6px;opacity:.85}
.steps{margin:6px 0 0;padding-inline-start:1.3em;font-size:14.5px;line-height:1.7}.steps b{color:var(--accent)}
.how{font-weight:600;margin:16px 0 2px;font-size:15px}
/* ---------- preghiere (Angelus) ---------- */
.list.prl{margin-top:12px;border-color:var(--accent)}
.item.pr .t{font-size:18px}.item.pr .ptr{font-family:Lora,serif;font-style:italic;font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.prayer{font-size:var(--fs)}
.prayer .pnote{font-family:Lora,serif;font-style:italic;font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 12px;margin:6px 0 12px;direction:ltr;text-align:left}
.pv{padding:9px 0 10px;border-bottom:1px solid var(--line)}
.pv .a{font-family:"Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:1.12em;line-height:1.75}
.pv .tr,.pv .i{direction:ltr;text-align:left;font-family:Lora,serif;display:flex;gap:0;align-items:baseline}
.pv .tr{font-size:1em;line-height:1.45;margin-top:2px}
.pv .i{font-style:italic;font-size:.74em;color:var(--muted);line-height:1.4;margin-top:1px}
.pv .n{flex:none;width:calc(var(--fs)*1.5);color:var(--muted);font-size:.72em;font-weight:600}
.pv .m{flex:none;width:calc(var(--fs)*1.3);color:var(--accent);font-weight:600}
.pv .sp{flex:none;width:calc(var(--fs)*1.5)}.pv .sp2{flex:none;width:calc(var(--fs)*1.3)}
.nw{white-space:nowrap}
.pv.cont{border-top:none;padding-top:2px}.pv.hascont{border-bottom:none;padding-bottom:2px}
.ain{font-family:"Noto Naskh Arabic",serif;font-style:normal}
.tref{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--chip);border-radius:8px;padding:7px 10px;margin:8px 0}
.tref .ti{font-family:Lora,serif;font-weight:600;color:var(--accent);direction:ltr}
.tref .tt{font-family:Lora,serif;font-style:italic;color:var(--muted);font-size:.85em;direction:ltr}
.tref .ta{font-family:"Noto Naskh Arabic",serif;margin-inline-start:auto;direction:rtl}
.dsep{border-top:3px double var(--ink);margin:14px 0 4px;opacity:.75}
.inc{background:var(--chip);border-inline-start:3px solid var(--accent);border-radius:8px;padding:6px 12px 2px;margin-top:14px}
.inc .ih{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 2px;color:var(--accent);font-size:.8em;letter-spacing:.06em}
.inc .ih .l{font-family:Lora,serif;text-transform:uppercase;direction:ltr}.inc .ih .r{font-family:"Noto Naskh Arabic",serif;letter-spacing:0;font-size:1.15em}
.inc .pv:last-child{border-bottom:none}
.rubr{font-family:Lora,serif;font-style:italic;color:var(--accent);font-size:.8em;direction:ltr;text-align:left;margin:10px 0 4px}
.pv.short .tr{font-size:.9em;color:var(--muted)}
.days{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--chip);border-radius:8px;padding:7px 10px;margin:4px 0 8px;font-family:Lora,serif;font-size:.8em;direction:ltr}
.days .dar{font-family:"Noto Naskh Arabic",serif;font-size:1.15em;margin-inline-start:auto;direction:rtl}.days .dtr{font-style:italic;color:var(--muted)}
.pv.myst .mh{display:flex;justify-content:space-between;align-items:baseline;direction:ltr;color:var(--accent);font-family:Lora,serif;font-size:.72em;text-transform:uppercase;letter-spacing:.06em}
.pv.myst .mha{font-family:"Noto Naskh Arabic",serif;text-transform:none;letter-spacing:0;font-size:1.2em}
.pv .ref{font-style:normal;opacity:.8}
.pv .am{display:none}
html[dir=rtl] .pv .am{display:inline-flex;align-items:baseline;gap:.35em;margin-inline-end:.45em;min-width:2.2em}
html[dir=rtl] .pv .an{font-family:Lora,serif;color:var(--muted);font-size:.62em;font-weight:600}
html[dir=rtl] .pv .amk{font-family:Lora,serif;color:var(--accent);font-weight:600;font-size:.85em}
html[dir=rtl] .pv.cont .a{padding-inline-start:2.65em}
html[dir=rtl] .prayer .tr,html[dir=rtl] .prayer .tt,html[dir=rtl] .prayer .dtr,html[dir=rtl] .ptr,html[dir=rtl] .ptrm{display:none!important}
html[dir=rtl] .pv .i{justify-content:flex-end;text-align:right}
html[dir=rtl] .pv .i .sp,html[dir=rtl] .pv .i .sp2{display:none}
html[dir=rtl] .rubr,html[dir=rtl] .prayer .pnote{text-align:right}
html[dir=rtl] .pv.myst .i{margin-top:2px}
.item.prbar{background:var(--chip)}.item.prbar .ic{font-size:18px}

.tref.tog{cursor:pointer;user-select:none}.tref .tch{color:var(--accent);font-size:.9em;transition:transform .2s}.tref.open .tch{transform:rotate(180deg)}
.tref.open{border-radius:8px 8px 0 0;margin-bottom:0}
.inc.exp{margin-top:0;border-radius:0 0 8px 8px;padding-top:2px}
.expc{cursor:pointer;text-align:center;color:var(--accent);font-size:.8em;padding:8px 0 10px;border-top:1px solid var(--line)}
/* ---------- tema blu (logo) ---------- */
.tomenu{display:block;width:100%;margin:26px 0 10px;padding:14px;border:none;border-radius:14px;cursor:pointer;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,#0d47a1,#0a2a63);box-shadow:0 3px 10px rgba(10,42,99,.25)}
:root{--bg:#f1f5fc;--card:#fff;--ink:#12203d;--muted:#5a6683;--line:#d8e1f0;--accent:#0d47a1;--chip:#e2eaf8;--chord:#c62828;--red:#d32f2f;--navy:#0a2a63;--navy2:#0d47a1}
.dark{--bg:#06142f;--card:#0c2149;--ink:#edf2ff;--muted:#9fb0d2;--line:#1d3769;--accent:#8db3ff;--chip:#142f66;--chord:#ff8a80;--red:#ff6b6b}
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border-bottom:none;color:#fff;box-shadow:0 2px 10px rgba(5,25,70,.25)}
.dark header{background:linear-gradient(135deg,#041029 0%,#0a2a63 100%)}
.brand{color:#fff;display:flex;align-items:center;gap:9px}
.brand img{width:32px;height:32px;border-radius:9px;clip-path:inset(0 round 9px);flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
header .ib{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
header .search{background:#fff;color:#12203d;border-color:transparent}
.dark header .search{background:#0c2149;color:#edf2ff}
header .chip{background:rgba(255,255,255,.14);color:#fff}
header .chip.on{background:#fff;color:var(--navy)}
.dark header .chip.on{color:#0a2a63}
.fab{background:var(--red)}
.btn.pri{background:var(--accent)}
.dark .btn.pri,.dark .ib.on{color:#06142f}
.sechead,.sectitle h1,.song h1{color:var(--accent)}
.list{box-shadow:0 1px 3px rgba(10,42,99,.06)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 10px 6px}
.hero img{width:132px;height:132px;border-radius:34px;clip-path:inset(1px round 34px);box-shadow:0 8px 24px rgba(10,42,99,.28)}
.hero .h1{margin-top:12px;font-size:24px;font-weight:600;color:var(--accent)}
.hero .h2{font-size:14px;color:var(--muted);margin-top:2px}
.hero .h2 .l{font-family:Lora,serif;font-style:italic}
.dl{background:linear-gradient(135deg,var(--navy2),var(--navy))}
.dark .dl{background:linear-gradient(135deg,#123a85,#0a2a63)}
.list.prl{border-color:var(--accent);border-width:1.5px}
.item.prbar{background:var(--chip)}.item.prbar .ic{color:var(--red)}
.pv .m,.pv .amk,.rubr,.tref .ti,.inc .ih,.pv.myst .mh{color:var(--red)}
.inc{border-inline-start-color:var(--accent)}
.dsep{border-top-color:var(--accent)}
.panel h2{color:var(--accent)}
.dl-logo{display:block;width:72px;height:72px;border-radius:19px;clip-path:inset(1px round 19px);margin:0 auto 10px}
</style>
</head>

const BUILTIN = [{"id": "b1", "order": 1, "title": "Adeste fideles", "title_ar": "هلمّوا يا مؤمنين", "sec": "lat", "lang": "la", "body": "Adeste fideles,\nlaeti triumphantes:\nvenite, venite in Bethlehem.\nNatum videte\nregem angelorum:\n\n> Venite adoremus (3 v.)\n> Dominum.\n\nEn grege relicto,\nhumiles ad cunas\nvocati pastores approperant.\nEt nos ovanti\ngradu festinemus.\n\nAeterni Parentis\nsplendorem aeternum\nvelatum sub carne videbimus.\nDeum infantem,\npannis involutum."}, {"id": "b2", "order": 2, "title": "Adoro te devote", "title_ar": "أسجد لك بخشوع", "sec": "lat", "lang": "la", "body": "Adoro te devote, latens Deitas,\nquae sub his figuris vere latitas:\ntibi se cor meum totum subjicit,\nquia te contemplans totum deficit.\n\nVisus, tactus, gustus in te fallitur,\nsed auditu solo tuto creditur:\ncredo quidquid dixit Dei Filius:\nnihil hoc verbo veritatis verius.\n\nIn cruce latebat sola Deitas,\nat hic latet simul et humanitas:\nambo tamen credens atque confitens\npeto quod petivit latro paenitens.\n\nPlagas, sicut Thomas, non intueor:\nDeum tamen meum te confiteor:\nfac me tibi semper magis credere,\nin te spem habere, te diligere.\n\nO memoriale mortis Domini,\npanis vivus vitam praestans homini,\npraesta meae menti de te vivere,\net te illi semper dulce sapere.\n\nPie pellicane Jesu Domine,\nme immundum munda tuo sanguine,\ncujus una stilla salvum facere\ntotum mundum quit ab omni scelere.\n\nJesu, quem velatum nunc aspicio,\noro fiat illud quod tam sitio:\nut te revelata cernens facie,\nvisu sim beatus tuae gloriae. Amen."}, {"id": "b3", "order": 3, "title": "Attende Domine", "title_ar": "انظر يا رب", "sec": "lat", "lang": "la", "body": "> Attende Domine, et miserere\n> quia peccavimus tibi.\n\nAd te Rex summe, omnium Redemptor\noculos nostros sublevamus flentes:\nexaudi, Christe, supplicantum preces.\n\nDextera Patris, lapis angularis,\nvia salutis, janua coelestis,\nablue nostri maculas delicti.\n\nRogamus, Deus, tuam majestatem:\nauribus sacris gemitus exaudi:\ncrimina nostra placidus indulge.\n\nTibi fatemur crimina admissa:\ncontrito corde pandimus occulta:\ntua, Redemptor, pietas ignoscat.\n\nInnocens captus, nec repugnans ductus,\ntestibus falsis pro impiis damnatus:\nquos redemisti tu conserva, Christe."}, {"id": "b4", "order": 4, "title": "Ave maris stella", "title_ar": "السلام يا نجمة البحر", "sec": "lat", "lang": "la", "body": "Ave, maris stella,\nDei mater alma\natque semper virgo,\nfelix coeli porta!\n\nSumens illud Ave\nGabrielis ab ore,\nfunda nos in pace,\nmutans Evae nomen.\n\nSolve vincla reis,\nprofer lumen caecis,\nmala nostra pelle,\nbona cuncta posce.\n\nMonstra te esse Matrem,\nsumat per te precem\nqui, pro nobis natus,\ntulit esse tuus.\n\nVirgo singularis,\ninter omnes mitis,\nnos, culpis solutos,\nmites fac et castos.\n\nVitam praesta puram,\niter para tutum,\nut, videntes Jesum,\nsemper collaetemur.\n\nSit laus Deo Patri,\nsummo Christo decus,\nSpiritui Sancto,\ntribus honor unus.\nAmen."}, {"id": "b5", "order": 5, "title": "Christe cunctorum", "title_ar": "أيها المسيح، سيّد الجميع", "sec": "lat", "lang": "la", "body": "Christe, cunctorum dominator alme\nmente Supremi generate Patris,\nsupplicum voces pariterque carmen\ncerne benignus.\n\nCerne, quod templi, Deus, ad decorem\nplebs tua supplex resonet per aedem,\nannuo cuius redeunt colenda\ntempore festa.\n\nHaec domus surgit tibi dedicata\nrite, ubi sumit populus sacratum\nCorpus ex aris, bibit et beati\nSanguinis haustum.\n\nHic sacrosancti latices nocentum\ndiluunt culpas, perimuntque noxas:\nchrismate invictum genus et creatur\nchristicolarum.\n\nHic salus aegris, medicina fessis,\nlumen et caecis datur: hic reatu,\nChriste, nos solvis; timor atque moeror\npellitur omnis.\n\nDaemonis saevi perit hic rapina:\npervicax monstrum pavet, et retentos\ndeserens artus, fugit in remotas\nocyus auras.\n\nHic locus Regis vocitatur aula\nnempe coelestis, rutilansque coeli\nporta, quae vitae patriam petentes\naccipit omnes.\n\nTurbo quem nullus quatit, aut vagantes\ndiruunt venti; penetrantque nimbi,\nhanc domum tetris piceus tenebris\nTartarus horret.\n\nErgo te votis petimus sereno\nannuas vultu; famulos gubernes,\nqui tui summo celebrant amore\ngaudia templi.\n\nNulla nos vitae cruciet procella:\nsint dies laeti placidaeque noctes,\nnullus ex nobis, pereunte mundo,\nsentiat ignem.\n\nHic dies, in quo tibi consecratum\nconspicis templum, tribuat perenne\ngaudium nobis, vigeatque longo\ntemporis usu.\n\nLaus poli summum resonet Parentem,\nlaus Patris Natum pariterque Sanctum\nSpiritum dulci moduletur hymno\nomne per aevum. Amen."}, {"id": "b6", "order": 6, "title": "Crux fidelis", "title_ar": "أيها الصليب الأمين", "sec": "lat", "lang": "la", "body": "> Crux fidelis, inter omnes\n> arbor una nobilis:\n> nulla silva talem profert,\n> fronde, flore, germine.\n> Dulce lignum, dulces clavos,\n> dulce pondus sustinet.\n\nPange, lingua, gloriosi\nlauream certaminis,\net super Crucis trophaeo\ndic triumphum nobilem:\nqualiter Redemptor orbis\nimmolatus vicerit.\n\nFelle potus ecce languet:\nspina, clavi, lancea\nmite corpus perforarunt,\nunda manat, et cruor:\nterra, pontus, astra, mundus,\nquo lavantur flumine!\n\nFlecte ramos, arbor alta,\ntensa laxa viscera,\net rigor lentescat ille,\nquem dedit nativitas:\net superni membra Regis\ntende miti stipite.\n\nSola digna tu fuisti\nferre mundi victimam:\natque portum praeparare\narca mundo naufrago:\nquam sacer cruor perunxit\nfusus Agni corpore.\n\nSempiterna sit beatae\nTrinitati gloria:\naequa Patri Filioque;\npar decus Paraclito:\nUnius Trinique nomen\nlaudet universitas."}, {"id": "b7", "order": 7, "title": "Dulcis Christe", "title_ar": "أيها المسيح العذب", "sec": "lat", "lang": "la", "body": "Dulcis Christe, o bone Deus,\no amor meus, o vita mea,\no salus mea, o gloria mea.\nTu es Creator, tu es Salvator mundi.\nTe volo, te quaero,\nte adoro, o dulcis amor,\nte adoro, o care Jesu."}, {"id": "b8", "order": 8, "title": "Exaudi Domine", "title_ar": "استجب يا رب", "sec": "lat", "lang": "la", "body": "Exaudi Domine vocem meam\nqua clamavi ad te,\nmiserere mei et exaudi me.\nTibi dixit cor meum, exquisivit te facies mea.\nFaciem tuam, Domine, requiram.\nNe avertas faciem tuam a me.\nNe declines in ira a servo tuo."}, {"id": "b9", "order": 9, "title": "Gaudete", "title_ar": "افرحوا", "sec": "lat", "lang": "la", "body": "> Gaudete, gaudete! Christus est natus\n> ex Maria virgine: gaudete!\n\nTempus adest gratiae hoc quod optabamus,\ncarmina laetitiae devote reddamus.\n\nDeus homo factus est natura mirante,\nmundus renovatus est a Christo regnante.\n\nErgo nostra contio psallat iam in lustro:\nbenedicat Domino salus regi nostro."}, {"id": "b10", "order": 10, "title": "In cordis jubilo", "title_ar": "بابتهاج القلب", "sec": "lat", "lang": "la", "body": "Puer natus in Bethlehem, alleluia:\nunde gaudet Jerusalem, alleluia, alleluia.\n\n> In cordis jubilo,\n> Christum natum adoremus\n> cum novo cantico.\n\nAssumpsit carnem Filius, alleluia,\nDei Patris altissimus, alleluia, alleluia.\n\nPer Gabrielem nuntium, alleluia,\nVirgo concepit Filium, alleluia, alleluia.\n\nTamquam sponsus de thalamo, alleluia,\nprocessit Matris utero, alleluia, alleluia.\n\nHic iacet in praesepio, alleluia:\nqui regnat sine termino, alleluia, alleluia.\n\nEt Angelus pastoribus, alleluia,\nrevelat quod sit Dominus, alleluia, alleluia.\n\nReges de Saba veniunt, alleluia,\naurum, thus, myrrham offerunt, alleluia, alleluia.\n\nIn hoc natali gaudio, alleluia:\nbenedicamus Domino, alleluia, alleluia.\n\nLaudetur sancta Trinitas, alleluia,\nDeo dicamus gratias, alleluia, alleluia."}, {"id": "b11", "order": 11, "title": "Isti sunt agni novelli", "title_ar": "هؤلاء هم الحملان الجدد", "sec": "lat", "lang": "la", "body": "> Isti sunt agni novelli,\n> qui annuntiaverunt, alleluia:\n> modo venerunt ad fontes,\n> repleti sunt claritate, alleluia, alleluia.\n\nO Regina, quam divina\npraeelegit gratia,\ncujus partus sacrosanctus\ninstauravit omnia.\n\nO Maria, Mater pia,\ntuum da subsidium,\nquo vincamus et vivamus\nin terra viventium.\n\nChristianis vitae panis\ndatur in edulium:\ndatur tristi sanguis Christi\ndulce refrigerium.\n\nPrimum quidem nobis fidem\ntuis auge precibus,\net da nobis ut te probis\nimitemur actibus.\n\nSpe labentes firma mentes,\ncaritate robora:\nfac concordes, pelle sordes,\nexcusa facinora.\n\nMater bona, nobis dona\ntuum patrocinium,\nut regnemus et laudemus\ntuum semper Filium."}, {"id": "b12", "order": 12, "title": "Jesu dulcis memoria", "title_ar": "يا يسوع، ما أعذب ذكرك", "sec": "lat", "lang": "la", "body": "Jesu, dulcis memoria,\ndans vera cordis gaudia:\nsed super mel et omnia,\nejus dulcis praesentia.\n\nNil canitur suavius,\nnil auditur jucundius,\nnil cogitatur dulcius,\nquam Jesus Dei Filius.\n\nJesu, spes paenitentibus,\nquam pius es petentibus!\nQuam bonus te quaerentibus!\nSed quid invenientibus?\n\nNec lingua valet dicere,\nnec littera exprimere:\nexpertus potest credere,\nquid sit Jesum diligere.\n\nSis, Jesu, nostrum gaudium,\nqui es futurus praemium:\nsit nostra in te gloria\nper cuncta semper saecula. Amen."}, {"id": "b13", "order": 13, "title": "Jesu tibi vivo", "title_ar": "يا يسوع، لك أحيا", "sec": "lat", "lang": "la", "body": "Jesu tibi vivo;\nJesu tibi morior.\nJesu sive vivo, sive morior\ntuus sum."}, {"id": "b14", "order": 14, "title": "Non nobis", "title_ar": "ليس لنا يا رب", "sec": "lat", "lang": "la", "body": "Non nobis, Domine, Domine,\nnon nobis, Domine,\nsed nomini, sed nomini tuo da gloriam."}, {"id": "b15", "order": 15, "title": "O filii et filiae", "title_ar": "أيها الأبناء والبنات", "sec": "lat", "lang": "la", "body": "> Alleluia, alleluia, alleluia!\n\nO filii et filiae,\nRex coelestis, Rex gloriae\nmorte surrexit hodie, alleluia.\n\nEt mane prima sabbati\nad ostium monumenti\naccesserunt discipuli, alleluia.\n\nEt Maria Magdalena\net Jacobi et Salome\nvenerunt corpus ungere, alleluia.\n\nIn albis sedens Angelus\npraedixit mulieribus:\nin Galilaea est Dominus, alleluia.\n\nIn hoc festo sanctissimo\nsit laus et jubilatio,\nbenedicamus Domino, alleluia.\n\nDe quibus nos humillimas\ndevotas atque debitas\nDeo dicamus gratias, alleluia."}, {"id": "b16", "order": 16, "title": "O spes mea cara", "title_ar": "يا رجائي العزيز", "sec": "lat", "lang": "la", "body": "O spes mea cara, Maria praeclara,\ne valle amara imploro te.\nExaudi precantem, solare clamantem,\nconfirma labantem, et serva me.\n\nPer blanda, per dura, ad non peritura,\no fortis, o pura, duc debilem.\nDum turget procella et suscitat bella,\nad portum, o stella, duc exulem.\n\nPatrona decora, in exitus hora\npro me, Mater, ora tu Filium,\nut inserar gratis, remissis peccatis,\ncatervis beatis coelestium."}, {"id": "b17", "order": 17, "title": "Omni die", "title_ar": "كل يوم", "sec": "lat", "lang": "la", "body": "Omni die, dic Mariae\nmea laudes anima;\neius festa, eius gesta\ncole splendidissima.\n\nPulchra tota, sine nota\ncuiuscumque maculae,\nfac me mundum et iucundum\nte laudare sedule.\n\nUt sim castus et modestus,\ndulcis, blandus, sobrius,\npius, rectus, circumspectus,\nsimultatis nescius.\n\nEruditus et munitus\ndivinis eloquiis,\ntimoratus et ornatus\nsacris exercitiis.\n\nVirgo sancta, cerne quanta\nperferamus jugiter\ntentamenta, et sustenta\nnos ut stemus fortiter.\n\nEsto tutrix et adiutrix\nchristiani populi;\npacem praesta, ne molesta\nnos perturbent saecula.\nAmen."}, {"id": "b18", "order": 18, "title": "Polorum regina", "title_ar": "يا ملكة السماوات", "sec": "lat", "lang": "la", "body": "> Polorum regina omnium nostra.\n> Stella matutina, dele scelera.\n\nAnte partum virgo Deo gravida\nsemper permansisti inviolata.\nStella matutina, dele scelera.\n\nEt in partu virgo Deo fecunda\nsemper permansisti inviolata.\nStella matutina, dele scelera.\n\nEt post partum virgo mater enixa\nsemper permansisti inviolata.\nStella matutina, dele scelera."}, {"id": "b19", "order": 19, "title": "Prosternimus preces", "title_ar": "نرفع إليك صلواتنا ساجدين", "sec": "lat", "lang": "la", "body": "Prosternimus preces ante faciem tuam,\nparce Christe:\n\n> Et exaudi, populo supplicanti miserere.\n\nQui triumpho Crucis tuae\nsalvasti solus orbem,\ntu cruoris tui\npoena nos libera.\n\nQui moriens mortem damnas,\nresurgens vitam praestas,\nsustines pro nobis\npoenam indebitam.\n\nPassionis tuae dies\ncelebremus indemnes:\nut per hoc dulcedo\ntua nos foveat.\n\nPro quibus es passus crucem,\nnon permittas perire:\nsed per crucem duc\nad vitam perpetuam."}, {"id": "b20", "order": 20, "title": "Regina coeli", "title_ar": "افرحي يا ملكة السماء", "sec": "lat", "lang": "la", "body": "Regina coeli, laetare, alleluia.\nQuia quem meruisti portare, alleluia.\nResurrexit, sicut dixit, alleluia.\nOra pro nobis Deum, alleluia."}, {"id": "b21", "order": 21, "title": "Resonet in laudibus", "title_ar": "لتتردّد التسابيح", "sec": "lat", "lang": "la", "body": "Resonet in laudibus\ncum jucundis plausibus,\nSion cum fidelibus.\nApparuit quem genuit Maria.\n\n> Gaudete, gaudete, Christus natus hodie!\n> Gaudete, gaudete, ex Maria Virgine.\n\nPueri concinite,\nnato regi psallite,\nvoce pia dicite:\nApparuit quem genuit Maria.\n\nSion lauda Dominum,\nsalvatorem hominum,\nlavatorem criminum.\nApparuit quem genuit Maria."}, {"id": "b22", "order": 22, "title": "Rorate coeli desuper", "title_ar": "اقطري أيتها السماوات من فوق", "sec": "lat", "lang": "la", "body": "> Rorate coeli desuper\n> et nubes pluant Iustum.\n\nNe irascaris Domine,\nne ultra memineris iniquitatis:\necce civitas Sancti facta est deserta,\nSion deserta facta est;\nJerusalem desolata est,\ndomus sanctificationis tuae et gloriae tuae,\nubi laudaverunt te patres nostri.\n\nPeccavimus,\net facti sumus tamquam immundus nos,\net cecidimus quasi folium universi,\net iniquitates nostrae\nquasi ventus abstulerunt nos:\nabscondisti faciem tuam a nobis,\net allisisti nos in manu iniquitatis nostrae.\n\nVide Domine afflictionem populi tui\net mitte quem missurus es;\nemitte Agnum dominatorem terrae\nde petra deserti ad montem filiae Sion,\nut auferat ipse jugum captivitatis nostrae.\n\nConsolamini, consolamini, popule meus,\ncito veniet salus tua;\nquare moerore consumeris,\nquia innovavit te dolor?\nSalvabo te, noli timere;\nego enim sum Dominus Deus tuus,\nSanctus Israel, Redemptor tuus."}, {"id": "b23", "order": 23, "title": "Salve Regina", "title_ar": "السلام عليكِ أيتها الملكة", "sec": "lat", "lang": "la", "body": "Salve, Regina, mater misericordiae;\nvita, dulcedo et spes nostra, salve.\nAd te clamamus, exules filii Evae,\nad te suspiramus, gementes et flentes\nin hac lacrimarum valle.\nEia ergo, advocata nostra,\nillos tuos misericordes oculos\nad nos converte.\nEt Jesum, benedictum fructum ventris tui,\nnobis post hoc exilium ostende.\nO clemens, o pia,\no dulcis virgo Maria."}, {"id": "b24", "order": 24, "title": "Ubi caritas et amor", "title_ar": "حيث المحبة والمودة", "sec": "lat", "lang": "la", "body": "> Ubi caritas et amor, Deus ibi est.\n\nCongregavit nos in unum Christi amor:\nexultemus et in ipso jucundemur.\nTimeamus et amemus Deum vivum\net ex corde diligamus nos sincero.\n\nSimul ergo cum in unum congregamur,\nne nos mente dividamur caveamus.\nCessent jurgia maligna, cessent lites\net in medio nostri sit Christus Deus.\n\nSimul quoque cum beatis videamus\nglorianter vultum tuum, Christe Deus:\ngaudium, quod est immensum atque probum,\nsaecula per infinita saeculorum. Amen."}, {"id": "b25", "order": 25, "title": "Altissima luce", "title_ar": "يا نورًا عليًّا", "sec": "laudi", "lang": "it", "body": "> Altissima luce col grande splendore,\n> in voi, dolze amore, aggiam consolanza.\n\nAve, regina, pulzella amorosa,\nstella marina che non stai nascosa,\nluce divina, virtù grazïosa,\nbelleza formosa: de Dio se' semblanza!\n\nTemplo sacrato, ornato vasello,\nannunzïato da san Gabriello,\nCristo è 'ncarnato nel tuo ventre bello,\nfrutto novello cum gran delettanza.\n\nFresca rivera ornata di fiori,\ntu se' la spera di tutti i colori:\nguida la schiera di noi peccatori,\nsì ch'asavori de tua beninanza."}, {"id": "b26", "order": 26, "title": "Ave donna santissima", "title_ar": "السلام أيتها السيدة الكلية القداسة", "sec": "laudi", "lang": "it", "body": "> Ave donna santissima,\n> Regina potentissima.\n\nLa virtù celestïale\ncon la grazia supernale\nen te virgo virginale\ndiscese benignissima.\n\nLa nostra redenzïone\nprese incarnazïone\nin santa concezïone\nda te Madre purïssima.\n\nAltresì per tuo candore\nsovra il mondo del dolore\nvenne il sole dell'amore\nnei cieli beatissima."}, {"id": "b27", "order": 27, "title": "Da ciel venne messo novello", "title_ar": "من السماء جاء رسول جديد", "sec": "laudi", "lang": "it", "body": "> Da ciel venne messo novello,\n> ciò fo l'angel Gabriello.\n\nNella cità di Galilea\nch'è chiamata Nazarèth,\nlà u la Vergin nacque e stette\nsposa era di Joseffe.\n\nL'angelo fo messo da Dio,\nben comenzò e ben finio:\nsaviamente, senza rio,\nannuntiò lo suo libello:\n\n«Ave Maria, gratia plena,\nDio ti salvi, stella serena!\nDio è con teco che ti mena\nenn el paradiso bello»."}, {"id": "b28", "order": 28, "title": "Da mi conforto, Dio", "title_ar": "هبني العزاء يا الله", "sec": "laudi", "lang": "it", "body": "> Da mi conforto, Dio, et allegranza\n> et carità perfecta et amoranza.\n\nDa mi conforto, Dio, et ardore,\na caritade lega lo mio core;\n\nche non mi sia vetato lo tuo amore,\nin me non possa nulla ria indignanza.\n\nDa mi letizia, gaudio e diporto\ne nel mio cor da' pianto di conforto;\n\nche io suspiri e canti e stia sì dotto,\nche io non perda la tua fin amanza."}, {"id": "b29", "order": 29, "title": "De la crudel morte del Cristo", "title_ar": "على موت المسيح القاسي", "sec": "laudi", "lang": "it", "body": "> De la crudel morte del Cristo\n> ogn'om pianga amaramente.\n\nQuando Juderi Cristo pilïaro,\nd'ogne parte lo circumdaro,\nle sue mane strecto legaro,\ncomo ladro villanamente.\n\nTrenta denar fo lo mercato\nche fece Juda e fo pagato:\nmellio li fora non esser nato\nch'aver peccato sì duramente.\n\nA la colonna fu spolïato,\nper tutto 'l corpo flagellato,\nd'ogne parte fo 'nsanguinato\ncommo falso amaramente.\n\nTutti gridaro ad alta voce:\n\"Moia 'l falso, moia veloce;\nsbrigatamente sia posto en croce,\nche non turbi tutta la gente\".\n\nLi soi compagni l'abbandonaro,\ntutti fugiero e lui lassaro;\nstando tormento forte ed amaro\nde lo suo corpo per la gente.\n\nMolt'era trista santa Maria\nquando 'l suo figlio en croce vedea;\ncum gran dolore forte piangea\ndicendo: \"Trista, lassa, dolente\"."}, {"id": "b30", "order": 30, "title": "Gloria 'n cielo", "title_ar": "المجد في السماء", "sec": "laudi", "lang": "it", "body": "> Gloria 'n cielo e pace 'n terra:\n> nat'è 'l nostro Salvatore!\n\nNat'è Cristo glorïoso,\nl'alto Dio maravellioso,\nfatto è hom desideroso\nlo benigno Creatore.\n\nPace 'n terra sia cantata,\ngloria in ciel desiderata,\nla donzella consacrata\nparturit' à 'l Salvatore."}, {"id": "b31", "order": 31, "title": "Laude novella", "title_ar": "مديح جديد", "sec": "laudi", "lang": "it", "body": "> Laude novella sia cantata\n> a l'alta donna encoronata.\n\nFresca vergene donzella,\nprimo fior, rosa novella,\ntutto 'l mondo a te s'appella;\nnella bonor fosti nata.\n\nFonte se' d'acqua surgente,\nmadre de Dio vivente;\ntu se' luce de la gente,\nsovra li angeli esaltata.\n\nTu se' verga, tu se' fiore,\ntu se' luna de splendore;\nvoluntà avemo e core\nde venir a te, ornata.\n\nArcha se' d'umilitade,\nvaso d'ogne sanctitade:\nen te venne deitade;\nd'angel foste salutata.\n\nPregot', avocata mia,\nche ne metti en bona via:\nquesta nostra compania\nsiate sempre commendata."}, {"id": "b32", "order": 32, "title": "Ma vïele", "title_ar": "كمانجتي", "sec": "laudi", "lang": "fr", "body": "Ma vïele, vïeler vieut un biau son\nde la bele qui seur toutes a biau nom.\nEn qui Dieux devenir hom voult jadis,\ndont chantent en Paradis\nanges et archanges a haut ton.\n\nPorte dou ciel, du Paradis planche et ponz,\nsourse de miel, de doucer pecine et fonz;\nd'enfer qui tant est parfonz, nous desfen,\nqui en doute a pauvre sens\ncar enfer n'a rive ni fond!\n\nDouce Dame, par mout vraie entencïon\ncors et ame, met je en ta protecïon;\nprie sanz delatïon ten fil douz\nqu'il nos face vivre touz\nin terra viventium. (Amen)."}, {"id": "b33", "order": 33, "title": "Ognun m'entenda", "title_ar": "ليسمعني كل واحد", "sec": "laudi", "lang": "it", "body": "> Ognun m'entenda divotamente\n> lo pianto che fece Maria dolente\n> del suo figliol tanto dilicato.\n\nO Jesu Christo, bello mio figlio,\no Jesu bello, bianco e vermeglio,\no de la trista Madre el conseglio\nsu ne la croce già conficato."}, {"id": "b34", "order": 34, "title": "Omne homo ad alta voce", "title_ar": "ليسبّح كل إنسان بصوت عالٍ", "sec": "laudi", "lang": "it", "body": "> Omne homo ad alta voce\n> laudi la verace Croce.\n\nQuant'è digna de laudare:\ncore non lo po' pensare,\nlengua ne lo po' contare,\nla verace santa Croce.\n\nQuesto legno prezioso\nè ne segno vertüoso,\nlo nimico ha confuso\nper la forza de la Croce."}, {"id": "b35", "order": 35, "title": "Troppo perde il tempo", "title_ar": "يضيّع وقته كثيرًا", "sec": "laudi", "lang": "it", "body": "> Troppo perde il tempo chi ben non t'ama,\n> dolc'amor Jesù sovr'ogni amore.\n\nAmor, chi t'ama non sta ozioso,\ntanto li par dolze de Te gustare;\nma tutto sor vive desideroso\ncome te possa stretto più amare;\nchè tanto sta per te lo cor gioioso:\nchi non sentisse nol saprie parlare\nquant'è dolz'a gustare lo tuo savore.\n\nSavor cui non si trova simillianza,\no lasso! Lo mio cor poco t'asaggia;\nnull'altra cosa non m'è consolanza,\nse tutto 'l mondo avesse e te non agio.\nO dulz'amor Jesù in cui ho speranza,\ntu regi mio cor che da te non caggia,\nma sempre più restringa 'l tuo dolzore.\n\nDulcior che tolli forza ad ogni amaro\net ogne cosa muti in tua dulcezza;\nquesto sanno li sancti che 'l provaro\nche feciar dolze morte in amarezza,\nma confortolli el dolze latovare\ndi te Jesù che vensar ogni asprezza,\ntanto fosti suave in li lor cori.\n\nCor che te non sente ben pò star tristo,\nJesù, letitia e gaudio de la gente;\nsolazo non pot'essar senza Cristo;\ntaupino ch'eo non t'amo ben fervente!\nChi far potesse totto ogni altro acquisto\ne te non aggia di tutt'è perdente;\ne senza te sirebbe in amarore.\n\nServire a Te, Jesù, mi' amoroso,\npiù soav'è che nul altro delecto;\nnon può saper chi di Te sta otïoso\nquant'è dolze ad amar Te con affecto:\ngemai el cor non trova altro riposo\nsi non se en Te, Jesù, amor perfecto\nche de li tuoi servi se' consolatore."}, {"id": "b36", "order": 36, "title": "Tutor dicendo", "title_ar": "أقولها دائمًا", "sec": "laudi", "lang": "it", "body": "Tutor dicendo, di lui non tacendo,\nlaudandol cum cantare.\n\n> Jesù, Jesù,\n> Jesù dolce ad amare.\n\nSempre l'atendo, col mio cor gaudendo,\nfa mi rallegrare.\n\nNon mi ritegno, da mi' gran sostegno,\ne vogliol pur chiamare.\n\nVo' che mi dica la mia dolce vita,\nche mi farà salvare.\n\nAmor diletto, del mio cor se' vita,\nor damit'a trovare!\n\nTra'mi a te di questo gran tormento,\nchè vivo in dolorare!\n\nCh'io non ti perda per mio fallimento,\ncum falso tentare.\n\nVivo in paura di te mia dolzura,\ncome ne posso fare?\n\nTu se' il mio áire, io son tua creatura,\nnon m'abandonare!\n\nNon averò povertà, né difetto,\ne vo' con teco stare!"}, {"id": "b37", "order": 37, "title": "Venite a laudare", "title_ar": "تعالوا نسبّح", "sec": "laudi", "lang": "it", "body": "> Venite a laudare,\n> per amore cantare\n> l'amorosa vergene Maria!\n\nMaria gloriosa, biata,\nsempre si' molto laudata:\npreghiam che ne si' avocata\nal tuo filiol, virgo pia!\n\nDa tutte le genti invocata\nper te è questa laude cantata:\ntu sei Madre nostra adorata\nla più fedel che mai sia."}, {"id": "b38", "order": 38, "title": "Voi ch'amate lo Criatore", "title_ar": "يا من تحبّون الخالق", "sec": "laudi", "lang": "it", "body": "> Voi ch'amate lo Criatore,\n> ponete mente a lo meo dolore.\n\nCh'io son Maria co' lo cor tristo\nla quale avea per figliuol Cristo:\nla speme mia e dolce acquisto\nfue crocifisso per li peccatori.\n\nCapo bello e delicato,\ncome ti veggio stare enchinato;\nli tuoi capelli di sangue intrecciati,\nfin a la barba ne va irrigore.\n\nBocca bella e delicata,\ncome ti veggio stare asserrata;\ndi fiele e aceto fosti abbeverata,\ntrista e dolente dentr'al mio core."}];
const PRAYERS = [{"id": "angelus", "it": "Angelus", "ar": "مَلَاكُ الرَّبِّ", "tr": "malāku r-rabb", "lines": [{"r": "V", "ar": "مَلَاكُ الرَّبِّ بَشَّرَ مَرْيَمَ،", "tr": "malāku r-rabbi bashshara maryam,", "it": "L’Angelo del Signore portò l’annuncio a Maria"}, {"r": "R", "ar": "وَالعَذْرَاءُ حَبِلَتْ مِنَ الرُّوحِ القُدُسِ.", "tr": "wa-l-عadhrāʾu ḥabilat mina r-rūḥi l-qudus.", "it": "E la Vergine concepì per opera dello Spirito Santo."}, {"r": "V", "ar": "هَا أَنَا أَمَةُ الرَّبِّ.", "tr": "hā ana amatu r-rabb.", "it": "Ecco la serva del Signore."}, {"r": "R", "ar": "فَلْيَكُنْ لِي بِحَسَبِ قَوْلِكَ.", "tr": "fa-l-yakun lī bi-ḥasabi qawlika.", "it": "Mi accada secondo la tua parola."}, {"r": "V", "ar": "وَالكَلِمَةُ صَارَ جَسَدًا.", "tr": "wa-l-kalimatu ṣāra jasadā.", "it": "E il Verbo si è fatto carne."}, {"r": "R", "ar": "وَيَسْكُنُ بَيْنَنَا.", "tr": "wa-yaskunu baynanā.", "it": "Ed abita in mezzo a noi."}, {"r": "title", "it": "Ave Maria", "ar": "السَّلَامُ عَلَيْكِ يَا مَرْيَمُ", "tr": "as-salāmu عalayki yā maryamu"}, {"r": "V", "ar": "صَلِّي لِأَجْلِنَا يَا وَالِدَةَ اللهِ القِدِّيسَةَ.", "tr": "ṣallī li-ajlinā yā wālidata llāhi l-qiddīsa.", "it": "Prega per noi, santa Madre di Dio."}, {"r": "R", "ar": "لِكَيْ نَصِيرَ أَهْلًا لِمَوَاعِيدِ المَسِيحِ.", "tr": "li-kay naṣīra ahlan li-mawāعīdi l-masīḥ.", "it": "Perché diventiamo degni delle promesse di Cristo."}, {"r": "sep"}, {"r": "V", "ar": "أَفِضْ يَا رَبُّ نِعْمَتَكَ فِي قُلُوبِنَا،", "tr": "afiḍ yā rabbu niعmataka fī qulūbinā,", "it": "Infondi, Signore, la tua grazia nei nostri cuori,"}, {"r": "C", "ar": "حَتَّى نُقَادَ نَحْنُ الَّذِينَ عَرَفْنَا بِبِشَارَةِ المَلَاكِ", "tr": "ḥattā nuqāda naḥnu lladhīna عarafnā bi-bishārati l-malāki", "it": "affinché noi, che abbiamo conosciuto per l’annuncio dell’Angelo"}, {"r": "C", "ar": "تَجَسُّدَ ابْنِكَ يَسُوعَ المَسِيحِ،", "tr": "tajassuda bnika yasūعa l-masīḥ,", "it": "l’Incarnazione del Figlio tuo Gesù Cristo,"}, {"r": "C", "ar": "بِآلَامِهِ وَمَوْتِهِ إِلَى مَجْدِ قِيَامَتِهِ.", "tr": "bi-ālāmihi wa-mawtihi ilā majdi qiyāmatihi.", "it": "attraverso la sua Passione e Morte siamo condotti alla gloria della sua Risurrezione."}, {"r": "C", "ar": "بِالمَسِيحِ رَبِّنَا. آمِين.", "tr": "bi-l-masīḥi rabbinā. āmīn.", "it": "Per Cristo nostro Signore. Amen."}, {"r": "inc", "it": "Gloria al Padre", "ar": "المَجْدَلَةُ", "tr": "al-majdala", "lines": [{"r": "", "ar": "المَجْدُ لِلآبِ وَالابْنِ وَالرُّوحِ القُدُسِ،", "tr": "al-majdu li-l-ābi wa-l-ibni wa-r-rūḥi l-qudus,", "it": "Gloria al Padre e al Figlio e allo Spirito Santo,"}, {"r": "", "ar": "الآنَ وَكُلَّ أَوَانٍ، وَإِلَى دَهْرِ الدَّاهِرِينَ. آمِين.", "tr": "al-āna wa-kulla awān, wa-ilā dahri d-dāhirīn. āmīn.", "it": "ora e in ogni tempo, e nei secoli dei secoli. Amen."}]}], "note": "Testo italiano dal libretto «Inni» (Preghiere, p. 49). Si recita al mattino, a mezzogiorno e alla sera."}, {"id": "segno", "it": "Segno della croce", "ar": "إِشَارَةُ الصَّلِيبِ", "tr": "ishāratu ṣ-ṣalīb", "lines": [{"r": "", "ar": "بِاسْمِ الآبِ وَالابْنِ وَالرُّوحِ القُدُسِ، الإِلٰهِ الوَاحِدِ. آمِين.", "tr": "bi-smi l-ābi wa-l-ibni wa-r-rūḥi l-qudus, al-ilāhi l-wāḥid. āmīn.", "it": "Nel nome del Padre e del Figlio e dello Spirito Santo, unico Dio. Amen."}], "grp": "main"}, {"id": "pater", "it": "Padre nostro", "ar": "الصَّلَاةُ الرَّبِّيَّةُ", "tr": "aṣ-ṣalātu r-rabbiyya", "lines": [{"r": "", "ar": "أَبَانَا الَّذِي فِي السَّمَاوَاتِ،", "tr": "abāna lladhī fi s-samāwāt,", "it": "Padre nostro, che sei nei cieli,"}, {"r": "", "ar": "لِيَتَقَدَّسِ اسْمُكَ،", "tr": "li-yataqaddasi smuka,", "it": "sia santificato il tuo nome,"}, {"r": "", "ar": "لِيَأْتِ مَلَكُوتُكَ،", "tr": "li-yaʾti malakūtuka,", "it": "venga il tuo regno,"}, {"r": "", "ar": "لِتَكُنْ مَشِيئَتُكَ، كَمَا فِي السَّمَاءِ كَذٰلِكَ عَلَى الأَرْضِ.", "tr": "li-takun mashīʾatuka, kamā fi s-samāʾi kadhālika عala l-arḍ.", "it": "sia fatta la tua volontà, come in cielo così in terra."}, {"r": "", "ar": "أَعْطِنَا خُبْزَنَا كَفَافَ يَوْمِنَا،", "tr": "aعṭinā khubzanā kafāfa yawminā,", "it": "Dacci il nostro pane, quanto basta per oggi,"}, {"r": "", "ar": "وَاغْفِرْ لَنَا ذُنُوبَنَا وَخَطَايَانَا،", "tr": "wa-ghfir lanā dhunūbanā wa-khaṭāyānā,", "it": "e rimetti a noi i nostri debiti e i nostri peccati,"}, {"r": "", "ar": "كَمَا نَحْنُ نَغْفِرُ لِمَنْ خَطِئَ وَأَسَاءَ إِلَيْنَا،", "tr": "kamā naḥnu naghfiru li-man khaṭiʾa wa-asāʾa ilaynā,", "it": "come anche noi perdoniamo a chi ha peccato e ci ha offeso,"}, {"r": "", "ar": "وَلَا تُدْخِلْنَا فِي التَّجَارِبِ،", "tr": "wa-lā tudkhilnā fi t-tajārib,", "it": "e non ci indurre nelle tentazioni,"}, {"r": "", "ar": "لٰكِنْ نَجِّنَا مِنَ الشِّرِّيرِ. آمِين.", "tr": "lākin najjinā mina sh-shirrīr. āmīn.", "it": "ma liberaci dal Maligno. Amen."}], "grp": "main"}, {"id": "ave", "it": "Ave Maria", "ar": "السَّلَامُ عَلَيْكِ يَا مَرْيَمُ", "tr": "as-salāmu عalayki yā maryamu", "lines": [{"r": "", "ar": "السَّلَامُ عَلَيْكِ يَا مَرْيَمُ،", "tr": "as-salāmu عalayki yā maryam,", "it": "Ave, o Maria,"}, {"r": "", "ar": "يَا مُمْتَلِئَةً نِعْمَةً، الرَّبُّ مَعَكِ.", "tr": "yā mumtaliʾatan niعma, ar-rabbu maعaki.", "it": "piena di grazia, il Signore è con te."}, {"r": "", "ar": "مُبَارَكَةٌ أَنْتِ فِي النِّسَاءِ،", "tr": "mubārakatun anti fi n-nisāʾ,", "it": "Tu sei benedetta fra le donne"}, {"r": "", "ar": "وَمُبَارَكَةٌ ثَمَرَةُ بَطْنِكِ يَسُوعُ.", "tr": "wa-mubārakatun thamaratu baṭniki yasūع.", "it": "e benedetto è il frutto del tuo seno, Gesù."}, {"r": "", "ar": "يَا قِدِّيسَةُ مَرْيَمُ، يَا وَالِدَةَ اللهِ،", "tr": "yā qiddīsatu maryam, yā wālidata llāh,", "it": "Santa Maria, Madre di Dio,"}, {"r": "", "ar": "صَلِّي لِأَجْلِنَا نَحْنُ الخَطَأَةَ،", "tr": "ṣallī li-ajlinā naḥnu l-khaṭaʾa,", "it": "prega per noi peccatori,"}, {"r": "", "ar": "الآنَ وَفِي سَاعَةِ مَوْتِنَا. آمِين.", "tr": "al-āna wa-fī sāعati mawtinā. āmīn.", "it": "adesso e nell’ora della nostra morte. Amen."}], "grp": "main"}, {"id": "gloria", "it": "Gloria al Padre", "ar": "المَجْدَلَةُ", "tr": "al-majdala", "lines": [{"r": "", "ar": "المَجْدُ لِلآبِ وَالابْنِ وَالرُّوحِ القُدُسِ،", "tr": "al-majdu li-l-ābi wa-l-ibni wa-r-rūḥi l-qudus,", "it": "Gloria al Padre e al Figlio e allo Spirito Santo,"}, {"r": "", "ar": "الآنَ وَكُلَّ أَوَانٍ، وَإِلَى دَهْرِ الدَّاهِرِينَ. آمِين.", "tr": "al-āna wa-kulla awān, wa-ilā dahri d-dāhirīn. āmīn.", "it": "ora e in ogni tempo, e nei secoli dei secoli. Amen."}], "grp": "main"}, {"id": "credo-niceno", "it": "Credo niceno-costantinopolitano", "ar": "قَانُونُ الإِيمَانِ النِّيقَاوِيُّ", "tr": "qānūnu l-īmāni n-nīqāwī", "lines": [{"r": "", "ar": "نُؤْمِنُ بِإِلٰهٍ وَاحِدٍ، آبٍ ضَابِطِ الكُلِّ،", "tr": "nuʾminu bi-ilāhin wāḥid, ābin ḍābiṭi l-kull,", "it": "Crediamo in un solo Dio, Padre onnipotente,"}, {"r": "", "ar": "خَالِقِ السَّمَاءِ وَالأَرْضِ، كُلِّ مَا يُرَى وَمَا لَا يُرَى.", "tr": "khāliqi s-samāʾi wa-l-arḍ, kulli mā yurā wa-mā lā yurā.", "it": "creatore del cielo e della terra, di tutte le cose visibili e invisibili."}, {"r": "", "ar": "وَبِرَبٍّ وَاحِدٍ يَسُوعَ المَسِيحِ، ابْنِ اللهِ الوَحِيدِ،", "tr": "wa-bi-rabbin wāḥidin yasūعa l-masīḥ, ibni llāhi l-waḥīd,", "it": "E in un solo Signore, Gesù Cristo, unigenito Figlio di Dio,"}, {"r": "", "ar": "المَوْلُودِ مِنَ الآبِ قَبْلَ كُلِّ الدُّهُورِ،", "tr": "al-mawlūdi mina l-ābi qabla kulli d-duhūr,", "it": "nato dal Padre prima di tutti i secoli:"}, {"r": "", "ar": "إِلٰهٍ مِنْ إِلٰهٍ، نُورٍ مِنْ نُورٍ، إِلٰهٍ حَقٍّ مِنْ إِلٰهٍ حَقٍّ،", "tr": "ilāhin min ilāh, nūrin min nūr, ilāhin ḥaqqin min ilāhin ḥaqq,", "it": "Dio da Dio, Luce da Luce, Dio vero da Dio vero,"}, {"r": "", "ar": "مَوْلُودٍ غَيْرِ مَخْلُوقٍ، مُسَاوٍ لِلآبِ فِي الجَوْهَرِ،", "tr": "mawlūdin ghayri makhlūq, musāwin li-l-ābi fi l-jawhar,", "it": "generato, non creato, della stessa sostanza del Padre;"}, {"r": "", "ar": "الَّذِي بِهِ كَانَ كُلُّ شَيْءٍ.", "tr": "alladhī bihi kāna kullu shayʾ.", "it": "per mezzo di lui tutte le cose sono state create."}, {"r": "", "ar": "الَّذِي مِنْ أَجْلِنَا نَحْنُ البَشَرَ، وَمِنْ أَجْلِ خَلَاصِنَا، نَزَلَ مِنَ السَّمَاءِ،", "tr": "alladhī min ajlinā naḥnu l-bashar, wa-min ajli khalāṣinā, nazala mina s-samāʾ,", "it": "Per noi uomini e per la nostra salvezza discese dal cielo,"}, {"r": "", "ar": "وَتَجَسَّدَ مِنَ الرُّوحِ القُدُسِ وَمِنْ مَرْيَمَ العَذْرَاءِ، وَتَأَنَّسَ.", "tr": "wa-tajassada mina r-rūḥi l-qudusi wa-min maryama l-عadhrāʾ, wa-taʾannas.", "it": "si è incarnato per opera dello Spirito Santo e da Maria Vergine, e si è fatto uomo."}, {"r": "", "ar": "وَصُلِبَ عَنَّا عَلَى عَهْدِ بِيلَاطُسَ البُنْطِيِّ،", "tr": "wa-ṣuliba عannā عalā عahdi bīlāṭusa l-bunṭī,", "it": "Fu crocifisso per noi sotto Ponzio Pilato,"}, {"r": "", "ar": "وَتَأَلَّمَ وَقُبِرَ،", "tr": "wa-taʾallama wa-qubir,", "it": "patì e fu sepolto."}, {"r": "", "ar": "وَقَامَ فِي اليَوْمِ الثَّالِثِ كَمَا فِي الكُتُبِ،", "tr": "wa-qāma fi l-yawmi th-thālithi kamā fi l-kutub,", "it": "Il terzo giorno è risuscitato, secondo le Scritture,"}, {"r": "", "ar": "وَصَعِدَ إِلَى السَّمَاءِ، وَجَلَسَ عَنْ يَمِينِ الآبِ،", "tr": "wa-ṣaعida ila s-samāʾ, wa-jalasa عan yamīni l-āb,", "it": "è salito al cielo, siede alla destra del Padre."}, {"r": "", "ar": "وَأَيْضًا يَأْتِي بِمَجْدٍ لِيَدِينَ الأَحْيَاءَ وَالأَمْوَاتَ،", "tr": "wa-ayḍan yaʾtī bi-majdin li-yadīna l-aḥyāʾa wa-l-amwāt,", "it": "E di nuovo verrà, nella gloria, per giudicare i vivi e i morti,"}, {"r": "", "ar": "الَّذِي لَا فَنَاءَ لِمُلْكِهِ.", "tr": "alladhī lā fanāʾa li-mulkihi.", "it": "e il suo regno non avrà fine."}, {"r": "", "ar": "وَنُؤْمِنُ بِالرُّوحِ القُدُسِ، الرَّبِّ المُحْيِي،", "tr": "wa-nuʾminu bi-r-rūḥi l-qudus, ar-rabbi l-muḥyī,", "it": "Crediamo nello Spirito Santo, che è Signore e dà la vita,"}, {"r": "", "ar": "المُنْبَثِقِ مِنَ الآبِ وَالابْنِ،", "tr": "al-munbathiqi mina l-ābi wa-l-ibn,", "it": "e procede dal Padre e dal Figlio."}, {"r": "", "ar": "الَّذِي هُوَ مَعَ الآبِ وَالابْنِ يُسْجَدُ لَهُ وَيُمَجَّدُ،", "tr": "alladhī huwa maعa l-ābi wa-l-ibni yusjadu lahu wa-yumajjad,", "it": "Con il Padre e il Figlio è adorato e glorificato,"}, {"r": "", "ar": "النَّاطِقِ بِالأَنْبِيَاءِ.", "tr": "an-nāṭiqi bi-l-anbiyāʾ.", "it": "e ha parlato per mezzo dei profeti."}, {"r": "", "ar": "وَبِكَنِيسَةٍ وَاحِدَةٍ، جَامِعَةٍ، مُقَدَّسَةٍ، رَسُولِيَّةٍ.", "tr": "wa-bi-kanīsatin wāḥida, jāmiعa, muqaddasa, rasūliyya.", "it": "Crediamo la Chiesa, una, cattolica, santa e apostolica."}, {"r": "", "ar": "وَنَعْتَرِفُ بِمَعْمُودِيَّةٍ وَاحِدَةٍ لِمَغْفِرَةِ الخَطَايَا.", "tr": "wa-naعtarifu bi-maعmūdiyyatin wāḥidatin li-maghfirati l-khaṭāyā.", "it": "Professiamo un solo battesimo per il perdono dei peccati."}, {"r": "", "ar": "وَنَتَرَجَّى قِيَامَةَ المَوْتَى، وَالحَيَاةَ فِي الدَّهْرِ الآتِي. آمِين.", "tr": "wa-natarajjā qiyāmata l-mawtā, wa-l-ḥayāta fi d-dahri l-ātī. āmīn.", "it": "Aspettiamo la risurrezione dei morti e la vita del mondo che verrà. Amen."}], "note": "Il Credo della Messa; si recita anche all’inizio del Rosario.", "grp": "main"}, {"id": "salve", "it": "Salve Regina", "ar": "السَّلَامُ عَلَيْكِ أَيَّتُهَا المَلِكَةُ", "tr": "as-salāmu عalayki ayyatuha l-malika", "lines": [{"r": "", "ar": "السَّلَامُ عَلَيْكِ أَيَّتُهَا المَلِكَةُ، يَا أُمَّ الرَّحْمَةِ،", "tr": "as-salāmu عalayki ayyatuha l-malika, yā umma r-raḥma,", "it": "Salve, Regina, Madre di misericordia,"}, {"r": "", "ar": "يَا حَيَاتَنَا وَعُذُوبَتَنَا وَرَجَاءَنَا، السَّلَامُ عَلَيْكِ.", "tr": "yā ḥayātanā wa-عudhūbatanā wa-rajāʾanā, as-salāmu عalayki.", "it": "vita, dolcezza e speranza nostra, salve."}, {"r": "", "ar": "إِلَيْكِ نَصْرُخُ نَحْنُ المَنْفِيِّينَ أَوْلَادَ حَوَّاءَ،", "tr": "ilayki naṣrukhu naḥnu l-manfiyyīna awlāda ḥawwāʾ,", "it": "A te gridiamo, noi esuli figli di Eva;"}, {"r": "", "ar": "وَإِلَيْكِ نَتَنَهَّدُ نَائِحِينَ وَبَاكِينَ فِي هٰذَا الوَادِي، وَادِي الدُّمُوعِ.", "tr": "wa-ilayki natanahhadu nāʾiḥīna wa-bākīna fī hādha l-wādī, wādi d-dumūع.", "it": "a te sospiriamo, gementi e piangenti in questa valle di lacrime."}, {"r": "", "ar": "فَيَا شَفِيعَتَنَا، انْعَطِفِي إِلَيْنَا بِنَظَرَاتِكِ الرَّؤُوفَةِ.", "tr": "fa-yā shafīعatanā, inعaṭifī ilaynā bi-naẓarātiki r-raʾūfa.", "it": "Orsù dunque, avvocata nostra, rivolgi a noi gli occhi tuoi misericordiosi."}, {"r": "", "ar": "وَأَرِينَا بَعْدَ هٰذَا المَنْفَى يَسُوعَ، ثَمَرَةَ بَطْنِكِ المُبَارَكَةَ.", "tr": "wa-arīnā baعda hādha l-manfā yasūع, thamarata baṭniki l-mubāraka.", "it": "E mostraci, dopo questo esilio, Gesù, il frutto benedetto del tuo seno."}, {"r": "", "ar": "يَا رَؤُوفَةُ، يَا حَنُونَةُ، يَا مَرْيَمُ البَتُولُ الحُلْوَةُ.", "tr": "yā raʾūfa, yā ḥanūna, yā maryamu l-batūlu l-ḥulwa.", "it": "O clemente, o pia, o dolce Vergine Maria."}], "grp": "main"}, {"id": "angelo", "it": "Angelo di Dio", "ar": "صَلَاةٌ إِلَى المَلَاكِ الحَارِسِ", "tr": "ṣalātun ila l-malāki l-ḥāris", "lines": [{"r": "", "ar": "يَا مَلَاكَ اللهِ، يَا حَارِسِي،", "tr": "yā malāka llāh, yā ḥārisī,", "it": "Angelo di Dio, che sei il mio custode,"}, {"r": "", "ar": "أَنِرْنِي، وَاحْرُسْنِي، وَدَبِّرْنِي، وَاهْدِنِي،", "tr": "anirnī, wa-ḥrusnī, wa-dabbirnī, wa-hdinī,", "it": "illumina, custodisci, reggi e governa me,"}, {"r": "", "ar": "أَنَا الَّذِي عُهِدَ بِي إِلَيْكَ مِنَ الرَّحْمَةِ السَّمَاوِيَّةِ. آمِين.", "tr": "ana lladhī عuhida bī ilayka mina r-raḥmati s-samāwiyya. āmīn.", "it": "che ti fui affidato dalla pietà celeste. Amen."}], "grp": "main"}, {"id": "requiem", "it": "L’eterno riposo", "ar": "صَلَاةٌ لِأَجْلِ المَوْتَى", "tr": "ṣalātun li-ajli l-mawtā", "lines": [{"r": "", "ar": "الرَّاحَةَ الأَبَدِيَّةَ أَعْطِهِمْ يَا رَبُّ،", "tr": "ar-rāḥata l-abadiyyata aعṭihim yā rabb,", "it": "L’eterno riposo dona loro, o Signore,"}, {"r": "", "ar": "وَلْيُشْرِقْ عَلَيْهِمْ نُورُكَ الدَّائِمُ.", "tr": "wa-l-yushriq عalayhim nūruka d-dāʾim.", "it": "e splenda ad essi la luce perpetua."}, {"r": "", "ar": "وَلْيَسْتَرِيحُوا بِسَلَامٍ. آمِين.", "tr": "wa-l-yastarīḥū bi-salām. āmīn.", "it": "Riposino in pace. Amen."}], "grp": "main"}, {"id": "apertura", "it": "Inizio del Rosario", "ar": "بَدْءُ الوَرْدِيَّةِ", "tr": "badʾu /* ---------- canti dal file canti.txt (repository GitHub) ---------- */
let fileSongs=[];
const SECMAP={arabo:"arabi",arabi:"arabi",ar:"arabi","عربي":"arabi","عربية":"arabi",italiano:"ita",italiani:"ita",it:"ita",ita:"ita",altre:"altre",altro:"altre",altri:"altre",otros:"altre",otras:"altre"};
const LANGMAP={arabo:"ar",árabe:"ar",ar:"ar",italiano:"it",it:"it",latino:"la",latín:"la",la:"la",spagnolo:"es",español:"es",es:"es",francese:"fr",francés:"fr",fr:"fr",inglese:"en",inglés:"en",en:"en"};
function slugT(x){return "f-"+String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,"-").replace(/^-|-$/g,"").slice(0,60)}
function parseCanti(txt){
  const out=[];let cur=null,part="body";const seen={};
  for(const raw of String(txt).replace(/\r/g,"").split("\n")){
    const l=raw.replace(/\s+$/,"");
    if(/^===/.test(l)){
      if(cur)out.push(cur);
      const f=l.replace(/^=+\s*/,"").split("|").map(x=>x.trim());
      const title=f[0]||"";if(!title){cur=null;continue}
      const secK=(f[2]||"").toLowerCase(), lgK=(f[3]||"").toLowerCase();
      const lang=LANGMAP[lgK]||(SECMAP[secK]==="arabi"?"ar":SECMAP[secK]==="ita"?"it":"xx");
      let id=slugT(title);if(seen[id])id+="-"+(++seen[id]);else seen[id]=1;
      cur={id,title,title_ar:f[1]||"",sec:SECMAP[secK]||(lang==="ar"?"arabi":lang==="it"?"ita":"altre"),lang,body:"",translit_ar:"",note_ar:"",order:5000+out.length};part="body";continue}
    if(!cur)continue;
    const m=l.match(/^---\s*(pronuncia|pronunciación|نطق|traslitterazione|spiegazione|explicación|nota|شرح)\s*-*$/i);
    if(m){part=/spieg|explic|nota|شرح/i.test(m[1])?"note_ar":"translit_ar";continue}
    cur[part]+=(cur[part]?"\n":"")+l;
  }
  if(cur)out.push(cur);
  return out.map(s=>({...s,body:s.body.trim(),translit_ar:s.translit_ar.trim(),note_ar:s.note_ar.trim()})).filter(s=>s.body);
}
if(HOSTED){fetch("canti.txt",{cache:"no-cache"}).then(r=>r.ok?r.text():"").then(t=>{fileSongs=parseCanti(t);if(fileSongs.length)render()}).catch(()=>{})}

  return [...m.values()].filter(s=>!s.removed);
}

function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ًͯ-ْٰ]/g,"")

/* ---------- chords ---------- */
const NAMES=["Do","Do#","Re","Mib","Mi","Fa","Fa#","Sol","Sol#","La","Sib","Si"];
const IDX={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11,c:0,d:2,e:4,f:5,g:7,a:9,b:11,h:11};
function trNote(n,k){const m=n.match(/^(Do|Re|Mi|Fa|Sol|La|Si|[A-H])([#b]?)/i);if(!m)return n;
  let i=IDX[m[1].toLowerCase()];if(i==null)return n;i+=m[2]==="#"?1:m[2]==="b"?-1:0;
  return NAMES[((i+k)%12+12)%12]+n.slice(m[0].length)}
function trChord(c,k){if(!k)return c;return c.split("/").map(p=>trNote(p,k)).join("/")}
function lineHTML(l,k,show){
  if(!/\[[^\]]+\]/.test(l)) return `<span class="ln">${esc(l)||"&nbsp;"}</span>`;
  if(!show) return `<span class="ln">${esc(l.replace(/\[[^\]]+\]/g,""))||"&nbsp;"}</span>`;
  const parts=l.split(/(\[[^\]]+\])/);let out="",ch="";
  const seg=(c,x)=>`<span class="seg"><span class="c">${esc(c?trChord(c,k):"")}</span><span>${esc(x)||(c?"&nbsp;":"")}</span></span>`;
  parts.forEach((p,i)=>{ if(/^\[[^\]]+\]$/.test(p)){ if(ch) out+=seg(ch,""); ch=p.slice(1,-1);} else if(p||ch){ out+=seg(ch,p); ch="";} });
  if(ch) out+=seg(ch,"");
  return `<span class="ln ch">${out}</span>`;
}
function bodyHTML(text,k,show=true){
  return String(text||"").trim().split(/\n\s*\n/).map(st=>{
    const ls=st.split("\n");const rit=ls.every(l=>/^>\s?/.test(l));
    return `<p class="st${rit?" rit":""}">${ls.map(l=>lineHTML(l.replace(/^>\s?/,""),k,show)).join("")}</p>`}).join("");
}

$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;let n=0;
  try{const j=JSON.parse(await f.text());for(const s of (j.songs||[])){if(s&&s.id&&s.title&&s.body){await writeSong({...s,id:String(s.id).replace(/[^A-Za-z0-9_-]/g,"")});n++}}}catch(err){}
  e.target.value="";closeSheet();toast(t("imported").replace("{n}",n));render();
};

function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- events ---------- */
$("#lang").onclick=()=>{S.lang=S.lang==="ar"?"it":"ar";store.set("lang",S.lang);render()};
$("#dark").onclick=()=>{dark=!dark;store.set("dark",dark);render()};
$("#more").onclick=openMenu;
$("#back").onclick=()=>{const r=route();if(r.song&&PR[r.song]){const f=S.from;S.from=null;location.hash=f||(PR[r.song].grp&&!S.q?"preghiere":"");return}if(r.song){const s=allSongs().find(x=>x.id===r.song);location.hash=s&&S.filter==="all"&&!S.q?"sec-"+subOf(s):""}else location.hash=""};
$("#fab").onclick=()=>{if(canEdit)openEditor(null,route().sec)};
$("#q").oninput=e=>{S.q=e.target.value;const r=route();if(r.song||r.plist){location.hash="";return}renderList(r.sec)};
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
$("#chips").onclick=e=>{const b=e.target.closest("[data-f]");if(b){S.filter=b.dataset.f;if(location.hash)location.hash="";else render()}};
$("#main").onclick=e=>{
  if(e.target.closest("[data-menu]")){S.q="";$("#q").value="";S.filter="all";location.hash="";window.scrollTo(0,0);return}
  const tg=e.target.closest("[data-tog]");if(tg){const box=tg.classList.contains("tref")?tg.nextElementSibling:tg.closest(".exp");const tr=box.previousElementSibling;const open=box.classList.toggle("hidden")===false;tr.classList.toggle("open",open);if(!open)tr.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(e.target.closest("[data-pl]")){location.hash="preghiere";return}
  const sc=e.target.closest("[data-sec]");if(sc){location.hash="sec-"+sc.dataset.sec;return}
  const it=e.target.closest(".item");if(it){S.transpose=0;S.tab="text";location.hash="s-"+it.dataset.id;return}
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;const id=route().song;const s=allSongs().find(x=>x.id===id);
  switch(a.dataset.act){
    case"fav":favs.has(id)?favs.delete(id):favs.add(id);store.set("favs",[...favs]);break;
    case"fs-":fs=Math.max(13,fs-1);store.set("fs",fs);break;
    case"fs+":fs=Math.min(30,fs+1);store.set("fs",fs);break;
    case"chords":S.chords=!S.chords;break;
    case"tr-":S.transpose-=1;if(S.transpose<-6)S.transpose+=12;break;
    case"tr+":S.transpose+=1;if(S.transpose>6)S.transpose-=12;break;
    case"edit":if(canEdit)openEditor(s);return;
  }
  render();
};
window.addEventListener("hashchange",()=>{S.confirmDel=false;render()});
render();

/* ---------- shared store ---------- */
(async()=>{
  try{
    try{const u=await claude.use("user");if(u){const c=await u.canEdit();let o=false;try{o=(await u.isOwner())===true}catch(e){}canEdit=c===true||o}}catch(e){canEdit=false}
    render();
    db=await claude.use("db");
    if(!db){dbState="none";render();return}
    dbState=canEdit?"editor":"viewer";
    const timer=setTimeout(()=>{if(dbState!=="ready-editor"&&!Object.keys(remote).length){dbState="offline";render()}},10000);
    db.collection("songs").onSnapshot(snap=>{
      remote={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.title)remote[d.id]={...v,id:d.id}});
      if(!snap.metadata.fromCache){clearTimeout(timer);if(dbState==="offline")dbState=canEdit?"editor":"viewer"}
      render();
    },err=>{clearTimeout(timer);dbState="offline";render()});
  }catch(e){dbState="none";render()}
})();
</script>
