  h+=(canEdit?`<button class="ib" data-act="edit">✎ ${t("edit")}</button>`:"")+`</div>`;
  if(tabs.length>1)h+=`<div class="tabs">${tabs.map(([k,l])=>`<button class="chip${S.tab===k?" on":""}" data-tab="${k}">${l}</button>`).join("")}</div>`;
  if(S.tab==="text") h+=`<div class="body ${rtl?"rtl":"ltr"}${S.chords?"":" nochords"}">${bodyHTML(s.body,S.transpose,S.chords)}</div>`;
  if(S.tab==="translit") h+=`<div class="body ${sAr?"ltr":"rtl"} nochords">${bodyHTML(s.translit_ar,0,false)}</div>`;
  if(S.tab==="trad") h+=`<div class="body ${sAr?"ltr":"rtl"} nochords">${bodyHTML(s.trad_ar,0,false)}</div>`;
  if(S.tab==="note") h+=`<div class="note">${esc(s.note_ar)}</div>`;
  const su=SUB[subOf(s)];
  $("#main").innerHTML=h+(S.q?backBtns(["العودة إلى الترانيم","Torna ai canti"],"canti"):backBtns(["العودة إلى "+su.ar,"Torna a: "+su.it],"sec-"+su.id))+"</div>"; window.scrollTo(0,0);
}

/* ---------- editor ---------- */
function openEditor(s,presec){
  const isNew=!s; s=s||{lang:"it",sec:presec||"",title:"",title_ar:"",body:"",translit_ar:"",trad_ar:"",note_ar:""};
  const cur=isNew?(SUB[s.sec]?s.sec:""):subOf(s);
  const L=t("langs");
  $("#panel").innerHTML=`<h2>${isNew?t("add"):t("edit")}</h2>
  <label>${t("titleAr")}</label><input class="fld" id="e-titlear" dir="rtl" value="${esc(s.title_ar)}">
  <label>${t("title")}</label><input class="fld" id="e-title" dir="auto" value="${esc(s.title)}">
  <label>${t("author")}</label><input class="fld" id="e-author" dir="ltr" value="${esc(s.author||"")}">
  <label>${t("authorAr")}</label><input class="fld" id="e-authorar" dir="rtl" value="${esc(s.author_ar||"")}">
  <label>${t("section")}</label><select class="fld" id="e-sec"><option value="">—</option>${SECTIONS.map(m=>`<option value="${m.id}"${cur===m.id?" selected":""}>${esc(m.ar+" · "+m.it)}</option>`).join("")}</select>
  <label>${t("lang")}</label><select class="fld" id="e-lang">${Object.keys(L).map(k=>`<option value="${k}"${s.lang===k?" selected":""}>${L[k]}</option>`).join("")}</select>
  <label>${t("body")}</label><textarea class="fld" id="e-body" dir="auto">${esc(s.body)}</textarea>
  <div class="help">${t("bodyHelp")}</div>
  <label>${t("trad")}</label><textarea class="fld" id="e-trad" dir="rtl" style="min-height:110px">${esc(s.trad_ar||"")}</textarea>
  <label>${t("translit")}</label><textarea class="fld" id="e-tr" dir="rtl" style="min-height:110px">${esc(s.translit_ar)}</textarea>
  <div class="help">${t("translitHelp")}</div>
  <label>${t("note")}</label><textarea class="fld" id="e-note" dir="rtl" style="min-height:90px">${esc(s.note_ar)}</textarea>
  <div class="help">${t("noteHelp")}</div>
  <div id="e-prev"></div>
  <div class="row"><button class="btn pri" id="e-save">${t("save")}</button><button class="btn" id="e-prevb">${t("preview")}</button><button class="btn" id="e-cancel">${t("cancel")}</button>
  ${!isNew&&s.src!=="book"?`<button class="btn dan" id="e-del">${s.src==="book+"?t("reset"):t("del")}</button>`:""}</div>`;
  $("#sheet").classList.remove("hidden"); S.confirmDel=false;
  $("#e-cancel").onclick=closeSheet;
  $("#e-prevb").onclick=()=>{const l=$("#e-lang").value;$("#e-prev").innerHTML=`<label>${t("preview")}</label><div class="note" style="direction:${l==="ar"?"rtl":"ltr"};text-align:start;white-space:normal"><div class="body ${l==="ar"?"rtl":"ltr"}">${bodyHTML($("#e-body").value,0)}</div></div>`};
  $("#e-save").onclick=()=>saveSong(s,isNew);
  const d=$("#e-del"); if(d) d.onclick=()=>{ if(!S.confirmDel){S.confirmDel=true;toast(t("confirmDel"));return} removeSong(s)};
}
function closeSheet(){$("#sheet").classList.add("hidden")}
/* ---------- zoom (baja visión): ingrandisce tutta l'app ---------- */
const ZOOMS=[[1,"عادي","Normale"],[1.15,"كبير","Grande"],[1.3,"كبير جدًّا","Molto grande"],[1.5,"ضخم","Enorme"],[1.75,"أقصى حجم","Massimo"]];
function openZoom(){
  const ar=S.lang==="ar";
  $("#panel").innerHTML=`<h2>${ar?"حجم التطبيق":"Dimensione dell’app"} <span class="mainname">${ar?"Dimensione dell’app":"حجم التطبيق"}</span></h2>
   <p class="zinfo">${ar?"يكبّر كل شيء: العناوين والأزرار والصور والنصوص.":"Ingrandisce tutto: titoli, pulsanti, immagini e testi."}</p>
   <div class="zlist">${ZOOMS.map(([z,a,i])=>`<button class="zopt${z===zoom?" on":""}" data-z="${z}"><span class="za" style="font-size:${Math.round(18*z*z)}px">A</span><span class="zl">${ar?a:i}</span><span class="zp" dir="ltr">${Math.round(z*100)}%</span></button>`).join("")}</div>
   <div class="row"><button class="btn" id="z-close">${t("close")}</button></div>`;
  $("#sheet").classList.remove("hidden");$("#z-close").onclick=closeSheet;
  $("#panel").querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{zoom=+b.dataset.z;store.set("zoom",zoom);setChrome();openZoom()});
}
function slugId(){return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
async function saveSong(old,isNew){
  const s={id:old.id||slugId(),title:$("#e-title").value.trim(),title_ar:$("#e-titlear").value.trim(),author:$("#e-author").value.trim(),author_ar:$("#e-authorar").value.trim(),sec:$("#e-sec").value,
    lang:$("#e-lang").value,body:$("#e-body").value.replace(/\s+$/,""),translit_ar:$("#e-tr").value.trim(),trad_ar:$("#e-trad").value.trim(),note_ar:$("#e-note").value.trim(),updated:Date.now()};
  if(!s.title||!s.body||!s.sec){toast(t("needTitle"));return}
  if(old.order!=null)s.order=old.order;
  if(await writeSong(s)) toast(t("saved")); else toast(t("localOnly"));
  closeSheet(); location.hash="s-"+s.id; render();
}
async function writeSong(s){
  if(db&&canEdit){try{await db.collection("songs").doc(s.id).set(s);remote[s.id]=s;return true}catch(e){if(e&&e.code==="invalid_argument"){canEdit=false;dbState="viewer"}}}
  local[s.id]={...s,mine:!BUILTIN.some(b=>b.id===s.id)};store.set("local",local);return false;
}
async function removeSong(s){
  if(local[s.id]){delete local[s.id];store.set("local",local)}
  if(remote[s.id]&&db&&canEdit){try{await db.collection("songs").doc(s.id).delete();delete remote[s.id]}catch(e){}}
  closeSheet();toast(t("deleted"));
  location.hash=BUILTIN.some(b=>b.id===s.id)?"s-"+s.id:""; render();
}

/* ---------- menu, export, import ---------- */
function openMenu(){
  $("#panel").innerHTML=`<h2>${t("brand")}</h2><div class="menu">
   <a id="m-dl">📲 <span dir="rtl">${T.ar.dlBar}</span> · <span dir="ltr">${T.it.dlBar}</span></a>${canEdit?`<a id="m-exp">⇩ ${t("export")}</a><a id="m-imp">⇧ ${t("import")}</a>`:""}<a id="m-about">ⓘ ${t("about")}</a></div>
   <div id="m-out"></div><div class="row"><button class="btn" id="m-close">${t("close")}</button></div>`;
  $("#sheet").classList.remove("hidden");
  $("#m-close").onclick=closeSheet;$("#m-dl").onclick=openDownload;
  $("#m-about").onclick=()=>{$("#m-out").innerHTML=`<p class="help" style="font-size:14px">${t("aboutText")}</p>`};
  if(!canEdit)return;
  $("#m-imp").onclick=()=>$("#file").click();
  $("#m-exp").onclick=async()=>{
    const data=JSON.stringify({app:"canti",version:1,songs:[...Object.values(remote),...Object.values(local)]},null,1);
    try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:"canti.json",data});toast(t("exported"));return}}catch(e){}
    $("#m-out").innerHTML=`<label>${t("copyJson")}</label><textarea class="fld ltrf" readonly style="min-height:140px">${esc(data)}</textarea>
      <div class="row"><button class="btn" id="m-copy">⧉</button></div>`;
    $("#m-copy").onclick=async()=>{try{await navigator.clipboard.writeText(data);toast(t("copied"))}catch(e){$("#m-out textarea").select()}};
  };
}
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;let n=0;
  try{const j=JSON.parse(await f.text());for(const s of (j.songs||[])){if(s&&s.id&&s.title&&s.body){await writeSong({...s,id:String(s.id).replace(/[^A-Za-z0-9_-]/g,"")});n++}}}catch(err){}
  e.target.value="";closeSheet();toast(t("imported").replace("{n}",n));render();
};

function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- events ---------- */
$("#lang").onclick=()=>{S.lang=S.lang==="ar"?"it":"ar";store.set("lang",S.lang);render()};
$("#dark").onclick=()=>{dark=!dark;store.set("dark",dark);render()};
$("#more").onclick=openMenu;
$("#zoom").onclick=openZoom;
$("#back").onclick=()=>{const r=route();
  if(r.hymn){location.hash=S.q?"":lastInni;return}
  if(r.inni){const M=IMENU[r.inni];location.hash=M&&M.parent?"inni-"+M.parent:(r.inni==="home"?"canti":"inni");return}
  if(r.canti||r.plist){S.q="";$("#q").value="";S.filter="all";location.hash="";return}if(r.song&&PR[r.song]){const f=S.from;S.from=null;if(!f&&PR[r.song].grp&&!S.q)S.scrollTo="g-"+PR[r.song].grp;location.hash=f||(S.q?"canti":"preghiere");return}if(r.song){const s=allSongs().find(x=>x.id===r.song);location.hash=s&&S.filter==="all"&&!S.q?"sec-"+subOf(s):"canti"}else if(r.sec)location.hash="canti";else{S.q="";$("#q").value="";location.hash=""}};
$("#fab").onclick=()=>{if(canEdit)openEditor(null,route().sec)};
$("#q").oninput=e=>{S.q=e.target.value;const r=route();if(!(r.home||r.canti||r.sec)){location.hash="canti";return}render()};
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
$("#chips").onclick=e=>{const b=e.target.closest("[data-f]");if(b){S.filter=b.dataset.f;if(location.hash!=="#canti")location.hash="canti";else render()}};
$("#main").onclick=e=>{
  const bk=e.target.closest("[data-back]");if(bk){const [hh,anc]=bk.dataset.back.split("#");S.scrollTo=anc||null;if(location.hash.slice(1)===hh)render();else location.hash=hh;return}
  if(e.target.closest("[data-menu]")){S.q="";$("#q").value="";S.filter="all";location.hash="";window.scrollTo(0,0);return}
  const fv=e.target.closest("[data-favs]");if(fv){S.filter="fav";location.hash="canti";window.scrollTo(0,0);render();return}
  const hm=e.target.closest("[data-home]");if(hm){S.filter="all";location.hash=hm.dataset.home;window.scrollTo(0,0);return}
  const tg=e.target.closest("[data-tog]");if(tg){const box=tg.classList.contains("tref")?tg.nextElementSibling:tg.closest(".exp");const tr=box.previousElementSibling;const open=box.classList.toggle("hidden")===false;tr.classList.toggle("open",open);if(!open)tr.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(e.target.closest("[data-pl]")){location.hash="preghiere";return}
  const go=e.target.closest("[data-go]");if(go){if(go.dataset.go.startsWith("s-")&&route().inni)S.from=location.hash.slice(1);location.hash=go.dataset.go;return}
  const sc=e.target.closest("[data-sec]");if(sc){location.hash="sec-"+sc.dataset.sec;return}
  const it=e.target.closest(".item");if(it){S.transpose=0;S.tab="text";location.hash="s-"+it.dataset.id;return}
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;const id=route().song;const s=allSongs().find(x=>x.id===id);
  switch(a.dataset.act){
    case"fav":favs.has(id)?favs.delete(id):favs.add(id);store.set("favs",[...favs]);break;
    case"fs-":fs=Math.max(13,fs-1);store.set("fs",fs);break;
    case"fs+":fs=Math.min(30,fs+1);store.set("fs",fs);break;
    case"chords":S.chords=!S.chords;break;
    case"tr-":S.transpose-=1;if(S.transpose<-6)S.transpose+=12;break;
    case"tr+":S.transpose+=1;if(S.transpose>6)S.transpose-=12;break;
    case"edit":if(canEdit)openEditor(s);return;
  }
  render();
};
window.addEventListener("hashchange",()=>{S.confirmDel=false;render()});
render();

/* ---------- shared store ---------- */
(async()=>{
  try{
    try{const u=await claude.use("user");if(u){const c=await u.canEdit();let o=false;try{o=(await u.isOwner())===true}catch(e){}canEdit=c===true||o}}catch(e){canEdit=false}
    render();
    db=await claude.use("db");
    if(!db){dbState="none";render();return}
    dbState=canEdit?"editor":"viewer";
    const timer=setTimeout(()=>{if(dbState!=="ready-editor"&&!Object.keys(remote).length){dbState="offline";render()}},10000);
    db.collection("songs").onSnapshot(snap=>{
      remote={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.title)remote[d.id]={...v,id:d.id}});
      if(!snap.metadata.fromCache){clearTimeout(timer);if(dbState==="offline")dbState=canEdit?"editor":"viewer"}
      render();
    },err=>{clearTimeout(timer);dbState="offline";render()});
  }catch(e){dbState="none";render()}
})();
</script>
</body>
