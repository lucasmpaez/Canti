نَحْنُ البَشَرَ، وَمِنْ أَجْلِ خَلَاصِنَا، نَزَلَ مِنَ السَّمَاءِ،","tr":"alladhī min ajlinā naḥnu l-bashar, wa-min ajli khalāṣinā, nazala mina s-samāʾ,","it":"Per noi uomini e per la nostra salvezza discese dal cielo,"},{"r":"","ar":"وَتَجَسَّدَ مِنَ الرُّوحِ القُدُسِ وَمِنْ مَرْيَمَ العَذْرَاءِ، وَصَارَ إِنْسَانًا.","tr":"wa-tajassada mina r-rūḥi l-qudusi wa-min maryama l-عadhrāʾ, wa-ṣāra insānā.","it":"si è incarnato per opera dello Spirito Santo e da Maria Vergine, e si è fatto uomo."},{"r":"","ar":"وَصُلِبَ عَنَّا عَلَى عَهْدِ بِلَاطُسَ البُنْطِيِّ،","tr":"wa-ṣuliba عannā عalā عahdi bilāṭusa l-bunṭī,","it":"Fu crocifisso per noi sotto Ponzio Pilato,"},{"r":"","ar":"تَأَلَّمَ وَمَاتَ وَقُبِرَ،","tr":"taʾallama wa-māta wa-qubir,","it":"patì e fu sepolto."},{"r":"","ar":"وَقَامَ فِي اليَوْمِ الثَّالِثِ كَمَا فِي الكُتُبِ،","tr":"wa-qāma fi l-yawmi th-thālithi kamā fi l-kutub,","it":"Il terzo giorno è risuscitato, secondo le Scritture,"},{"r":"","ar":"وَصَعِدَ إِلَى السَّمَاءِ، وَجَلَسَ عَنْ يَمِينِ اللهِ الآبِ،","tr":"wa-ṣaعida ila s-samāʾ, wa-jalasa عan yamīni llāhi l-āb,","it":"è salito al cielo, siede alla destra del Padre."},{"r":"","ar":"وَأَيْضًا سَيَأْتِي بِمَجْدٍ عَظِيمٍ لِيَدِينَ الأَحْيَاءَ وَالأَمْوَاتَ،","tr":"wa-eyḍan sa-yaʾtī bi-majdin عaẓīmin li-yadīna l-aḥyāʾa wa-l-amwāt,","it":"E di nuovo verrà, nella gloria, per giudicare i vivi e i morti,"},{"r":"","ar":"الَّذِي لَا فَنَاءَ لِمُلْكِهِ.","tr":"alladhī lā fanāʾa li-mulkihi.","it":"e il suo regno non avrà fine."},{"r":"","ar":"وَبِالرُّوحِ القُدُسِ، الرَّبِّ المُحْيِي،","tr":"wa-bi-r-rūḥi l-qudus, ar-rabbi l-muḥyī,","it":"Crediamo nello Spirito Santo, che è Signore e dà la vita,"},{"r":"","ar":"المُنْبَثِقِ مِنَ الآبِ وَالابْنِ،","tr":"al-munbathiqi mina l-ābi wa-l-ibn,","it":"e procede dal Padre e dal Figlio."},{"r":"","ar":"الَّذِي هُوَ مَعَ الآبِ وَالابْنِ يُسْجَدُ لَهُ وَيُمَجَّدُ،","tr":"alladhī huwa maعa l-ābi wa-l-ibni yusjadu lahu wa-yumajjad,","it":"Con il Padre e il Figlio è adorato e glorificato,"},{"r":"","ar":"النَّاطِقِ بِالأَنْبِيَاءِ وَالرُّسُلِ.","tr":"an-nāṭiqi bi-l-anbiyāʾi wa-r-rusul.","it":"e ha parlato per mezzo dei profeti."},{"r":"","ar":"وَبِكَنِيسَةٍ وَاحِدَةٍ، جَامِعَةٍ، مُقَدَّسَةٍ، رَسُولِيَّةٍ.","tr":"wa-bi-kanīsatin wāḥida, jāmiعa, muqaddasa, rasūliyya.","it":"Crediamo la Chiesa, una, cattolica, santa e apostolica."},{"r":"","ar":"وَنَعْتَرِفُ بِمَعْمُودِيَّةٍ وَاحِدَةٍ لِمَغْفِرَةِ الخَطَايَا.","tr":"wa-naعtarifu bi-maعmūdiyyatin wāḥidatin li-maghfirati l-khaṭāyā.","it":"Professiamo un solo battesimo per il perdono dei peccati."},{"r":"","ar":"وَنَتَرَجَّى قِيَامَةَ المَوْتَى، وَالحَيَاةَ فِي الدَّهْرِ الآتِي. آمِين.","tr":"wa-natarajjā qiyāmata l-mawtā, wa-l-ḥayāta fi d-dahri l-ātī. āmīn.","it":"Aspettiamo la risurrezione dei morti e la vita del mondo che verrà. Amen."}],"note":"Il Credo della Messa; si recita anche all’inizio del Rosario.","grp":"main"},{"id":"benedictus","it":"Benedictus","ar":"تَسْبِحَةُ زَكَرِيَّا","tr":"tasbiḥatu zakariyyā","lines":[{"r":"","ar":"مُبَارَكٌ الرَّبُّ إِلَهُ إِسْرَائِيلَ","tr":"mubārakun ar-Rabbu ilāhu Isrāʾīla","it":"Benedetto il Signore Dio d’Israele,"},{"r":"","ar":"لِأَنَّهُ افْتَقَدَ وَصَنَعَ فِدَاءً لِشَعْبِهِ","tr":"liʾannahu iftaqada wa ṣanaعa fidāʾan li-shaعbihi","it":"perché ha visitato e redento il suo popolo,"},{"r":"","ar":"وَأَقَامَ لَنَا قَرْنَ خَلَاصٍ","tr":"wa aqāma lanā qarna khalāṣin","it":"e ha suscitato per noi una salvezza potente"},{"r":"","ar":"فِي بَيْتِ دَاوُدَ فَتَاهُ","tr":"fī bayti Dāwūda fatāhu","it":"nella casa di Davide, suo servo,"},{"r":"","ar":"كَمَا تَكَلَّمَ عَلَى أَفْوَاهِ أَنْبِيَائِهِ الْقِدِّيسِينَ","tr":"kamā takallama عalā afwāhi anbiyāʾihi l-qiddīsīna","it":"come aveva promesso per bocca dei suoi santi profeti"},{"r":"","ar":"الَّذِينَ هُمْ مُنْذُ الدَّهْرِ","tr":"alladhīna hum mundhu d-dahri","it":"di un tempo:"},{"r":"","ar":"بِأَنْ يُخَلِّصَنَا مِنْ أَعْدَائِنَا","tr":"biʾan yukhalliṣanā min aعdāʾinā","it":"salvezza dai nostri nemici,"},{"r":"","ar":"وَمِنْ أَيْدِي جَمِيعِ مُبْغِضِينَا","tr":"wa min aydī jamīعi mubghiḍīnā","it":"e dalle mani di quanti ci odiano."},{"r":"","ar":"لِيَصْنَعَ رَحْمَةً إِلَى آبَائِنَا","tr":"liyaṣnaعa raḥmatan ilā ābāʾinā","it":"Così egli ha concesso misericordia ai nostri padri"},{"r":"","ar":"وَيَذْكُرَ عَهْدَهُ الْمُقَدَّسَ","tr":"wa yadhkura عahdahu l-muqaddasa","it":"e si è ricordato della sua santa alleanza,"},{"r":"","ar":"الْقَسَمَ الَّذِي حَلَفَ لِإِبْرَاهِيمَ أَبِينَا","tr":"al-qasama lladhī ḥalafa li-Ibrāhīma abīnā","it":"del giuramento fatto ad Abramo, nostro padre,"},{"r":"","ar":"أَنْ يُنْعِمَ عَلَيْنَا","tr":"an yunعima عalaynā","it":"di concederci,"},{"r":"","ar":"بِأَنْ نَنْجُوَ مِنْ أَيْدِي أَعْدَائِنَا","tr":"biʾan nanjūwa min aydī aعdāʾinā","it":"liberati dalle mani dei nemici,"},{"r":"","ar":"فَنَعْبُدَهُ بِلَا خَوْفٍ","tr":"fa-naعbudahu bilā khawfin","it":"di servirlo senza timore,"},{"r":"","ar":"بِالْقَدَاسَةِ وَالْبِرِّ جَمِيعَ أَيَّامِ حَيَاتِنَا","tr":"bil-qadāsati wal-birri jamīعa ayyāmi ḥayātinā","it":"in santità e giustizia al suo cospetto, per tutti i nostri giorni."},{"r":"","ar":"وَأَنْتَ أَيُّهَا الصَّبِيُّ","tr":"wa anta ayyuhā ṣ-ṣabiyyu","it":"E tu, bambino,"},{"r":"","ar":"نَبِيَّ الْعَلِيِّ تُدْعَى","tr":"nabiyya l-عaliyyi tudعā","it":"sarai chiamato profeta dell’Altissimo"},{"r":"","ar":"لِأَنَّكَ تَسْبِقُ أَمَامَ وَجْهِ الرَّبِّ","tr":"liʾannaka tasbiqu amāma wajhi r-Rabbi","it":"perché andrai innanzi al Signore"},{"r":"","ar":"لِتُعِدَّ طُرُقَهُ","tr":"lituعidda ṭuruqahu","it":"a preparargli le strade,"},{"r":"","ar":"وَتُعْطِيَ شَعْبَهُ عِلْمَ الْخَلَاصِ","tr":"wa tuعṭiya shaعbahu عilma l-khalāṣi","it":"per dare al suo popolo la conoscenza della salvezza"},{"r":"","ar":"لِمَغْفِرَةِ خَطَايَاهُمْ","tr":"li-maghfirati khaṭāyāhum","it":"nella remissione dei suoi peccati,"},{"r":"","ar":"بِأَحْشَاءِ رَحْمَةِ إِلَهِنَا","tr":"biʾaḥshāʾi raḥmati ilāhinā","it":"grazie alla bontà misericordiosa del nostro Dio,"},{"r":"","ar":"الَّذِي افْتَقَدَنَا بِهَا الْمُشْرِقُ مِنَ الْعَلَاءِ","tr":"alladhī iftaqadanā bihā l-mushriqu mina l-عalāʾi","it":"per cui verrà a visitarci dall’alto un sole che sorge,"},{"r":"","ar":"لِيُضِيءَ لِلْجَالِسِينَ فِي الظُّلْمَةِ","tr":"liyuḍīʾa lil-jālisīna fī ẓ-ẓulmati","it":"per rischiarare quelli che stanno nelle tenebre"},{"r":"","ar":"وَظِلَالِ الْمَوْتِ","tr":"wa ẓilāli l-mawti","it":"e nell’ombra della morte"},{"r":"","ar":"وَيُرْشِدَ أَقْدَامَنَا","tr":"wa yurshida aqdāmanā","it":"e dirigere i nostri passi"},{"r":"","ar":"إِلَى سَبِيلِ السَّلَامَةِ","tr":"ilā sabīli s-salāmati","it":"sulla via della pace."},{"r":"","ar":"الْمَجْدُ لِلْآبِ وَالِابْنِ وَالرُّوحِ الْقُدُسِ","tr":"al-majdu lil-Ābi wal-Ibni war-Rūḥi l-Qudusi","it":"Gloria al Padre e al Figlio e allo Spirito Santo,"},{"r":"","ar":"الْآنَ وَكُلَّ أَوَانٍ","tr":"al-āna wa-kulla awānin","it":"come era nel principio, e ora e sempre,"},{"r":"","ar":"وَإِلَى دَهْرِ الدَّاهِرِينَ. آمِين.","tr":"wa-ilā dahri d-dāhirīn. Āmīn.","it":"nei secoli dei secoli. Amen."}],"grp":"main"},{"id":"magnificat","it":"Magnificat","ar":"تُعَظِّمُ نَفْسِي الرَّبَّ","tr":"tuعaẓẓimu nafsī ar-rabba","lines":[{"r":"","ar":"تُعَظِّمُ نَفْسِي الرَّبَّ *","tr":"tuعaẓẓimu nafsī ar-rabba *","it":"L’anima mia magnifica il Signore"},{"r":"","ar":"وَتَبْتَهِجُ رُوحِي بِاللهِ مُخَلِّصِي،","tr":"wa-tabtahiju rūḥī bi-llāhi mukhalliṣī,","it":"e il mio spirito esulta in Dio, mio salvatore,"},{"r":"","ar":"لِأَنَّهُ نَظَرَ إِلَى تَوَاضُعِ أَمَتِهِ *","tr":"li-annahu naẓara ilā tawāḍuعi amatihi *","it":"perché ha guardato l’umiltà della sua serva."},{"r":"","ar":"فَهَا مُنْذُ الآنَ تُطَوِّبُنِي جَمِيعُ الأَجْيَالِ.","tr":"fa-hā mundhu l-āna tuṭawwibunī jamīعu l-ajyāli.","it":"D’ora in poi tutte le generazioni mi chiameranno beata."},{"r":"","ar":"لِأَنَّ القَدِيرَ صَنَعَ بِي عَظَائِمَ *","tr":"li-anna l-qadīra ṣanaعa bī عaẓāʾima *","it":"Grandi cose ha fatto in me l’Onnipotente"},{"r":"","ar":"وَاسْمُهُ قُدُّوسٌ.","tr":"wa-smuhu quddūs.","it":"e Santo è il suo nome;"},{"r":"","ar":"وَرَحْمَتُهُ إِلَى أَجْيَالٍ وَأَجْيَالٍ *","tr":"wa-raḥmatuhu ilā ajyālin wa-ajyālin *","it":"di generazione in generazione la sua misericordia"},{"r":"","ar":"لِلَّذِينَ يَتَّقُونَهُ.","tr":"li-lladhīna yattaqūnahu.","it":"per quelli che lo temono."},{"r":"","ar":"صَنَعَ عِزًّا بِسَاعِدِهِ *","tr":"ṣanaعa عizzan bi-sāعidihi *","it":"Ha spiegato la potenza del suo braccio,"},{"r":"","ar":"وَشَتَّتَ المُتَكَبِّرِينَ بِأَفْكَارِ قُلُوبِهِمْ.","tr":"wa-shattata l-mutakabbirīna bi-afkāri qulūbihem.","it":"ha disperso i superbi nei pensieri del loro cuore;"},{"r":"","ar":"حَطَّ المُقْتَدِرِينَ عَنِ الكَرَاسِي *","tr":"ḥaṭṭa l-muqtadirīna عani l-karāsī *","it":"ha rovesciato i potenti dai troni,"},{"r":"","ar":"وَرَفَعَ المُتَوَاضِعِينَ.","tr":"wa-rafaعa l-mutawāḍiعīna.","it":"ha innalzato gli umili;"},{"r":"","ar":"أَشْبَعَ الجِيَاعَ خَيْرًا *","tr":"ashbaعa l-jiyāعa kheyran *","it":"ha ricolmato di beni gli affamati,"},{"r":"","ar":"وَالأَغْنِيَاءَ أَرْسَلَهُمْ فَارِغِينَ.","tr":"wa-l-aghniyāʾa arsalahom fārighīna.","it":"ha rimandato i ricchi a mani vuote."},{"r":"","ar":"عَضَدَ إِسْرَائِيلَ عَبْدَهُ *","tr":"عaḍada isrāʾīla عabdahu *","it":"Ha soccorso Israele, suo servo,"},{"r":"","ar":"فَذَكَرَ رَحْمَتَهُ،","tr":"fa-dhakara raḥmatahu,","it":"ricordandosi della sua misericordia,"},{"r":"","ar":"كَمَا كَلَّمَ آبَاءَنَا *","tr":"kamā kallama ābāʾanā *","it":"come aveva promesso ai nostri padri,"},{"r":"","ar":"إِبْرَاهِيمَ وَنَسْلَهُ إِلَى الأَبَدِ.","tr":"ibrāhīma wa-naslahu ilā l-abadi.","it":"ad Abramo e alla sua discendenza, per sempre."},{"r":"","ar":"المَجْدُ لِلآبِ وَالابْنِ *","tr":"al-majdu li-l-ābi wa-l-ibni *","it":"Gloria al Padre e al Figlio"},{"r":"","ar":"وَالرُّوحِ القُدُسِ،","tr":"wa-r-rūḥi l-qudus,","it":"e allo Spirito Santo,"},{"r":"","ar":"كَمَا كَانَ فِي البَدْءِ وَالآنَ وَكُلَّ أَوَانٍ *","tr":"kamā kāna fi l-badʾi wa-l-āna wa-kulla awān *","it":"come era nel principio, e ora e sempre,"},{"r":"","ar":"وَإِلَى دَهْرِ الدُّهُورِ. آمِين.","tr":"wa-ilā dahri d-duhūr. āmīn.","it":"nei secoli dei secoli. Amen."}],"grp":"main"},{"id":"salve","it":"Salve Regina","ar":"السَّلَامُ عَلَيْكِ أَيَّتُهَا المَلِكَةُ","tr":"as-salāmu عaleyki ayyatuha l-malika","lines":[{"r":"","ar":"السَّلَامُ عَلَيْكِ أَيَّتُهَا المَلِكَةُ، يَا أُمَّ الرَّحْمَةِ،","tr":"as-salāmu عaleyki ayyatuha l-malika, yā umma r-raḥma,","it":"Salve, Regina, Madre di misericordia,"},{"r":"","ar":"يَا حَيَاتَنَا وَعُذُوبَتَنَا وَرَجَاءَنَا، السَّلَامُ عَلَيْكِ.","tr":"yā ḥayātanā wa-عudhūbatanā wa-rajāʾanā, as-salāmu عaleyki.","it":"vita, dolcezza e speranza nostra, salve."},{"r":"","ar":"إِلَيْكِ نَصْرُخُ نَحْنُ المَنْفِيِّينَ أَوْلَادَ حَوَّاءَ،","tr":"ileyki naṣrukhu naḥnu l-manfiyyīna awlāda ḥawwāʾ,","it":"A te gridiamo, noi esuli figli di Eva;"},{"r":"","ar":"وَإِلَيْكِ نَتَنَهَّدُ نَائِحِينَ وَبَاكِينَ فِي هٰذَا الوَادِي، وَادِي الدُّمُوعِ.","tr":"wa-ileyki natanahhadu nāʾiḥīna wa-bākīna fī hādha l-wādī, wādi d-dumūع.","it":"a te sospiriamo, gementi e piangenti in questa valle di lacrime."},{"r":"","ar":"فَيَا شَفِيعَتَنَا، انْعَطِفِي إِلَيْنَا بِنَظَرَاتِكِ الرَّؤُوفَةِ.","tr":"fa-yā shafīعatanā, inعaṭifī ileynā bi-naẓarātiki r-raʾūfa.","it":"Orsù dunque, avvocata nostra, rivolgi a noi gli occhi tuoi misericordiosi."},{"r":"","ar":"وَأَرِينَا بَعْدَ هٰذَا المَنْفَى يَسُوعَ، ثَمَرَةَ بَطْنِكِ المُبَارَكَةَ.","tr":"wa-arīnā baعda hādha l-manfā yasūع, thamarata baṭniki l-mubāraka.","it":"E mostraci, dopo questo esilio, Gesù, il frutto benedetto del tuo seno."},{"r":"","ar":"يَا رَؤُوفَةُ، يَا حَنُونَةُ، يَا مَرْيَمُ البَتُولُ الحُلْوَةُ.","tr":"yā raʾūfa, yā ḥanūna, yā maryamu l-batūlu l-ḥulwa.","it":"O clemente, o pia, o dolce Vergine Maria."}],"grp":"main"},{"id":"memorare","it":"Memorare","ar":"أُذْكُرِي يَا مَرْيَمُ","tr":"udhkurī yā maryam","lines":[{"r":"","ar":"أُذْكُرِي يَا مَرْيَمُ العَذْرَاءُ الحَنُونُ،","tr":"udhkurī yā maryamu l-عadhrāʾu l-ḥanūn,","it":"Ricordati, o piissima Vergine Maria,"},{"r":"","ar":"أَنَّهُ لَمْ يُسْمَعْ قَطُّ أَنَّ أَحَدًا الْتَجَأَ إِلَى حِمَايَتِكِ","tr":"annahu lam yusmaع qaṭṭu anna aḥadan iltajaʾa ilā ḥimāyatiki","it":"che non si è mai udito al mondo che alcuno sia ricorso alla tua protezione,"},{"r":"","ar":"وَطَلَبَ مَعُونَتَكِ وَرُدَّ خَائِبًا.","tr":"wa-ṭalaba maعūnataki wa-rudda khāʾibā.","it":"abbia implorato il tuo aiuto, chiesto il tuo patrocinio e sia stato abbandonato."},{"r":"","ar":"فَأَنَا بِمِثْلِ هٰذِهِ الثِّقَةِ أَلْتَجِئُ إِلَيْكِ أَيَّتُهَا الأُمُّ، عَذْرَاءَ العَذَارَى،","tr":"fa-anā bi-mithli hādhihi th-thiqati altajiʾu ilayki ayyatuha l-umm, عadhrāʾa l-عadhārā,","it":"Animato da tale confidenza, a te ricorro, o Madre, Vergine delle vergini,"},{"r":"","ar":"وَآتِي إِلَيْكِ، وَأَجْثُو أَمَامَكِ، أَنَا الخَاطِئُ المِسْكِينُ، مُتَنَهِّدًا.","tr":"wa-ātī ilayki, wa-ajthū amāmaki, ana l-khāṭiʾu l-miskīn, mutanahhidā.","it":"a te vengo e, peccatore contrito, mi prostro ai tuoi piedi."},{"r":"","ar":"فَلَا تَرْذُلِي تَضَرُّعَاتِي، يَا أُمَّ الكَلِمَةِ،","tr":"fa-lā tardhulī taḍarruعātī, yā umma l-kalima,","it":"Non volere, o Madre del Verbo, disprezzare le mie preghiere,"},{"r":"","ar":"بَلِ اسْتَمِعِي لِي بِحُنُوٍّ وَاسْتَجِيبِينِي. آمِين.","tr":"bali stamiعī lī bi-ḥunuwwin wa-stajībīnī. āmīn.","it":"ma ascoltami propizia ed esaudiscimi. Amen."}],"grp":"main"},{"id":"angelo","it":"Angelo di Dio","ar":"صَلَاةٌ إِلَى المَلَاكِ الحَارِسِ","tr":"ṣalātun ila l-malāki l-ḥāris","lines":[{"r":"","ar":"يَا مَلَاكَ اللهِ، يَا حَارِسِي،","tr":"yā malāka llāh, yā ḥārisī,","it":"Angelo di Dio, che sei il mio custode,"},{"r":"","ar":"أَنِرْنِي، وَاحْرُسْنِي، وَدَبِّرْنِي، وَاهْدِنِي،","tr":"anirnī, wa-ḥrusnī, wa-dabbirnī, wa-hdinī,","it":"illumina, custodisci, reggi e governa me,"},{"r":"","ar":"أَنَا الَّذِي عُهِدَ بِي إِلَيْكَ مِنَ الرَّحْمَةِ السَّمَاوِيَّةِ. آمِين.","tr":"ana lladhī عuhida bī ileyka mina r-raḥmati s-samāwiyya. āmīn.","it":"che ti fui affidato dalla pietà celeste. Amen."}],"grp":"main"},{"id":"san-giuseppe","it":"Preghiera a San Giuseppe","ar":"صَلَاةٌ لِمَارِ يُوسُفَ","tr":"ṣalātun li-mār yūsuf","lines":[{"r":"","ar":"إِلَيْكَ نَهْرَعُ فِي شَدَائِدِنَا، أَيُّهَا الطُّوبَاوِيُّ يُوسُفُ،","tr":"ilayka nahraعu fī shadāʾidinā, ayyuha ṭ-ṭūbāwiyyu yūsuf,","it":"A te, o beato Giuseppe, stretti dalla tribolazione, ricorriamo,"},{"r":"","ar":"وَنَسْتَغِيثُ وَاثِقِينَ بِحِمَايَتِكَ، بَعْدَ أَنِ اسْتَعَنَّا بِحِمَايَةِ عَرُوسِكَ الكُلِّيَّةِ القَدَاسَةِ.","tr":"wa-nastaghīthu wāthiqīna bi-ḥimāyatika, baعda ani staعannā bi-ḥimāyati عarūsika l-kulliyyati l-qadāsa.","it":"e fiduciosi invochiamo il tuo patrocinio, dopo quello della tua santissima Sposa."},{"r":"","ar":"وَنَسْأَلُكَ مُتَوَسِّلِينَ بِحَقِّ ذٰلِكَ الرِّبَاطِ الوَثِيقِ، رِبَاطِ المَحَبَّةِ،","tr":"wa-nasʾaluka mutawassilīna bi-ḥaqqi dhālika r-ribāṭi l-wathīq, ribāṭi l-maḥabba,","it":"Per quel sacro vincolo di carità,"},{"r":"","ar":"الَّذِي وَحَّدَ بَيْنَكَ وَبَيْنَ العَذْرَاءِ البَرِيئَةِ مِنَ العَيْبِ، أُمِّ اللهِ،","tr":"alladhī waḥḥada baynaka wa-bayna l-عadhrāʾi l-barīʾati mina l-عayb, ummi llāh,","it":"che ti strinse all’Immacolata Vergine Maria, Madre di Dio,"},{"r":"","ar":"وَبِالحُبِّ الأَبَوِيِّ الَّذِي احْتَضَنْتَ بِهِ الطِّفْلَ يَسُوعَ،","tr":"wa-bi-l-ḥubbi l-abawiyyi lladhi ḥtaḍanta bihi ṭ-ṭifla yasūع,","it":"e per l’amore paterno che portasti al fanciullo Gesù,"},{"r":"","ar":"أَنْ تَنْظُرَ مُنْعَطِفًا إِلَى المِيرَاثِ الَّذِي اقْتَنَاهُ يَسُوعُ المَسِيحُ بِدَمِهِ،","tr":"an tanẓura munعaṭifan ila l-mīrāthi lladhi qtanāhu yasūعu l-masīḥu bi-damihi,","it":"riguarda, te ne preghiamo, con occhio benigno la cara eredità che Gesù Cristo acquistò col suo Sangue,"},{"r":"","ar":"وَتُسَاعِدَنَا فِي حَاجَاتِنَا بِمَا لَكَ مِنَ الفِعْلِ وَالمَقْدِرَةِ.","tr":"wa-tusāعidanā fī ḥājātinā bi-mā laka mina l-fiعli wa-l-maqdira.","it":"e col tuo potere ed aiuto sovvieni ai nostri bisogni."},{"r":"","ar":"يَا حَارِسًا جَزِيلَ العِنَايَةِ بِالعَائِلَةِ المُقَدَّسَةِ، أَيْ ذُرِّيَّةِ يَسُوعَ المُخْتَارَةِ،","tr":"yā ḥārisan jazīla l-عināyati bi-l-عāʾilati l-muqaddasa, ay dhurriyyati yasūعa l-mukhtāra,","it":"Proteggi, o provvido custode della divina Famiglia, l’eletta prole di Gesù Cristo:"},{"r":"","ar":"فَاصْرِفْ عَنَّا، أَيُّهَا الأَبُ الكُلِّيَّةُ مَحَبَّتُهُ، وَبَاءَ الأَضَالِيلِ وَالمَفَاسِدِ بِأَسْرِهَا.","tr":"fa-ṣrif عannā, ayyuha l-abu l-kulliyyatu maḥabbatuhu, wabāʾa l-aḍālīli wa-l-mafāsidi bi-asrihā.","it":"allontana da noi, o Padre amatissimo, gli errori e i vizi che ammorbano il mondo;"},{"r":"","ar":"يَا نَصِيرَنَا القَدِيرَ، بِعَطْفِكَ عَلَيْنَا، قِفْ إِلَى جَنْبِنَا عَضُدًا مِنَ السَّمَاءِ","tr":"yā naṣīranā l-qadīr, bi-عaṭfika عalaynā, qif ilā janbinā عaḍudan mina s-samāʾ","it":"assistici propizio dal cielo, o nostro fortissimo protettore,"},{"r":"","ar":"فِي هٰذِهِ المَعْرَكَةِ بَيْنَنَا وَبَيْنَ قُوَّاتِ الظَّلَامِ.","tr":"fī hādhihi l-maعrakati baynanā wa-bayna quwwāti ẓ-ẓalām.","it":"in questa lotta col potere delle tenebre;"},{"r":"","ar":"وَكَمَا خَلَّصْتَ يَوْمًا الطِّفْلَ يَسُوعَ مِنَ الخَطَرِ العَظِيمِ المُحْدِقِ بِحَيَاتِهِ،","tr":"wa-kamā khallaṣta yawmani ṭ-ṭifla yasūعa mina l-khaṭari l-عaẓīmi l-muḥdiqi bi-ḥayātihi,","it":"e come un tempo salvasti dalla morte la minacciata vita del pargoletto Gesù,"},{"r":"","ar":"هٰكَذَا احْمِ الآنَ كَنِيسَةَ اللهِ المُقَدَّسَةَ مِنْ مَكَايِدِ الأَعْدَاءِ وَمِنْ كُلِّ كَارِثَةٍ.","tr":"hākadha ḥmi l-āna kanīsata llāhi l-muqaddasata min makāyidi l-aعdāʾi wa-min kulli kāritha.","it":"così ora difendi la santa Chiesa di Dio dalle ostili insidie e da ogni avversità;"},{"r":"","ar":"اُبْسُطْ عَلَى كُلٍّ مِنَّا ظِلَّ حِمَايَتِكَ الدَّائِمَةِ،","tr":"ubsuṭ عalā kullin minnā ẓilla ḥimāyatika d-dāʾima,","it":"e stendi ognora sopra ciascuno di noi il tuo patrocinio,"},{"r":"","ar":"بِحَيْثُ نَسْتَطِيعُ، عَلَى مِثَالِكَ وَبِوَاسِطَةِ مَعُونَتِكَ، أَنْ نَحْيَا حَيَاةً مُقَدَّسَةً،","tr":"bi-ḥaythu nastaṭīع, عalā mithālika wa-bi-wāsiṭati maعūnatika, an naḥyā ḥayātan muqaddasa,","it":"affinché, a tuo esempio e mediante il tuo soccorso, possiamo virtuosamente vivere,"},{"r":"","ar":"وَنَمُوتَ مِيتَةً صَالِحَةً، وَنَحْصُلَ عَلَى السَّعَادَةِ الأَبَدِيَّةِ فِي السَّمَاوَاتِ. آمِين.","tr":"wa-namūta mītatan ṣāliḥa, wa-naḥṣula عala s-saعādati l-abadiyyati fi s-samāwāt. āmīn.","it":"piamente morire e conseguire l’eterna beatitudine in cielo. Amen."}],"grp":"main"},{"id":"dante","it":"Inno alla Vergine (Dante)","ar":"صَلَاةُ دَانْتِي","tr":"ṣalātu dāntī","lines":[{"r":"","ar":"أَيَّتُهَا العَذْرَاءُ، يَا ابْنَةَ ابْنِكِ،","tr":"ayyatuha l-عadhrāʾ, yā bnata bniki,","it":"Vergine madre, figlia del tuo figlio,"},{"r":"","ar":"يَا مَنْ أَنْتِ أَكْثَرُ تَوَاضُعًا وَعُلُوًّا مِنْ كُلِّ إِنْسَانٍ،","tr":"yā man anti aktharu tawāḍuعan wa-عuluwwan min kulli insān,","it":"umile e alta più che creatura,"},{"r":"","ar":"يَا حَدًّا مُقَرَّرًا لِمَجْلِسٍ أَزَلِيٍّ،","tr":"yā ḥaddan muqarraran li-majlisin azaliyy,","it":"termine fisso d’eterno consiglio,"},{"r":"","ar":"أَنْتِ يَا مَنْ أَضْفَيْتِ كُلَّ هٰذِهِ النَّبَالَةِ","tr":"anti yā man aḍfayti kulla hādhihi n-nabāla","it":"tu se’ colei che l’umana natura"},{"r":"","ar":"عَلَى طَبِيعَتِنَا الإِنْسَانِيَّةِ حَتَّى أَنَّ خَالِقَهَا","tr":"عalā ṭabīعatina l-insāniyyati ḥattā anna khāliqahā","it":"nobilitasti sì, che ’l suo fattore"},{"r":"","ar":"لَمْ يَأْنَفْ مِنْ أَنْ يَكُونَ لَهَا مَخْلُوقًا.","tr":"lam yaʾnaf min an yakūna lahā makhlūqā.","it":"non disdegnò di farsi sua fattura."},{"r":"","ar":"فِي بَطْنِكِ اشْتَعَلَ الحُبُّ","tr":"fī baṭniki shtaعala l-ḥubb","it":"Nel ventre tuo si raccese l’amore,"},{"r":"","ar":"الَّذِي بِفَضْلِ حَرَارَتِهِ، فِي السِّلْمِ الأَبَدِيِّ،","tr":"alladhī bi-faḍli ḥarāratihi, fi s-silmi l-abadiyy,","it":"per lo cui caldo ne l’eterna pace"},{"r":"","ar":"تَفَتَّحَتْ عَلَى هٰذِهِ الشَّاكِلَةِ هٰذِهِ الزَّهْرَةُ.","tr":"tafattaḥat عalā hādhihi sh-shākilati hādhihi z-zahra.","it":"così è germinato questo fiore."},{"r":"","ar":"هُنَا أَنْتِ لَنَا مِنْ أَجْلِ المَحَبَّةِ","tr":"hunā anti lanā min ajli l-maḥabba","it":"Qui se’ a noi meridiana face"},{"r":"","ar":"مِشْعَلُ الهَاجِرَةِ، وَلَدَى البَشَرِ الفَانِينَ","tr":"mishعalu l-hājira, wa-ladā l-bashari l-fānīn","it":"di caritate, e giuso, intra i mortali,"},{"r":"","ar":"أَنْتِ النَّبْعُ الحَيَوِيُّ لِكُلِّ رَجَاءٍ.","tr":"anti n-nabعu l-ḥayawiyyu li-kulli rajāʾ.","it":"se’ di speranza fontana vivace."},{"r":"","ar":"سَيِّدَتِي، إِنَّكِ لَمِنَ الرِّفْعَةِ وَمِنَ العَظَمَةِ","tr":"sayyidatī, innaki la-mina r-rifعati wa-mina l-عaẓama","it":"Donna, se’ tanto grande e tanto vali,"},{"r":"","ar":"حَتَّى إِنَّ مَنْ أَرَادَ بَرَكَتَكِ وَلَمْ يَأْتِ إِلَيْكِ","tr":"ḥattā inna man arāda barakataki wa-lam yaʾti ilayki","it":"che qual vuol grazia ed a te non ricorre,"},{"r":"","ar":"كَانَ كَمَثَلِ مَنْ أَرَادَ لِرَغْبَتِهِ أَنْ تَطِيرَ بِلَا جَنَاحَيْنِ.","tr":"kāna ka-mathali man arāda li-raghbatihi an taṭīra bilā janāḥayn.","it":"sua disianza vuol volar sanz’ali."},{"r":"rub","it":"(Dante, Paradiso XXXIII)","rar":"(دَانْتِي، الفِرْدَوْس، النَّشِيدُ الثَّالِثُ وَالثَّلَاثُون)"}],"grp":"main"},{"id":"atto-dolore","it":"Atto di dolore","ar":"فِعْلُ النَّدَامَةِ","tr":"fiعlu n-nadāma","lines":[{"r":"","ar":"اِرْحَمْنِي يَا رَبُّ، فَإِنِّي نَادِمٌ مِنْ كُلِّ قَلْبِي","tr":"irḥamnī yā rabb, fa-innī nādimun min kulli qalbī","it":"Mio Dio, mi pento e mi dolgo con tutto il cuore dei miei peccati,"},{"r":"","ar":"عَلَى إِهَانَتِي إِيَّاكَ، لِكَوْنِي بِالخَطِيئَةِ","tr":"عalā ihānatī iyyāka, li-kawnī bi-l-khaṭīʾa","it":"perché peccando ho meritato i tuoi castighi, e molto più perché ho offeso te,"},{"r":"","ar":"قَدْ أَهَنْتُ وَأَغَظْتُ إِلٰهًا هٰكَذَا عَظِيمًا وَمَحْبُوبًا نَظِيرَكَ.","tr":"qad ahantu wa-aghaẓtu ilāhan hākadhā عaẓīman wa-maḥbūban naẓīraka.","it":"infinitamente buono e degno di essere amato sopra ogni cosa."},{"r":"","ar":"فَمِنَ الآنَ وَصَاعِدًا أَنَا قَاصِدٌ بِمَعُونَتِكَ الإِلٰهِيَّةِ","tr":"fa-mina l-āni wa-ṣāعidan ana qāṣidun bi-maعūnatika l-ilāhiyya","it":"Propongo con il tuo santo aiuto"},{"r":"","ar":"أَنْ لَا أُغِيظَكَ أَبَدًا، لِأَنِّي أُحِبُّكَ فَوْقَ كُلِّ شَيْءٍ.","tr":"an lā ughīẓaka abadan, li-annī uḥibbuka fawqa kulli shayʾ.","it":"di non offenderti mai più e di fuggire le occasioni prossime di peccato. Signore, misericordia, perdonami."}],"grp":"main"},{"id":"requiem","it":"L’eterno riposo","ar":"صَلَاةٌ لِأَجْلِ المَوْتَى","tr":"ṣalātun li-ajli l-mawtā","lines":[{"r":"","ar":"الرَّاحَةَ الأَبَدِيَّةَ أَعْطِهِمْ يَا رَبُّ،","tr":"ar-rāḥata l-abadiyyata aعṭihim yā rabb,","it":"L’eterno riposo dona loro, o Signore,"},{"r":"","ar":"وَلْيُشْرِقْ عَلَيْهِمْ نُورُكَ الدَّائِمُ.","tr":"wa-l-yushriq عaleyhim nūruka d-dāʾim.","it":"e splenda ad essi la luce perpetua."},{"r":"","ar":"وَلْيَسْتَرِيحُوا بِسَلَامٍ. آمِين.","tr":"wa-l-yastarīḥū bi-salām. āmīn.","it":"Riposino in pace. Amen."}],"grp":"main"},{"id":"apertura","it":"Inizio del Rosario","ar":"بَدْءُ الوَرْدِيَّةِ","tr":"badʾu l-wardiyya","lines":[{"r":"rub","it":"Segno della croce, poi:","rar":"إِشَارَةُ الصَّلِيبِ، ثُمَّ:","links":["segno"]},{"r":"V","ar":"اللّٰهُمَّ، الْتَفِتْ إِلَى مَعُونَتِي.","tr":"allāhumma ltafit ilā maعūnatī.","it":"O Dio, vieni a salvarmi."},{"r":"R","ar":"يَا رَبُّ، أَسْرِعْ إِلَى إِغَاثَتِي.","tr":"yā rabb, asriع ilā ighāthatī.","it":"Signore, vieni presto in mio aiuto."},{"r":"rubav","ar":"المَجْدُ لِلآبِ…","tr":"al-majdu li-l-ābi…","it":"Gloria…"},{"r":"rub","it":"Si recita il Credo (niceno), un Padre nostro, tre Ave Maria (per la fede, la speranza e la carità) e un Gloria.","rar":"يُتْلَى قَانُونُ الإِيمَانِ (النِّيقَاوِيُّ)، وَالصَّلَاةُ الرَّبِّيَّةُ مَرَّةً، وَ«السَّلَامُ عَلَيْكِ يَا مَرْيَمُ» ثَلَاثَ مَرَّاتٍ (لِأَجْلِ الإِيمَانِ وَالرَّجَاءِ وَالمَحَبَّةِ)، وَالمَجْدَلَةُ مَرَّةً.","links":["credo-niceno","pater","ave","gloria"]},{"r":"rub","it":"Poi si recitano i misteri del giorno:","rar":"ثُمَّ تُتْلَى أَسْرَارُ اليَوْمِ:","links":["gaudiosi","luminosi","dolorosi","gloriosi"]}],"grp":"ros"},{"id":"fatima","it":"Preghiera di Fatima","ar":"صَلَاةُ فَاطِمَة","tr":"ṣalātu fāṭima","lines":[{"r":"","ar":"يَا يَسُوعُ، اغْفِرْ لَنَا function slugT(x){return "f-"+String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,"-").replace(/^-|-$/g,"").slice(0,60)}
function parseCanti(txt){
  const out=[];let cur=null,part="body";const seen={};
  for(const raw of String(txt).replace(/\r/g,"").split("\n")){
    const l=raw.replace(/\s+$/,"");
    if(/^===/.test(l)){
      if(cur)out.push(cur);
      const f=l.replace(/^=+\s*/,"").split("|").map(x=>x.trim());
      const title=f[0]||"";if(!title){cur=null;continue}
      const secK=(f[2]||"").toLowerCase(), lgK=(f[3]||"").toLowerCase();
      const lang=LANGMAP[lgK]||(SECMAP[secK]==="arabi"?"ar":SECMAP[secK]==="ita"?"it":"xx");
      let id=slugT(title);if(seen[id])id+="-"+(++seen[id]);else seen[id]=1;
      cur={id,title,title_ar:f[1]||"",sec:SECMAP[secK]||(lang==="ar"?"arabi":lang==="it"?"ita":"altre"),lang,body:"",translit_ar:"",trad_ar:"",note_ar:"",order:5000+out.length};part="body";continue}
    if(!cur)continue;
    const m=l.match(/^---\s*(pronuncia|pronunciación|نطق|traslitterazione|spiegazione|explicación|nota|شرح)\s*-*$/i);
    const mt=l.match(/^---\s*(traduzione|traducción|traduccion|ترجمة|الترجمة)\s*-*$/i);if(mt){part="trad_ar";continue}
    if(m){part=/spieg|explic|nota|شرح/i.test(m[1])?"note_ar":"translit_ar";continue}
    cur[part]+=(cur[part]?"\n":"")+l;
  }
  if(cur)out.push(cur);
  return out.map(s=>{let n=s.note_ar.trim(),author="",author_ar="";const ls=n.split("\n");if(ls[0]&&/[A-Za-zÀ-ÿ]/.test(ls[0])){const ap=ls[0].split("|");author=ap[0].trim();author_ar=(ap[1]||"").trim();n=ls.slice(1).join("\n").trim()}
    return {...s,author,author_ar,body:s.body.trim(),translit_ar:s.translit_ar.trim(),trad_ar:s.trad_ar.trim(),note_ar:n}}).filter(s=>s.body);
}

  if(!show) return `<span class="ln">${esc(l.replace(/\[[^\]]+\]/g,""))||"&nbsp;"}</span>`;

  parts.forEach((p,i)=>{ if(/^\[[^\]]+\]$/.test(p)){ if(ch) out+=seg(ch,""); ch=p.slice(1,-1);} else if(p||ch){ out+=seg(ch,p); ch="";} });

   <div class="row"><button class="btn" id="dl-close">${t("close")}</button></div>`;
  $("#sheet").classList.remove("hidden");$("#dl-close").onclick=closeSheet;
  const bi_=$("#dl-inst");if(bi_)bi_.onclick=async()=>{const e=instEv;instEv=null;if(!e)return;e.prompt();try{if((await e.userChoice).outcome==="accepted"){closeSheet();store.set("dlHide",true);render()}}catch(x){}};
}
function renderSong(s){
  const rtl=s.lang==="ar"; const hasCh=/\[[^\]]+\]/.test(s.body||"");
  const sAr=s.lang==="ar"||subOf(s)==="arabi";const tl=k=>sAr?(k==="trad"?(S.lang==="ar"?"الترجمة بالإيطالية":"Traduzione in italiano"):(S.lang==="ar"?"بالحروف اللاتينية":"Traslitterazione")):t(k);
  const tabs=[["text",t("text")]]; if(s.trad_ar)tabs.push(["trad",tl("trad")]); if(s.translit_ar)tabs.push(["translit",tl("translit")]); if(s.note_ar)tabs.push(["note",t("note")]);
  if(!tabs.some(x=>x[0]===S.tab))S.tab="text";
  let h=`<div class="song"><h1>${biTitle(s)}</h1>${S.lang==="ar"&&s.author_ar?`<div class="author"><span dir="rtl">${esc(s.author_ar)}</span></div>`:s.author?`<div class="author"><span dir="ltr">${esc(s.author)}</span></div>`:""}<div class="meta"><b>№ ${s.n}</b> · ${esc(secName(s))}${s.lang?" · "+esc(t("langs")[s.lang]||s.lang):""}${s.src==="local"?" · "+t("localOnly"):""}</div>`;
  h+=`<div class="tools">
    <button class="ib${favs.has(s.id)?" on":""}" data-act="fav">★</button>
    <button class="ib" dir="ltr" data-act="fs-" aria-label="${t("size")}">A−</button><button class="ib" dir="ltr" data-act="fs+" aria-label="${t("size")}">A+</button>`;
  if(hasCh) h+=`<button class="ib${S.chords?" on":""}" data-act="chords">${t("chords")}</button>
    <button class="ib" data-act="tr-" title="${t("down")}">♭</button><span class="ib" dir="ltr" style="cursor:default">${S.transpose>0?"+":""}${S.transpose}</span><button class="ib" data-act="tr+" title="${t("up")}">♯</button>`;
  h+=(canEdit?`<button class="ib" data-act="edit">✎ ${t("edit")}</button>`:"")+`</div>`;
  if(tabs.length>1)h+=`<div class="tabs">${tabs.map(([k,l])=>`<button class="chip${S.tab===k?" on":""}" data-tab="${k}">${l}</button>`).join("")}</div>`;
  if(S.tab==="text") h+=`<div class="body ${rtl?"rtl":"ltr"}${S.chords?"":" nochords"}">${bodyHTML(s.body,S.transpose,S.chords)}</div>`;
  if(S.tab==="translit") h+=`<div class="body ${sAr?"ltr":"rtl"} nochords">${bodyHTML(s.translit_ar,0,false)}</div>`;
  if(S.tab==="trad") h+=`<div class="body ${sAr?"ltr":"rtl"} nochords">${bodyHTML(s.trad_ar,0,false)}</div>`;
  if(S.tab==="note") h+=`<div class="note">${esc(s.note_ar)}</div>`;
  const su=SUB[subOf(s)];
  $("#main").innerHTML=h+(S.q?backBtns(["العودة إلى الترانيم","Torna ai canti"],"canti"):backBtns(["العودة إلى "+su.ar,"Torna a: "+su.it],"sec-"+su.id))+"</div>"; window.scrollTo(0,0);
}

/* ---------- editor ---------- */
function openEditor(s,presec){
  const isNew=!s; s=s||{lang:"it",sec:presec||"",title:"",title_ar:"",body:"",translit_ar:"",trad_ar:"",note_ar:""};
  const cur=isNew?(SUB[s.sec]?s.sec:""):subOf(s);
  const L=t("langs");
  $("#panel").innerHTML=`<h2>${isNew?t("add"):t("edit")}</h2>
  <label>${t("titleAr")}</label><input class="fld" id="e-titlear" dir="rtl" value="${esc(s.title_ar)}">
  <label>${t("title")}</label><input class="fld" id="e-title" dir="auto" value="${esc(s.title)}">
  <label>${t("author")}</label><input class="fld" id="e-author" dir="ltr" value="${esc(s.author||"")}">
  <label>${t("authorAr")}</label><input class="fld" id="e-authorar" dir="rtl" value="${esc(s.author_ar||"")}">
  <label>${t("section")}</label><select class="fld" id="e-sec"><option value="">—</option>${SECTIONS.map(m=>`<option value="${m.id}"${cur===m.id?" selected":""}>${esc(m.ar+" · "+m.it)}</option>`).join("")}</select>
  <label>${t("lang")}</label><select class="fld" id="e-lang">${Object.keys(L).map(k=>`<option value="${k}"${s.lang===k?" selected":""}>${L[k]}</option>`).join("")}</select>
  <label>${t("body")}</label><textarea class="fld" id="e-body" dir="auto">${esc(s.body)}</textarea>
  <div class="help">${t("bodyHelp")}</div>
  <label>${t("trad")}</label><textarea class="fld" id="e-trad" dir="rtl" style="min-height:110px">${esc(s.trad_ar||"")}</textarea>
  <label>${t("translit")}</label><textarea class="fld" id="e-tr" dir="rtl" style="min-height:110px">${esc(s.translit_ar)}</textarea>
  <div class="help">${t("translitHelp")}</div>
  <label>${t("note")}</label><textarea class="fld" id="e-note" dir="rtl" style="min-height:90px">${esc(s.note_ar)}</textarea>
  <div class="help">${t("noteHelp")}</div>
  <div id="e-prev"></div>
  <div class="row"><button class="btn pri" id="e-save">${t("save")}</button><button class="btn" id="e-prevb">${t("preview")}</button><button class="btn" id="e-cancel">${t("cancel")}</button>
  ${!isNew&&s.src!=="book"?`<button class="btn dan" id="e-del">${s.src==="book+"?t("reset"):t("del")}</button>`:""}</div>`;
  $("#sheet").classList.remove("hidden"); S.confirmDel=false;
  $("#e-cancel").onclick=closeSheet;
  $("#e-prevb").onclick=()=>{const l=$("#e-lang").value;$("#e-prev").innerHTML=`<label>${t("preview")}</label><div class="note" style="direction:${l==="ar"?"rtl":"ltr"};text-align:start;white-space:normal"><div class="body ${l==="ar"?"rtl":"ltr"}">${bodyHTML($("#e-body").value,0)}</div></div>`};
  $("#e-save").onclick=()=>saveSong(s,isNew);
  const d=$("#e-del"); if(d) d.onclick=()=>{ if(!S.confirmDel){S.confirmDel=true;toast(t("confirmDel"));return} removeSong(s)};
}
function closeSheet(){$("#sheet").classList.add("hidden")}
/* ---------- zoom (baja visión): ingrandisce tutta l'app ---------- */
const ZOOMS=[[1,"عادي","Normale"],[1.15,"كبير","Grande"],[1.3,"كبير جدًّا","Molto grande"],[1.5,"ضخم","Enorme"],[1.75,"أقصى حجم","Massimo"]];
function openZoom(){
  const ar=S.lang==="ar";
  $("#panel").innerHTML=`<h2>${ar?"حجم التطبيق":"Dimensione dell’app"} <span class="mainname">${ar?"Dimensione dell’app":"حجم التطبيق"}</span></h2>
   <p class="zinfo">${ar?"يكبّر كل شيء: العناوين والأزرار والصور والنصوص.":"Ingrandisce tutto: titoli, pulsanti, immagini e testi."}</p>
   <div class="zlist">${ZOOMS.map(([z,a,i])=>`<button class="zopt${z===zoom?" on":""}" data-z="${z}"><span class="za" style="font-size:${Math.round(18*z*z)}px">A</span><span class="zl">${ar?a:i}</span><span class="zp" dir="ltr">${Math.round(z*100)}%</span></button>`).join("")}</div>
   <div class="row"><button class="btn" id="z-close">${t("close")}</button></div>`;
  $("#sheet").classList.remove("hidden");$("#z-close").onclick=closeSheet;
  $("#panel").querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{zoom=+b.dataset.z;store.set("zoom",zoom);setChrome();openZoom()});
}
function slugId(){return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
async function saveSong(old,isNew){
  const s={id:old.id||slugId(),title:$("#e-title").value.trim(),title_ar:$("#e-titlear").value.trim(),author:$("#e-author").value.trim(),author_ar:$("#e-authorar").value.trim(),sec:$("#e-sec").value,
    lang:$("#e-lang").value,body:$("#e-body").value.replace(/\s+$/,""),translit_ar:$("#e-tr").value.trim(),trad_ar:$("#e-trad").value.trim(),note_ar:$("#e-note").value.trim(),updated:Date.now()};
  if(!s.title||!s.body||!s.sec){toast(t("needTitle"));return}
  if(old.order!=null)s.order=old.order;
  if(await writeSong(s)) toast(t("saved")); else toast(t("localOnly"));
  closeSheet(); location.hash="s-"+s.id; render();
}
async function writeSong(s){
  if(db&&canEdit){try{await db.collection("songs").doc(s.id).set(s);remote[s.id]=s;return true}catch(e){if(e&&e.code==="invalid_argument"){canEdit=false;dbState="viewer"}}}
  local[s.id]={...s,mine:!BUILTIN.some(b=>b.id===s.id)};store.set("local",local);return false;
}
async function removeSong(s){
  if(local[s.id]){delete local[s.id];store.set("local",local)}
  if(remote[s.id]&&db&&canEdit){try{await db.collection("songs").doc(s.id).delete();delete remote[s.id]}catch(e){}}
  closeSheet();toast(t("deleted"));
  location.hash=BUILTIN.some(b=>b.id===s.id)?"s-"+s.id:""; render();
}

/* ---------- menu, export, import ---------- */
function openMenu(){
  $("#panel").innerHTML=`<h2>${t("brand")}</h2><div class="menu">
   <a id="m-dl">📲 <span dir="rtl">${T.ar.dlBar}</span> · <span dir="ltr">${T.it.dlBar}</span></a>${canEdit?`<a id="m-exp">⇩ ${t("export")}</a><a id="m-imp">⇧ ${t("import")}</a>`:""}${S.lang==="ar"?`<a id="m-noit">${noIt?"☑":"☐"} إِخْفَاءُ النَّصِّ الإِيطَالِيِّ <span dir="ltr" style="font-size:.85em;opacity:.7">· Nascondi l’italiano</span></a>`:""}<a id="m-about">ⓘ ${t("about")}</a></div>
   <div id="m-out"></div><div class="row"><button class="btn" id="m-close">${t("close")}</button></div>`;
  $("#sheet").classList.remove("hidden");
  $("#m-close").onclick=closeSheet;$("#m-dl").onclick=openDownload;
  if($("#m-noit"))$("#m-noit").onclick=()=>{noIt=!noIt;store.set("noit",noIt);closeSheet();render()};
  $("#m-about").onclick=()=>{$("#m-out").innerHTML=`<p class="help" style="font-size:14px">${t("aboutText")}</p>`};
  if(!canEdit)return;
  $("#m-imp").onclick=()=>$("#file").click();
  $("#m-exp").onclick=async()=>{
    const data=JSON.stringify({app:"canti",version:1,songs:[...Object.values(remote),...Object.values(local)]},null,1);
    try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:"canti.json",data});toast(t("exported"));return}}catch(e){}
    $("#m-out").innerHTML=`<label>${t("copyJson")}</label><textarea class="fld ltrf" readonly style="min-height:140px">${esc(data)}</textarea>
      <div class="row"><button class="btn" id="m-copy">⧉</button></div>`;
    $("#m-copy").onclick=async()=>{try{await navigator.clipboard.writeText(data);toast(t("copied"))}catch(e){$("#m-out textarea").select()}};
  };
}
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;let n=0;
  try{const j=JSON.parse(await f.text());for(const s of (j.songs||[])){if(s&&s.id&&s.title&&s.body){await writeSong({...s,id:String(s.id).replace(/[^A-Za-z0-9_-]/g,"")});n++}}}catch(err){}
  e.target.value="";closeSheet();toast(t("imported").replace("{n}",n));render();
};

function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- events ---------- */
$("#lang").onclick=()=>{S.lang=S.lang==="ar"?"it":"ar";store.set("lang",S.lang);render()};
$("#dark").onclick=()=>{dark=!dark;store.set("dark",dark);render()};
$("#more").onclick=openMenu;
$("#zoom").onclick=openZoom;
$("#back").onclick=()=>{const r=route();
  if(r.hymn){location.hash=S.q?"":lastInni;return}
  if(r.inni){const M=IMENU[r.inni];location.hash=M&&M.parent?"inni-"+M.parent:(r.inni==="home"?"canti":"inni");return}
  if(r.canti||r.plist){S.q="";$("#q").value="";S.filter="all";location.hash="";return}if(r.song&&PR[r.song]){const f=S.from;S.from=null;if(!f&&PR[r.song].grp&&!S.q)S.scrollTo="g-"+PR[r.song].grp;location.hash=f||(S.q?"canti":"preghiere");return}if(r.song){const s=allSongs().find(x=>x.id===r.song);location.hash=s&&S.filter==="all"&&!S.q?"sec-"+subOf(s):"canti"}else if(r.sec)location.hash="canti";else{S.q="";$("#q").value="";location.hash=""}};
$("#fab").onclick=()=>{if(canEdit)openEditor(null,route().sec)};
$("#q").oninput=e=>{S.q=e.target.value;const r=route();if(!(r.home||r.canti||r.sec)){location.hash="canti";return}render()};
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
$("#chips").onclick=e=>{const b=e.target.closest("[data-f]");if(b){S.filter=b.dataset.f;if(location.hash!=="#canti")location.hash="canti";else render()}};
$("#main").onclick=e=>{
  const bk=e.target.closest("[data-back]");if(bk){const [hh,anc]=bk.dataset.back.split("#");S.scrollTo=anc||null;if(location.hash.slice(1)===hh)render();else location.hash=hh;return}
  if(e.target.closest("[data-menu]")){S.q="";$("#q").value="";S.filter="all";location.hash="";window.scrollTo(0,0);return}
  const fv=e.target.closest("[data-favs]");if(fv){S.filter="fav";location.hash="canti";window.scrollTo(0,0);render();return}
  const hm=e.target.closest("[data-home]");if(hm){S.filter="all";location.hash=hm.dataset.home;window.scrollTo(0,0);return}
  const tg=e.target.closest("[data-tog]");if(tg){const box=tg.classList.contains("tref")?tg.nextElementSibling:tg.closest(".exp");const tr=box.previousElementSibling;const open=box.classList.toggle("hidden")===false;tr.classList.toggle("open",open);if(!open)tr.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(e.target.closest("[data-pl]")){location.hash="preghiere";return}
  const go=e.target.closest("[data-go]");if(go){if(go.dataset.go.startsWith("s-")&&route().inni)S.from=location.hash.slice(1);location.hash=go.dataset.go;return}
  const sc=e.target.closest("[data-sec]");if(sc){location.hash="sec-"+sc.dataset.sec;return}
  const it=e.target.closest(".item");if(it){if(it.classList.contains("plink")){const cur=location.hash.slice(3);const cp=PRAYERS.find(x=>x.id===cur);if(cp&&cp.grp==="ros")sessionStorage.setItem("rosBack",cur)}S.transpose=0;S.tab="text";location.hash="s-"+it.dataset.id;return}
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();return}
  const a=e.target.closest("[data-act]");if(!a)return;const id=route().song;const s=allSongs().find(x=>x.id===id);
  switch(a.dataset.act){
    case"fav":favs.has(id)?favs.delete(id):favs.add(id);store.set("favs",[...favs]);break;
    case"fs-":fs=Math.max(13,fs-1);store.set("fs",fs);break;
    case"fs+":fs=Math.min(30,fs+1);store.set("fs",fs);break;
    case"chords":S.chords=!S.chords;break;
    case"tr-":S.transpose-=1;if(S.transpose<-6)S.transpose+=12;break;
    case"tr+":S.transpose+=1;if(S.transpose>6)S.transpose-=12;break;
    case"edit":if(canEdit)openEditor(s);return;
  }
  render();
};
window.addEventListener("hashchange",()=>{S.confirmDel=false;render()});
render();

/* ---------- shared store ---------- */
(async()=>{
  try{
    try{const u=await claude.use("user");if(u){const c=await u.canEdit();let o=false;try{o=(await u.isOwner())===true}catch(e){}canEdit=c===true||o}}catch(e){canEdit=false}
    render();
    db=await claude.use("db");
    if(!db){dbState="none";render();return}
    dbState=canEdit?"editor":"viewer";
    const timer=setTimeout(()=>{if(dbState!=="ready-editor"&&!Object.keys(remote).length){dbState="offline";render()}},10000);
    db.collection("songs").onSnapshot(snap=>{
      remote={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.title)remote[d.id]={...v,id:d.id}});
      if(!snap.metadata.fromCache){clearTimeout(timer);if(dbState==="offline")dbState=canEdit?"editor":"viewer"}
      render();
    },err=>{clearTimeout(timer);dbState="offline";render()});
  }catch(e){dbState="none";render()}
})();
</script>
</body>
