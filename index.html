<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1a17;--muted:#6f675e;--line:#e6dfd4;--accent:#8a2424;--chip:#f1ebe1;--chord:#1f5f8b;--fs:18px}
.dark{--bg:#15130f;--card:#1f1c17;--ink:#ece6dc;--muted:#a59c90;--line:#35302a;--accent:#e08a7a;--chip:#2a2620;--chord:#7fb8e0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{font-family:"Noto Naskh Arabic",Lora,serif;font-size:16px;line-height:1.5;min-height:100vh}
[dir=ltr] body,body.ltr{font-family:Lora,"Noto Naskh Arabic",serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-weight:600;font-size:19px;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:38px;height:38px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:14px}
.ib.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.zbtn{gap:1px;font-family:Lora,serif;font-weight:600}.zbtn .z1{font-size:12px}.zbtn .z2{font-size:19px}
.zlist{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.zopt{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--line);background:var(--card);color:inherit;border-radius:14px;padding:10px 16px;cursor:pointer;text-align:start;min-height:60px}

:root{--bg:#f1f5fc;--card:#fff;--ink:#12203d;--muted:#5a6683;--line:#d8e1f0;--accent:#0d47a1;--chip:#e2eaf8;--chord:#c62828;--red:#d32f2f;--navy:#0a2a63;--navy2:#0d47a1}
.dark{--bg:#06142f;--card:#0c2149;--ink:#edf2ff;--muted:#9fb0d2;--line:#1d3769;--accent:#8db3ff;--chip:#142f66;--chord:#ff8a80;--red:#ff6b6b}
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border-bottom:none;color:#fff;box-shadow:0 2px 10px rgba(5,25,70,.25)}
.dark header{background:linear-gradient(135deg,#041029 0%,#0a2a63 100%)}
.brand{color:#fff;display:flex;align-items:center;gap:9px}.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand img{width:32px;height:32px;border-radius:9px;clip-path:inset(0 round 9px);flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
header .ib{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
header .search{background:#fff;color:#12203d;border-color:transparent}
.dark header .search{background:#0c2149;color:#edf2ff}
header .chip{background:rgba(255,255,255,.14);color:#fff}
header .chip.on{background:#fff;color:var(--navy)}
.dark header .chip.on{color:#0a2a63}
.fab{background:var(--red)}
.btn.pri{background:var(--accent)}
.dark .btn.pri,.dark .ib.on{color:#06142f}
.sechead,.sectitle h1,.song h1{color:var(--accent)}
.list{box-shadow:0 1px 3px rgba(10,42,99,.06)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 10px 6px}
.hero img{width:132px;height:132px;border-radius:34px;clip-path:inset(1px round 34px);box-shadow:0 8px 24px rgba(10,42,99,.28)}
.hero .h1{margin-top:12px;font-size:24px;font-weight:600;color:var(--accent)}
.hero .h2{font-size:14px;color:var(--muted);margin-top:2px}
.hero .h2 .l{font-family:Lora,serif;font-style:italic}
.dl{background:linear-gradient(135deg,var(--navy2),var(--navy))}
.dark .dl{background:linear-gradient(135deg,#123a85,#0a2a63)}
.list.prl{border-color:var(--accent);border-width:1.5px}
.item.prbar{background:var(--chip)}.item.prbar .ic{color:var(--red)}
.pv .m,.pv .amk,.rubr,.tref .ti,.inc .ih,.pv.myst .mh{color:var(--red)}
.inc{border-inline-start-color:var(--accent)}
.dsep{border-top-color:var(--accent)}
.panel h2{color:var(--accent)}
.home{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
body.onhome{background:radial-gradient(ellipse at 50% 30%,#fdeed6 0%,#f7e0bd 60%,#efcf9f 100%) fixed;color:#0a2a63}
body.onhome main{background:transparent}
body.parch{background:radial-gradient(ellipse at 50% 20%,#fdf1dc 0%,#f6e3c2 65%,#efd3a5 100%) fixed;color:#0a2a63}
body.parch header{position:sticky;overflow:hidden}
body.parch header .bar,body.parch header #listhead{position:relative;z-index:1}
body.parch .search{background:#fbf1de;border:2px solid #c9962c;color:#0a2a63}
body.parch .chip{background:#fbf1de;border:2px solid #c9962c;color:#8f1d1d;font-weight:600}
body.parch .chip.on{background:#fbf1de;border-color:#b3261e;color:#b3261e}
body.parch .chip[data-f=fav]{background:#0a2a63;color:#fff;border-color:#c9962c}
.phero{display:block;width:calc(100% + 28px);margin:-14px -14px 10px;height:auto}
.plist2{display:flex;flex-direction:column;gap:10px}
.prow{position:relative;display:flex;align-items:center;min-height:72px;background:linear-gradient(90deg,#f6e6c4,#fdf5e6 40%,#fbf0dc);border:2px solid #d9b25c;border-radius:20px;box-shadow:0 3px 8px rgba(120,70,0,.15),inset 0 0 0 2px #fff6e3;cursor:pointer;overflow:hidden;padding:6px 40px 6px 14px}
.prow .th{position:absolute;left:0;top:0;bottom:0;height:100%;width:40%;object-fit:cover;object-position:center;-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
.prow .t{flex:1;text-align:center;position:relative;z-index:1}
.prow.hasth .t{padding-left:36%}
.prow .bi{align-items:center}.prow .bi>span{text-align:center!important}
.prow .bi .bar{font-weight:700;color:#0a2a63;font-size:1.2em}.prow .bi .bit{font-family:Lora,serif;font-style:italic;color:#0a2a63;opacity:.9}
.prow .ptr{display:block;font-family:Lora,serif;font-size:12px;color:#7a5a2a}
.prow .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:26px;color:#8f5a1a}
.prow.big{min-height:96px}
.pgrp{position:relative;display:flex;align-items:center;justify-content:center;margin:20px 0 12px;min-height:66px}
.pgrp .band{position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%);background:linear-gradient(180deg,#123d86,#0a2a63);border:2px solid #d9a840;border-radius:12px}
.pgrp .lau{position:absolute;top:50%;transform:translateY(-50%);height:40px}.pgrp .lau.r{right:6px}.pgrp .lau.l{left:6px;transform:translateY(-50%) scaleX(-1)}
.pgrp .mid{position:relative;background:linear-gradient(180deg,#164a9c,#0a2a63);border:2px solid #d9a840;border-radius:22px;padding:6px 26px;color:#fff;text-align:center;box-shadow:0 3px 8px rgba(0,0,40,.3)}
.pgrp .mid .a{font-weight:700;font-size:1.15em;line-height:1.3}.pgrp .mid .b{font-family:Lora,serif;font-style:italic;font-size:.9em}
.pgrp .cnt{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#0a2a63;border:3px solid #d9a840;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Lora,serif;font-size:20px}
.chero{display:flex;align-items:center;margin:-14px -14px 0;min-height:150px}
.chero .angel{width:52%;max-width:240px;flex:none}
.chero .ct{flex:1;text-align:center}
.chero .ct .a{font-size:48px;font-weight:700;color:#8f1d1d;line-height:1.1;font-family:"Noto Naskh Arabic",serif}
.chero .ct .b{font-family:Lora,serif;font-style:italic;font-weight:600;font-size:34px;color:#0a2a63;line-height:1.2}
.chero .orn{display:flex;align-items:center;gap:8px;margin:6px 8%;color:#c9962c;font-size:20px}.chero .orn:before,.chero .orn:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#c9962c,transparent)}
.parch .sechead.big{font-size:26px;font-weight:700;color:#0a2a63;margin:6px 4px 10px}
.list.secl{background:#fbf3e3;border:2px solid #d9b25c;border-radius:22px;box-shadow:0 6px 16px rgba(120,70,0,.15);overflow:hidden}
.list.secl .item{background:transparent;border-color:#e3c98f;padding:10px 12px;gap:12px}
.list.secl .med{width:62px;height:62px;flex:none}
.list.secl .bi .bar{font-size:1.3em;font-weight:700;color:#0a2a63}.list.secl .bi .bit{font-family:Lora,serif;font-style:italic;color:#0a2a63;opacity:.85}
.list.secl .count{font-weight:700;color:#0a2a63}
body.parch .tomenu[data-menu]{position:relative;background:linear-gradient(180deg,#a3242a,#7a141a);border:3px solid #d9a840;box-shadow:0 4px 12px rgba(90,10,10,.35),inset 0 0 0 2px #7a141a;border-radius:22px;padding:16px 70px;font-size:20px}
.home2{max-width:520px;margin:0 auto;padding-bottom:18px}
.home2 .herox{display:block;width:calc(100% + 28px);margin:-14px -14px 0;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.home2 .htitle{text-align:center;margin-top:-8px}
.home2 .htitle .a{font-size:34px;font-weight:700;color:#0a2a63;line-height:1.2}.home2 .htitle .a .l{font-family:Lora,serif;font-size:26px}
.home2 .htitle .b{font-size:17px;color:#0a2a63}.home2 .htitle .c{font-family:Lora,serif;font-style:italic;font-size:13px;color:#0a2a63}
.home2 .orn{display:flex;align-items:center;gap:10px;margin:8px 12% 14px;color:#c9962c}.home2 .orn:before,.home2 .orn:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#c9962c,transparent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;padding:0;border:0;background:none;cursor:pointer;transition:transform .12s;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.97)}
.tile img{display:block;width:100%;height:auto}
.tile.big img{border-radius:6.5%/5.5%;box-shadow:0 6px 18px rgba(80,40,0,.25)}
.tile.sm img{border-radius:7%/10.5%;box-shadow:0 4px 12px rgba(120,70,0,.18)}
.tiles.sm{margin-top:12px}
.tile.ttx{aspect-ratio:458/420;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:22px;background:radial-gradient(circle at 50% 35%,#1c56b0,#0a2a63 75%);border:3px solid #d9a840;box-shadow:inset 0 0 0 4px #0a2a63,inset 0 0 0 5.5px #d9a840,0 6px 18px rgba(80,40,0,.25);color:#fff}
.tile.ttx.red{background:radial-gradient(circle at 50% 35%,#c62828,#7f1414 75%);box-shadow:inset 0 0 0 4px #7f1414,inset 0 0 0 5.5px #d9a840,0 6px 18px rgba(80,40,0,.25)}
.tile.ttx .a{font-family:"Noto Naskh Arabic",serif;font-weight:700;font-size:46px;line-height:1.2}
.tile.ttx .b{font-family:Lora,serif;font-style:italic;font-size:19px;color:#f3dfae}
.tile.ttx .orn2{width:55%;height:2px;background:linear-gradient(90deg,transparent,#d9a840,transparent)}
.home .hero{padding:10px 10px 4px}.home .hero img{width:96px;height:96px;border-radius:26px;clip-path:inset(1px round 26px)}
.halves{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 8px;min-height:260px}
.half{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:22px;padding:22px 10px;cursor:pointer;color:#fff;text-align:center;border:none;font:inherit;box-shadow:0 6px 20px rgba(10,42,99,.22);transition:transform .12s}
.half:active{transform:scale(.97)}
.half.hp{background:linear-gradient(160deg,#0d47a1,#0a2a63)}.half.hc{background:linear-gradient(160deg,#b71c1c,#7f1616)}
.dark .half.hp{background:linear-gradient(160deg,#164f9e,#0a2a63)}.dark .half.hc{background:linear-gradient(160deg,#a32626,#5e1010)}
.half .hi{font-size:44px;line-height:1}.half .ha{font-size:30px;font-weight:600}.half .hl{font-family:Lora,serif;font-size:22px;font-style:italic}
.half .hs{font-size:12.5px;opacity:.85;line-height:1.5;margin-top:4px}
.dl-logo{display:block;width:72px;height:72px;border-radius:19px;clip-path:inset(1px round 19px);margin:0 auto 10px}
/* ---------- tema dorato unico (2026-11-20) ---------- */
html:not(.dark){--bg:#f8ecd4;--card:#fdf6e8;--ink:#1f2a44;--muted:#7a5a2a;--line:#e3c98f;--accent:#0a2a63;--chip:#f6e6c4;--chord:#8f5a1a;--red:#8f5a1a;--gold:#c9962c;--gold2:#9a6b1f}
html:not(.dark) body,html:not(.dark) body.parch,html:not(.dark) body.onhome{background:radial-gradient(ellipse at 50% 20%,#fdf1dc 0%,#f6e3c2 65%,#efd3a5 100%) fixed;color:#0a2a63}
html:not(.dark) .list{background:#fdf6e8;border:2px solid #d9b25c;border-radius:18px;box-shadow:0 3px 10px rgba(120,70,0,.12)}
html:not(.dark) .list .item{border-color:#ead6a6}
html:not(.dark) .chip{background:#fbf1de;border:1.5px solid #d9b25c;color:#0a2a63}
html:not(.dark) .chip.on,html:not(.dark) body.parch .chip.on{background:var(--gold2);border-color:var(--gold2);color:#fff}
html:not(.dark) body.parch .chip,html:not(.dark) body.parch .chip[data-f=fav]{background:#fbf1de;border:2px solid #c9962c;color:#0a2a63}
html:not(.dark) header .chip{background:rgba(255,255,255,.14);border-color:rgba(217,178,92,.6);color:#fff}
html:not(.dark) header .chip.on{background:#d9b25c;border-color:#d9b25c;color:#0a2a63}
html:not(.dark) .ib:not(header .ib){background:#fdf6e8;border:1.5px solid #d9b25c;color:#0a2a63}
html:not(.dark) .ib.on:not(header .ib){background:var(--gold2);border-color:var(--gold2);color:#fff}
html:not(.dark) .tomenu.tsec{background:#fbf1de;color:#0a2a63;box-shadow:none}
html:not(.dark) .today,html:not(.dark) .blk.ant,html:not(.dark) .item.prbar,html:not(.dark) .prayer .pnote,html:not(.dark) .tref{background:#fbf1de}
html:not(.dark) .today{border:2px solid #d9b25c}
html:not(.dark) .ib2n{background:#fdf6e8;border:1.5px solid #d9b25c}
html:not(.dark) .chero .ct .a{color:#0a2a63}
html:not(.dark) .list.prl{border-color:#d9b25c}
html:not(.dark) .fab,html:not(.dark) .btn.pri{background:var(--gold2);color:#fff}
html:not(.dark) .search{border:2px solid #d9b25c}
</style>
</head>

const TRAD_B = {"b1": "هَلُمُّوا أَيُّهَا الْمُؤْمِنُونَ،\nفَرِحِينَ مُنْتَصِرِينَ،\nهَلُمُّوا، هَلُمُّوا إِلَى بَيْتَ لَحْمَ.\nاُنْظُرُوا الْمَوْلُودَ\nمَلِكَ الْمَلَائِكَةِ.\n\n> هَلُمُّوا نَسْجُدْ (٣ مَرَّاتٍ)\n> لِلرَّبِّ.\n\nتَارِكِينَ الْقَطِيعَ،\nيُسْرِعُ الرُّعَاةُ الْمَدْعُوُّونَ\nإِلَى الْمِذْوَدِ الْمُتَوَاضِعِ.\nوَنَحْنُ أَيْضًا\nفَلْنُسْرِعْ بِخُطًى مُبْتَهِجَةٍ.\n\nبَهَاءَ الْآبِ الْأَزَلِيِّ،\nالْبَهَاءَ الْأَبَدِيَّ،\nسَنَرَاهُ مُحْتَجِبًا فِي الْجَسَدِ:\nاللهَ طِفْلًا\nمَلْفُوفًا بِالْأَقْمِطَةِ.", "b2": "أَسْجُدُ لَكَ بِخُشُوعٍ، أَيُّهَا اللَّاهُوتُ الْمُحْتَجِبُ،\nالْمُسْتَتِرُ حَقًّا تَحْتَ هَذِهِ الْأَعْرَاضِ:\nلَكَ يَخْضَعُ قَلْبِي كُلُّهُ،\nلِأَنَّهُ إِذْ يَتَأَمَّلُكَ يَفْنَى كُلُّهُ.\n\nالْبَصَرُ وَاللَّمْسُ وَالذَّوْقُ تُخْطِئُ فِيكَ،\nوَبِالسَّمْعِ وَحْدَهُ نُؤْمِنُ بِيَقِينٍ:\nأُؤْمِنُ بِكُلِّ مَا قَالَهُ ابْنُ اللهِ،\nوَلَا شَيْءَ أَصْدَقُ مِنْ كَلِمَةِ الْحَقِّ هَذِهِ.\n\nعَلَى الصَّلِيبِ كَانَ اللَّاهُوتُ وَحْدَهُ مُحْتَجِبًا،\nوَهُنَا تَحْتَجِبُ الْإِنْسَانِيَّةُ أَيْضًا:\nوَإِذْ أُؤْمِنُ بِكِلَيْهِمَا وَأَعْتَرِفُ بِهِمَا،\nأَطْلُبُ مَا طَلَبَهُ اللِّصُّ التَّائِبُ.\n\nلَا أَرَى الْجِرَاحَ كَمَا رَآهَا تُومَا،\nلَكِنِّي أَعْتَرِفُ بِأَنَّكَ إِلَهِي:\nاجْعَلْنِي أُؤْمِنُ بِكَ أَكْثَرَ فَأَكْثَرَ،\nوَأَرْجُوكَ وَأُحِبُّكَ.\n\nيَا تَذْكَارَ مَوْتِ الرَّبِّ،\nأَيُّهَا الْخُبْزُ الْحَيُّ الْوَاهِبُ الْحَيَاةَ لِلْإِنْسَانِ،\nهَبْ نَفْسِي أَنْ تَحْيَا بِكَ،\nوَأَنْ تَجِدَ طَعْمَكَ عَذْبًا دَائِمًا.\n\nأَيُّهَا الْبَجَعُ الْحَنُونُ، يَا رَبُّ يَسُوعُ،\nطَهِّرْنِي أَنَا النَّجِسَ بِدَمِكَ،\nالَّذِي قَطْرَةٌ وَاحِدَةٌ مِنْهُ تَقْدِرُ\nأَنْ تُخَلِّصَ الْعَالَمَ كُلَّهُ مِنْ كُلِّ إِثْمٍ.\n\nيَا يَسُوعُ، يَا مَنْ أَرَاهُ الْآنَ مُحْتَجِبًا،\nأَسْأَلُكَ أَنْ يَتِمَّ مَا أَعْطَشُ إِلَيْهِ:\nأَنْ أُعَايِنَ وَجْهَكَ مَكْشُوفًا\nفَأَسْعَدَ بِرُؤْيَةِ مَجْدِكَ. آمِينَ.", "b3": "> اُنْظُرْ يَا رَبُّ وَارْحَمْ،\n> لِأَنَّنَا خَطِئْنَا إِلَيْكَ.\n\nإِلَيْكَ أَيُّهَا الْمَلِكُ الْأَعْلَى، فَادِي الْجَمِيعِ،\nنَرْفَعُ عُيُونَنَا بَاكِينَ:\nاسْتَجِبْ أَيُّهَا الْمَسِيحُ لِصَلَوَاتِ الْمُتَضَرِّعِينَ.\n\nيَا يَمِينَ الْآبِ، يَا حَجَرَ الزَّاوِيَةِ،\nيَا طَرِيقَ الْخَلَاصِ، يَا بَابَ السَّمَاءِ،\nاغْسِلْ أَدْرَانَ خَطِيئَتِنَا.\n\nنَتَوَسَّلُ يَا اللهُ إِلَى جَلَالِكَ:\nأَصْغِ بِأُذُنَيْكَ الْمُقَدَّسَتَيْنِ إِلَى أَنِينِنَا،\nوَاغْفِرْ بِحِلْمِكَ آثَامَنَا.\n\nلَكَ نَعْتَرِفُ بِالْخَطَايَا الَّتِي ارْتَكَبْنَاهَا،\nوَبِقَلْبٍ مُنْسَحِقٍ نَكْشِفُ الْخَفَايَا:\nفَلْتَصْفَحْ رَحْمَتُكَ أَيُّهَا الْفَادِي.\n\nقُبِضَ عَلَيْكَ وَأَنْتَ بَرِيءٌ، وَاقْتَادُوكَ وَلَمْ تُقَاوِمْ،\nوَبِشُهُودِ زُورٍ حُكِمَ عَلَيْكَ مِنْ أَجْلِ الْأَثَمَةِ:\nاحْفَظْ أَيُّهَا الْمَسِيحُ الَّذِينَ افْتَدَيْتَهُمْ.", "b4": "السَّلَامُ عَلَيْكِ يَا نَجْمَةَ الْبَحْرِ،\nيَا أُمَّ اللهِ الْحَنُونَ،\nوَالْعَذْرَاءَ دَائِمًا،\nيَا بَابَ السَّمَاءِ السَّعِيدَ.\n\nيَا مَنْ قَبِلْتِ ذَلِكَ السَّلَامَ\nمِنْ فَمِ جِبْرَائِيلَ،\nثَبِّتِينَا فِي السَّلَامِ،\nيَا مَنْ قَلَبْتِ اسْمَ حَوَّاءَ.\n\nحُلِّي قُيُودَ الْخَاطِئِينَ،\nوَهَبِي النُّورَ لِلْعُمْيَانِ،\nاطْرُدِي شُرُورَنَا،\nوَاطْلُبِي لَنَا كُلَّ خَيْرٍ.\n\nأَظْهِرِي أَنَّكِ أُمٌّ،\nوَلْيَقْبَلْ صَلَاتَنَا بِكِ\nمَنْ وُلِدَ مِنْ أَجْلِنَا\nوَارْتَضَى أَنْ يَكُونَ ابْنَكِ.\n\nأَيَّتُهَا الْعَذْرَاءُ الْفَرِيدَةُ،\nالْوَدِيعَةُ بَيْنَ الْجَمِيعِ،\nاجْعَلِينَا، وَقَدْ تَحَرَّرْنَا مِنَ الْخَطَايَا،\nوُدَعَاءَ أَطْهَارًا.\n\nامْنَحِينَا حَيَاةً نَقِيَّةً،\nوَمَهِّدِي لَنَا طَرِيقًا آمِنًا،\nحَتَّى إِذَا رَأَيْنَا يَسُوعَ\nنَفْرَحُ مَعًا إِلَى الْأَبَدِ.\n\nالْحَمْدُ لِلهِ الْآبِ،\nوَالْمَجْدُ لِلْمَسِيحِ الْعَلِيِّ،\nوَلِلرُّوحِ الْقُدُسِ:\nلِلثَّلَاثَةِ إِكْرَامٌ وَاحِدٌ.\nآمِينَ.", "b5": "أَيُّهَا الْمَسِيحُ، يَا رَبَّ الْجَمِيعِ الْحَنُونَ،\nالْمَوْلُودَ مِنْ فِكْرِ الْآبِ الْأَعْلَى،\nاُنْظُرْ بِرِفْقٍ إِلَى أَصْوَاتِ الْمُتَضَرِّعِينَ\nوَإِلَى نَشِيدِهِمْ مَعًا.\n\nاُنْظُرْ يَا اللهُ كَيْفَ يُرَنِّمُ شَعْبُكَ\nالْمُتَضَرِّعُ فِي الْهَيْكَلِ لِجَمَالِهِ،\nوَقَدْ عَادَتْ أَعْيَادُهُ\nالَّتِي يَحْتَفِلُ بِهَا كُلَّ عَامٍ.\n\nهَذَا الْبَيْتُ يَرْتَفِعُ مُكَرَّسًا لَكَ\nكَمَا يَلِيقُ، وَفِيهِ يَتَنَاوَلُ الشَّعْبُ\nالْجَسَدَ الْمُقَدَّسَ مِنَ الْمَذْبَحِ،\nوَيَشْرَبُ مِنَ الدَّمِ الْمُبَارَكِ.\n\nهُنَا الْمِيَاهُ الْمُقَدَّسَةُ تَغْسِلُ\nذُنُوبَ الْخَاطِئِينَ وَتَمْحُو الْآثَامَ،\nوَبِالْمَيْرُونِ يُولَدُ\nشَعْبُ الْمَسِيحِيِّينَ الَّذِي لَا يُقْهَرُ.\n\nهُنَا يُعْطَى الشِّفَاءُ لِلْمَرْضَى، وَالدَّوَاءُ لِلْمُتْعَبِينَ،\nوَالنُّورُ لِلْعُمْيَانِ؛ هُنَا مِنْ ذُنُوبِنَا\nتُحَرِّرُنَا أَيُّهَا الْمَسِيحُ، وَكُلُّ خَوْفٍ وَحُزْنٍ\nيُطْرَدُ بَعِيدًا.\n\nهُنَا تَبْطُلُ غَنِيمَةُ الشَّيْطَانِ الْقَاسِي:\nيَرْتَعِدُ الْوَحْشُ الْعَنِيدُ، وَيَتْرُكُ\nالْأَجْسَادَ الَّتِي كَانَ يَأْسِرُهَا،\nوَيَهْرُبُ سَرِيعًا إِلَى الْأَجْوَاءِ الْبَعِيدَةِ.\n\nهَذَا الْمَكَانُ يُدْعَى قَصْرَ الْمَلِكِ\nالسَّمَاوِيِّ، وَبَابَ السَّمَاءِ الْمُتَلَأْلِئَ\nالَّذِي يَسْتَقْبِلُ جَمِيعَ\nالْقَاصِدِينَ وَطَنَ الْحَيَاةِ.\n\nلَا تُزَعْزِعُهُ زَوْبَعَةٌ، وَلَا تَهْدِمُهُ\nالرِّيَاحُ الْهَائِجَةُ، وَلَا تَنْفُذُ إِلَيْهِ الْعَوَاصِفُ؛\nوَيَرْتَعِدُ مِنْ هَذَا الْبَيْتِ\nالْجَحِيمُ الْمُظْلِمُ.\n\nفَنَطْلُبُ إِلَيْكَ بِصَلَوَاتِنَا\nأَنْ تَسْتَجِيبَ بِوَجْهٍ صَافٍ، وَأَنْ تَقُودَ عَبِيدَكَ\nالَّذِينَ يَحْتَفِلُونَ بِمَحَبَّةٍ عُظْمَى\nبِأَفْرَاحِ هَيْكَلِكَ.\n\nلَا تُعَذِّبْنَا عَاصِفَةٌ فِي الْحَيَاةِ:\nلِتَكُنْ أَيَّامُنَا فَرِحَةً وَلَيَالِينَا هَادِئَةً،\nوَلَا يَذُقْ أَحَدٌ مِنَّا النَّارَ\nعِنْدَ زَوَالِ الْعَالَمِ.\n\nوَلْيَمْنَحْنَا هَذَا الْيَوْمُ الَّذِي فِيهِ\nتَرَى هَيْكَلَكَ مُكَرَّسًا لَكَ\nفَرَحًا دَائِمًا، وَلْيَدُمْ\nعَلَى مَرِّ الزَّمَانِ.\n\nلِيَصْدَحِ التَّسْبِيحُ لِلْآبِ الْعَلِيِّ،\nوَلْيَتَرَنَّمِ التَّسْبِيحُ لِلِابْنِ وَلِلرُّوحِ\nالْقُدُسِ بِنَشِيدٍ عَذْبٍ\nإِلَى دَهْرِ الدُّهُورِ. آمِينَ.", "b6": "> أَيُّهَا الصَّلِيبُ الْأَمِينُ، يَا شَجَرَةً\n> وَحِيدَةً نَبِيلَةً بَيْنَ الْأَشْجَارِ كُلِّهَا:\n> لَا تُخْرِجُ غَابَةٌ مِثْلَكِ\n> وَرَقًا وَزَهْرًا وَثَمَرًا.\n> يَا خَشَبَةً عَذْبَةً، بِمَسَامِيرَ عَذْبَةٍ\n> تَحْمِلِينَ حِمْلًا عَذْبًا.\n\nرَنِّمْ يَا لِسَانُ إِكْلِيلَ\nالْمَعْرَكَةِ الْمَجِيدَةِ،\nوَعَلَى غَنِيمَةِ الصَّلِيبِ\nأَنْشِدِ النَّصْرَ النَّبِيلَ:\nكَيْفَ أَنَّ فَادِيَ الْعَالَمِ\nغَلَبَ وَهُوَ ذَبِيحٌ.\n\nهُوَذَا يَذْبُلُ وَقَدْ سُقِيَ الْمَرَارَةَ:\nالشَّوْكُ وَالْمَسَامِيرُ وَالْحَرْبَةُ\nثَقَبَتِ الْجَسَدَ الْوَدِيعَ،\nفَجَرَى الْمَاءُ وَالدَّمُ:\nالْأَرْضُ وَالْبَحْرُ وَالنُّجُومُ وَالْعَالَمُ\nبِهَذَا النَّهْرِ تُغْسَلُ!\n\nأَحْنِي أَغْصَانَكِ أَيَّتُهَا الشَّجَرَةُ الْعَالِيَةُ،\nوَأَرْخِي أَحْشَاءَكِ الْمَشْدُودَةَ،\nوَلْتَلِنْ تِلْكَ الصَّلَابَةُ\nالَّتِي أَعْطَتْكِ إِيَّاهَا الطَّبِيعَةُ،\nوَابْسُطِي أَعْضَاءَ الْمَلِكِ الْعُلْوِيِّ\nعَلَى جِذْعٍ لَيِّنٍ.\n\nأَنْتِ وَحْدَكِ كُنْتِ أَهْلًا\nأَنْ تَحْمِلِي ذَبِيحَةَ الْعَالَمِ،\nوَأَنْ تُعِدِّي مِينَاءً\nكَفُلْكٍ لِلْعَالَمِ الْغَرِيقِ:\nأَنْتِ الَّتِي مَسَحَهَا الدَّمُ الْمُقَدَّسُ\nالْمَسْفُوكُ مِنْ جَسَدِ الْحَمَلِ.\n\nلِلثَّالُوثِ الطُّوبَاوِيِّ\nالْمَجْدُ الْأَبَدِيُّ،\nلِلْآبِ وَلِلِابْنِ بِالتَّسَاوِي،\nوَكَرَامَةٌ مُسَاوِيَةٌ لِلْبَارَقْلِيطِ:\nلِيُسَبِّحِ الْكَوْنُ كُلُّهُ\nاسْمَ الْوَاحِدِ وَالثَّالُوثِ.", "b7": "أَيُّهَا الْمَسِيحُ الْعَذْبُ، يَا اللهُ الصَّالِحُ،\nيَا حُبِّي، يَا حَيَاتِي،\nيَا خَلَاصِي، يَا مَجْدِي.\nأَنْتَ الْخَالِقُ، أَنْتَ مُخَلِّصُ الْعَالَمِ.\nإِيَّاكَ أُرِيدُ، إِيَّاكَ أَطْلُبُ،\nلَكَ أَسْجُدُ، يَا حُبِّيَ الْعَذْبَ،\nلَكَ أَسْجُدُ، يَا يَسُوعُ الْحَبِيبُ.", "b8": "اسْتَمِعْ يَا رَبُّ صَوْتِي\nالَّذِي بِهِ صَرَخْتُ إِلَيْكَ،\nارْحَمْنِي وَاسْتَجِبْ لِي.\nلَكَ قَالَ قَلْبِي: الْتَمَسَكَ وَجْهِي.\nوَجْهَكَ يَا رَبُّ أَلْتَمِسُ.\nلَا تَحْجُبْ وَجْهَكَ عَنِّي.\nلَا تَرُدَّ عَبْدَكَ بِغَضَبٍ.", "b9": "> افْرَحُوا، افْرَحُوا! وُلِدَ الْمَسِيحُ\n> مِنْ مَرْيَمَ الْعَذْرَاءِ: افْرَحُوا!\n\nهَا قَدْ حَلَّ زَمَنُ النِّعْمَةِ الَّذِي كُنَّا نَتَمَنَّاهُ،\nفَلْنُقَدِّمْ بِخُشُوعٍ أَنَاشِيدَ الْفَرَحِ.\n\nصَارَ اللهُ إِنْسَانًا وَالطَّبِيعَةُ مُنْدَهِشَةٌ،\nوَتَجَدَّدَ الْعَالَمُ بِالْمَسِيحِ الْمَلِكِ.\n\nفَلْتُرَنِّمْ جَمَاعَتُنَا الْآنَ فِي هَذَا الْمَوْسِمِ،\nوَلْتُبَارِكِ الرَّبَّ: الْخَلَاصُ لِمَلِكِنَا.", "b10": "وُلِدَ طِفْلٌ فِي بَيْتَ لَحْمَ، هَلِّلُويَا:\nفَلِذَلِكَ تَفْرَحُ أُورُشَلِيمُ، هَلِّلُويَا، هَلِّلُويَا.\n\n> بِابْتِهَاجِ الْقَلْبِ\n> لِنَسْجُدْ لِلْمَسِيحِ الْمَوْلُودِ\n> بِنَشِيدٍ جَدِيدٍ.\n\nاتَّخَذَ الِابْنُ جَسَدًا، هَلِّلُويَا،\nابْنُ اللهِ الْآبِ الْعَلِيُّ، هَلِّلُويَا، هَلِّلُويَا.\n\nبِبِشَارَةِ جِبْرَائِيلَ، هَلِّلُويَا،\nحَبِلَتِ الْعَذْرَاءُ بِالِابْنِ، هَلِّلُويَا، هَلِّلُويَا.\n\nكَالْعَرِيسِ مِنْ خِدْرِهِ، هَلِّلُويَا،\nخَرَجَ مِنْ حَشَا أُمِّهِ، هَلِّلُويَا، هَلِّلُويَا.\n\nهُنَا يَرْقُدُ فِي الْمِذْوَدِ، هَلِّلُويَا،\nمَنْ يَمْلِكُ بِلَا نِهَايَةٍ، هَلِّلُويَا، هَلِّلُويَا.\n\nوَالْمَلَاكُ يَكْشِفُ لِلرُّعَاةِ، هَلِّلُويَا،\nأَنَّهُ هُوَ الرَّبُّ، هَلِّلُويَا، هَلِّلُويَا.\n\nالْمُلُوكُ يَأْتُونَ مِنْ شَبَا، هَلِّلُويَا،\nيُقَدِّمُونَ ذَهَبًا وَلُبَانًا وَمُرًّا، هَلِّلُويَا، هَلِّلُويَا.\n\nفِي فَرَحِ هَذَا الْمِيلَادِ، هَلِّلُويَا،\nلِنُبَارِكِ الرَّبَّ، هَلِّلُويَا، هَلِّلُويَا.\n\nلِيُسَبَّحِ الثَّالُوثُ الْأَقْدَسُ، هَلِّلُويَا،\nوَلْنَشْكُرِ اللهَ، هَلِّلُويَا، هَلِّلُويَا.", "b11": "> هَؤُلَاءِ هُمُ الْحُمْلَانُ الْجُدُدُ\n> الَّذِينَ بَشَّرُوا، هَلِّلُويَا:\n> الْآنَ أَتَوْا إِلَى الْيَنَابِيعِ،\n> وَامْتَلَؤُوا ضِيَاءً، هَلِّلُويَا، هَلِّلُويَا.\n\nأَيَّتُهَا الْمَلِكَةُ الَّتِي\nاخْتَارَتْهَا النِّعْمَةُ الْإِلَهِيَّةُ،\nوَمَوْلُودُهَا الْقُدُّوسُ\nجَدَّدَ كُلَّ شَيْءٍ.\n\nيَا مَرْيَمُ، أَيَّتُهَا الْأُمُّ الْحَنُونُ،\nامْنَحِينَا عَوْنَكِ،\nلِنَغْلِبَ وَنَحْيَا\nفِي أَرْضِ الْأَحْيَاءِ.\n\nلِلْمَسِيحِيِّينَ يُعْطَى\nخُبْزُ الْحَيَاةِ طَعَامًا،\nوَيُعْطَى لِلْحَزِينِ دَمُ الْمَسِيحِ\nمُنْعِشًا عَذْبًا.\n\nأَوَّلًا زِيدِي إِيمَانَنَا\nبِصَلَوَاتِكِ،\nوَهَبِي لَنَا أَنْ نَقْتَدِيَ بِكِ\nبِأَعْمَالٍ صَالِحَةٍ.\n\nثَبِّتِي فِي الرَّجَاءِ الْعُقُولَ الْمُتَزَعْزِعَةَ،\nوَقَوِّيهَا بِالْمَحَبَّةِ:\nاجْعَلِينَا مُتَّفِقِينَ، اطْرُدِي الْأَدْنَاسَ،\nوَاشْفَعِي فِي آثَامِنَا.\n\nأَيَّتُهَا الْأُمُّ الصَّالِحَةُ، هَبِي لَنَا\nحِمَايَتَكِ،\nلِنَمْلِكَ وَنُسَبِّحَ\nابْنَكِ دَائِمًا.", "b12": "يَا يَسُوعُ، يَا ذِكْرًا عَذْبًا\nيَهَبُ الْقَلْبَ أَفْرَاحًا حَقِيقِيَّةً:\nلَكِنْ أَعْذَبُ مِنَ الْعَسَلِ وَمِنْ كُلِّ شَيْءٍ\nحُضُورُهُ الْحُلْوُ.\n\nلَا يُرَنَّمُ مَا هُوَ أَطْيَبُ،\nوَلَا يُسْمَعُ مَا هُوَ أَبْهَجُ،\nوَلَا يُفَكَّرُ فِيمَا هُوَ أَعْذَبُ\nمِنْ يَسُوعَ ابْنِ اللهِ.\n\nيَا يَسُوعُ، يَا رَجَاءَ التَّائِبِينَ،\nمَا أَحَنَّكَ عَلَى السَّائِلِينَ!\nمَا أَطْيَبَكَ لِلَّذِينَ يَطْلُبُونَكَ!\nفَكَيْفَ بِالَّذِينَ يَجِدُونَكَ؟\n\nلَا يَقْدِرُ لِسَانٌ أَنْ يَقُولَ،\nوَلَا حَرْفٌ أَنْ يُعَبِّرَ:\nوَحْدَهُ مَنِ اخْتَبَرَ يَسْتَطِيعُ أَنْ يُصَدِّقَ\nمَا مَعْنَى أَنْ نُحِبَّ يَسُوعَ.\n\nكُنْ يَا يَسُوعُ فَرَحَنَا،\nيَا مَنْ سَتَكُونُ مُكَافَأَتَنَا:\nلِيَكُنْ مَجْدُنَا فِيكَ\nإِلَى دَهْرِ الدُّهُورِ. آمِينَ.", "b13": "يَا يَسُوعُ، لَكَ أَحْيَا؛\nيَا يَسُوعُ، لَكَ أَمُوتُ.\nيَا يَسُوعُ، إِنْ حَيِيتُ أَوْ مُتُّ،\nفَأَنَا لَكَ.", "b14": "لَيْسَ لَنَا يَا رَبُّ، يَا رَبُّ،\nلَيْسَ لَنَا يَا رَبُّ،\nلَكِنْ لِاسْمِكَ، لِاسْمِكَ أَعْطِ الْمَجْدَ.", "b15": "> هَلِّلُويَا، هَلِّلُويَا، هَلِّلُويَا!\n\nأَيُّهَا الْأَبْنَاءُ وَالْبَنَاتُ،\nمَلِكُ السَّمَاءِ، مَلِكُ الْمَجْدِ\nقَامَ الْيَوْمَ مِنَ الْمَوْتِ، هَلِّلُويَا.\n\nوَفِي صَبَاحِ أَوَّلِ الْأُسْبُوعِ\nإِلَى بَابِ الْقَبْرِ\nجَاءَ التَّلَامِيذُ، هَلِّلُويَا.\n\nوَمَرْيَمُ الْمَجْدَلِيَّةُ\nوَمَرْيَمُ أُمُّ يَعْقُوبَ وَسَالُومَةُ\nجِئْنَ لِيُطَيِّبْنَ الْجَسَدَ، هَلِّلُويَا.\n\nمَلَاكٌ جَالِسٌ بِثِيَابٍ بِيضٍ\nأَنْبَأَ النِّسَاءَ:\nالرَّبُّ فِي الْجَلِيلِ، هَلِّلُويَا.\n\nفِي هَذَا الْعِيدِ الْأَقْدَسِ\nلِيَكُنِ التَّسْبِيحُ وَالِابْتِهَاجُ،\nلِنُبَارِكِ الرَّبَّ، هَلِّلُويَا.\n\nوَعَلَى ذَلِكَ كُلِّهِ، بِتَوَاضُعٍ\nوَخُشُوعٍ كَمَا يَجِبُ،\nلِنَرْفَعِ الشُّكْرَ لِلهِ، هَلِّلُويَا.", "b16": "يَا رَجَائِيَ الْحَبِيبَ، يَا مَرْيَمُ الْمَجِيدَةُ،\nمِنْ وَادِي الْمَرَارَةِ أَبْتَهِلُ إِلَيْكِ.\nاسْتَجِيبِي لِمَنْ يُصَلِّي، وَعَزِّي مَنْ يَصْرُخُ،\nثَبِّتِي مَنْ يَتَعَثَّرُ، وَاحْفَظِينِي.\n\nفِي الرَّخَاءِ وَالشِّدَّةِ، نَحْوَ مَا لَا يَفْنَى،\nأَيَّتُهَا الْقَوِيَّةُ، أَيَّتُهَا الطَّاهِرَةُ، قُودِي الضَّعِيفَ.\nوَحِينَ تَهِيجُ الْعَاصِفَةُ وَتُثِيرُ الْحُرُوبَ،\nقُودِي الْمَنْفِيَّ إِلَى الْمِينَاءِ يَا نَجْمَةُ.\n\nأَيَّتُهَا الشَّفِيعَةُ الْبَهِيَّةُ، فِي سَاعَةِ الرَّحِيلِ\nصَلِّي مِنْ أَجْلِي يَا أُمُّ إِلَى ابْنِكِ،\nلِأُضَمَّ مَجَّانًا، وَقَدْ غُفِرَتْ خَطَايَايَ،\nإِلَى جُمُوعِ السَّمَاوِيِّينَ الطُّوبَاوِيِّينَ.", "b17": "كُلَّ يَوْمٍ، رَدِّدِي لِمَرْيَمَ\nيَا نَفْسِي تَسَابِيحَهَا؛\nأَعْيَادَهَا وَأَعْمَالَهَا\nالْبَاهِرَةَ جِدًّا كَرِّمِي.\n\nيَا جَمِيلَةً كُلَّكِ، بِلَا أَثَرٍ\nلِأَيِّ دَنَسٍ،\nاجْعَلِينِي نَقِيًّا وَفَرِحًا\nلِأُسَبِّحَكِ بِلَا انْقِطَاعٍ.\n\nلِأَكُونَ عَفِيفًا وَمُحْتَشِمًا،\nعَذْبًا، لَطِيفًا، رَزِينًا،\nتَقِيًّا، مُسْتَقِيمًا، حَكِيمًا،\nلَا أَعْرِفُ الْخِصَامَ.\n\nمُتَعَلِّمًا وَمُحَصَّنًا\nبِالْأَقْوَالِ الْإِلَهِيَّةِ،\nخَائِفًا اللهَ وَمُزَيَّنًا\nبِالْمُمَارَسَاتِ الْمُقَدَّسَةِ.\n\nأَيَّتُهَا الْعَذْرَاءُ الْقِدِّيسَةُ، انْظُرِي كَمْ\nنَحْتَمِلُ دَائِمًا\nمِنَ التَّجَارِبِ، وَاسْنُدِينَا\nلِنَثْبُتَ بِقُوَّةٍ.\n\nكُونِي حَامِيَةً وَمُعِينَةً\nلِلشَّعْبِ الْمَسِيحِيِّ؛\nامْنَحِينَا السَّلَامَ، لِئَلَّا\nتُقْلِقَنَا الْأَزْمِنَةُ الْمُضْطَرِبَةُ.\nآمِينَ.", "b18": "> يَا مَلِكَةَ السَّمَاوَاتِ، يَا سَيِّدَتَنَا جَمِيعًا.\n> يَا نَجْمَةَ الصُّبْحِ، امْحِي الْآثَامَ.\n\nقَبْلَ الْوِلَادَةِ، عَذْرَاءَ حَامِلًا بِاللهِ،\nبَقِيتِ دَائِمًا بِلَا دَنَسٍ.\nيَا نَجْمَةَ الصُّبْحِ، امْحِي الْآثَامَ.\n\nوَفِي الْوِلَادَةِ، عَذْرَاءَ مُثْمِرَةً بِاللهِ،\nبَقِيتِ دَائِمًا بِلَا دَنَسٍ.\nيَا نَجْمَةَ الصُّبْحِ، امْحِي الْآثَامَ.\n\nوَبَعْدَ الْوِلَادَةِ، عَذْرَاءَ وَأُمًّا،\nبَقِيتِ دَائِمًا بِلَا دَنَسٍ.\nيَا نَجْمَةَ الصُّبْحِ، امْحِي الْآثَامَ.", "b19": "نَسْجُدُ بِصَلَوَاتِنَا أَمَامَ وَجْهِكَ،\nأَشْفِقْ أَيُّهَا الْمَسِيحُ:\n\n> وَاسْتَجِبْ، وَارْحَمِ الشَّعْبَ الْمُتَضَرِّعَ.\n\nيَا مَنْ بِنُصْرَةِ صَلِيبِكَ\nخَلَّصْتَ وَحْدَكَ الْعَالَمَ،\nبِآلَامِ دَمِكَ\nأَنْقِذْنَا.\n\nيَا مَنْ بِمَوْتِكَ تَدِينُ الْمَوْتَ،\nوَبِقِيَامَتِكَ تَهَبُ الْحَيَاةَ،\nوَتَحْمِلُ عَنَّا\nعِقَابًا لَمْ تَسْتَحِقَّهُ.\n\nلِنَحْتَفِلْ سَالِمِينَ\nبِأَيَّامِ آلَامِكَ،\nحَتَّى تَغْمُرَنَا بِهَا\nعُذُوبَتُكَ.\n\nلَا تَدَعِ الَّذِينَ تَأَلَّمْتَ\nمِنْ أَجْلِهِمْ عَلَى الصَّلِيبِ يَهْلِكُونَ،\nبَلْ قُدْهُمْ بِالصَّلِيبِ\nإِلَى الْحَيَاةِ الْأَبَدِيَّةِ.", "b20": "افْرَحِي يَا مَلِكَةَ السَّمَاءِ، هَلِّلُويَا.\nلِأَنَّ الَّذِي اسْتَحْقَقْتِ أَنْ تَحْمِلِيهِ، هَلِّلُويَا،\nقَامَ كَمَا قَالَ، هَلِّلُويَا.\nصَلِّي لِأَجْلِنَا إِلَى اللهِ، هَلِّلُويَا.", "b21": "لِتَتَرَدَّدِ التَّسَابِيحُ\nمَعَ التَّصْفِيقِ الْبَهِيجِ،\nيَا صِهْيَوْنُ مَعَ الْمُؤْمِنِينَ:\nظَهَرَ الَّذِي وَلَدَتْهُ مَرْيَمُ.\n\n> افْرَحُوا، افْرَحُوا، وُلِدَ الْمَسِيحُ الْيَوْمَ!\n> افْرَحُوا، افْرَحُوا، مِنْ مَرْيَمَ الْعَذْرَاءِ.\n\nرَنِّمُوا أَيُّهَا الْأَطْفَالُ،\nسَبِّحُوا الْمَلِكَ الْمَوْلُودَ،\nقُولُوا بِصَوْتٍ تَقِيٍّ:\nظَهَرَ الَّذِي وَلَدَتْهُ مَرْيَمُ.\n\nسَبِّحِي الرَّبَّ يَا صِهْيَوْنُ،\nمُخَلِّصَ الْبَشَرِ،\nغَاسِلَ الْخَطَايَا:\nظَهَرَ الَّذِي وَلَدَتْهُ مَرْيَمُ.", "b22": "> اقْطُرِي أَيَّتُهَا السَّمَاوَاتُ مِنْ فَوْقُ،\n> وَلْتُمْطِرِ الْغُيُومُ الْبَارَّ.\n\nلَا تَسْخَطْ يَا رَبُّ،\nوَلَا تَذْكُرِ الْإِثْمَ إِلَى الْأَبَدِ:\nهَا مَدِينَةُ قُدْسِكَ صَارَتْ بَرِّيَّةً،\nصِهْيَوْنُ صَارَتْ بَرِّيَّةً،\nأُورُشَلِيمُ مُوحِشَةٌ،\nبَيْتُ قُدْسِكَ وَمَجْدِكَ\nحَيْثُ سَبَّحَكَ آبَاؤُنَا.\n\nقَدْ خَطِئْنَا،\nوَصِرْنَا كُلُّنَا كَنَجِسٍ،\nوَذَبُلْنَا كَوَرَقَةٍ،\nوَآثَامُنَا\nكَرِيحٍ تَحْمِلُنَا:\nحَجَبْتَ وَجْهَكَ عَنَّا،\nوَأَذَبْتَنَا بِسَبَبِ آثَامِنَا.\n\nاُنْظُرْ يَا رَبُّ مَذَلَّةَ شَعْبِكَ،\nوَأَرْسِلْ مَنْ أَنْتَ مُزْمِعٌ أَنْ تُرْسِلَهُ؛\nأَرْسِلِ الْحَمَلَ سُلْطَانَ الْأَرْضِ\nمِنْ صَخْرَةِ الْبَرِّيَّةِ إِلَى جَبَلِ ابْنَةِ صِهْيَوْنَ،\nلِيَرْفَعَ هُوَ نِيرَ سَبْيِنَا.\n\nتَعَزَّوْا، تَعَزَّوْا يَا شَعْبِي،\nسَرِيعًا يَأْتِي خَلَاصُكَ؛\nلِمَاذَا تَذُوبُ حُزْنًا،\nوَقَدْ تَجَدَّدَ عَلَيْكَ الْأَلَمُ؟\nسَأُخَلِّصُكَ، لَا تَخَفْ؛\nفَأَنَا الرَّبُّ إِلَهُكَ،\nقُدُّوسُ إِسْرَائِيلَ، فَادِيكَ.", "b23": "السَّلَامُ عَلَيْكِ أَيَّتُهَا الْمَلِكَةُ، أُمَّ الرَّحْمَةِ،\nيَا حَيَاتَنَا وَعُذُوبَتَنَا وَرَجَاءَنَا، السَّلَامُ عَلَيْكِ.\nإِلَيْكِ نَصْرُخُ نَحْنُ الْمَنْفِيِّينَ، أَبْنَاءَ حَوَّاءَ،\nإِلَيْكِ نَتَنَهَّدُ نَائِحِينَ بَاكِينَ\nفِي وَادِي الدُّمُوعِ هَذَا.\nفَيَا شَفِيعَتَنَا،\nأَدِيرِي نَحْوَنَا\nعَيْنَيْكِ الرَّحِيمَتَيْنِ.\nوَيَسُوعَ، ثَمَرَةَ بَطْنِكِ الْمُبَارَكَةَ،\nأَرِينَا إِيَّاهُ بَعْدَ هَذَا الْمَنْفَى.\nيَا رَؤُوفَةُ، يَا حَنُونُ،\nيَا مَرْيَمُ الْعَذْرَاءُ الْحُلْوَةُ.", "b24": "> حَيْثُ الْمَحَبَّةُ وَالْحُبُّ، هُنَاكَ اللهُ.\n\nجَمَعَتْنَا مَحَبَّةُ الْمَسِيحِ وَاحِدًا:\nفَلْنَبْتَهِجْ وَلْنَفْرَحْ بِهِ.\nلِنَخَفِ اللهَ الْحَيَّ وَلْنُحِبَّهُ،\nوَلْيُحِبَّ بَعْضُنَا بَعْضًا مِنْ قَلْبٍ صَادِقٍ.\n\nفَإِذْ نَجْتَمِعُ مَعًا وَاحِدًا،\nلِنَحْذَرْ أَنْ نَنْقَسِمَ فِي الْفِكْرِ.\nلِتَتَوَقَّفِ الْخُصُومَاتُ الشِّرِّيرَةُ وَالنِّزَاعَاتُ،\nوَلْيَكُنْ فِي وَسَطِنَا الْمَسِيحُ الْإِلَهُ.\n\nوَمَعَ الطُّوبَاوِيِّينَ أَيْضًا لِنَرَ\nوَجْهَكَ فِي الْمَجْدِ، أَيُّهَا الْمَسِيحُ الْإِلَهُ:\nفَرَحًا عَظِيمًا لَا يُقَاسُ وَصَالِحًا،\nإِلَى دُهُورٍ لَا تَنْتَهِي. آمِينَ.", "b32": "كَمَنْجَتِي تُرِيدُ أَنْ تَعْزِفَ لَحْنًا جَمِيلًا\nعَنِ الْجَمِيلَةِ الَّتِي لَهَا أَجْمَلُ اسْمٍ فَوْقَ الْجَمِيعِ،\nالَّتِي فِيهَا أَرَادَ اللهُ قَدِيمًا أَنْ يَصِيرَ إِنْسَانًا،\nوَلَهَا يُرَنِّمُ فِي الْفِرْدَوْسِ\nالْمَلَائِكَةُ وَرُؤَسَاءُ الْمَلَائِكَةِ بِصَوْتٍ عَالٍ.\n\nيَا بَابَ السَّمَاءِ، يَا جِسْرَ الْفِرْدَوْسِ وَمَعْبَرَهُ،\nيَا يَنْبُوعَ الْعَسَلِ، يَا بِرْكَةَ الْعُذُوبَةِ وَمَنْبَعَهَا؛\nاحْمِينَا مِنَ الْجَحِيمِ الْعَمِيقِ جِدًّا،\nفَمَنْ يَشُكُّ فِيهِ قَلِيلُ الْعَقْلِ،\nلِأَنَّ الْجَحِيمَ لَا شَاطِئَ لَهُ وَلَا قَاعَ!\n\nيَا سَيِّدَتِي الْعَذْبَةَ، بِنِيَّةٍ صَادِقَةٍ جِدًّا\nأَضَعُ جَسَدِي وَنَفْسِي فِي حِمَايَتِكِ؛\nصَلِّي بِلَا تَأْخِيرٍ إِلَى ابْنِكِ الْعَذْبِ\nأَنْ يَجْعَلَنَا نَحْيَا جَمِيعًا\nفِي أَرْضِ الْأَحْيَاءِ. (آمِينَ).", "b25": "> يَا نُورًا عَلِيًّا ذَا بَهَاءٍ عَظِيمٍ،\n> فِيكِ، يَا حُبَّنَا الْعَذْبَ، نَجِدُ عَزَاءَنَا.\n\nالسَّلَامُ عَلَيْكِ أَيَّتُهَا الْمَلِكَةُ، أَيَّتُهَا الْعَذْرَاءُ الْمُحِبَّةُ،\nيَا نَجْمَةَ الْبَحْرِ الَّتِي لَا تَخْتَفِي،\nيَا نُورًا إِلَهِيًّا، يَا فَضِيلَةً مَمْلُوءَةً نِعْمَةً،\nيَا جَمَالًا بَهِيًّا: أَنْتِ صُورَةُ اللهِ!\n\nيَا هَيْكَلًا مُقَدَّسًا، يَا إِنَاءً مُزَيَّنًا،\nيَا مَنْ بَشَّرَهَا الْقِدِّيسُ جِبْرَائِيلُ،\nتَجَسَّدَ الْمَسِيحُ فِي حَشَاكِ الْجَمِيلِ،\nثَمَرًا جَدِيدًا بِبَهْجَةٍ عَظِيمَةٍ.\n\nيَا ضِفَّةً نَضِرَةً مُزَيَّنَةً بِالزُّهُورِ،\nأَنْتِ الْفَلَكُ الَّذِي فِيهِ كُلُّ الْأَلْوَانِ:\nقُودِي جَمَاعَتَنَا نَحْنُ الْخَطَأَةَ،\nحَتَّى نَتَذَوَّقَ صَلَاحَكِ.", "b26": "> السَّلَامُ عَلَيْكِ أَيَّتُهَا السَّيِّدَةُ الْكُلِّيَّةُ الْقَدَاسَةِ،\n> أَيَّتُهَا الْمَلِكَةُ الْكُلِّيَّةُ الْقُدْرَةِ.\n\nالْقُوَّةُ السَّمَاوِيَّةُ\nمَعَ النِّعْمَةِ الْعُلْوِيَّةِ\nنَزَلَتْ فِيكِ أَيَّتُهَا الْعَذْرَاءُ الْبَتُولُ\nبِكُلِّ لُطْفٍ.\n\nفِدَاؤُنَا\nاتَّخَذَ جَسَدًا\nفِي حَبَلٍ مُقَدَّسٍ\nمِنْكِ أَيَّتُهَا الْأُمُّ الْكُلِّيَّةُ الطَّهَارَةِ.\n\nوَبِفَضْلِ نَقَائِكِ أَيْضًا\nجَاءَ إِلَى عَالَمِ الْأَلَمِ\nشَمْسُ الْمَحَبَّةِ،\nيَا مَنْ أَنْتِ فِي السَّمَاوَاتِ الْكُلِّيَّةُ الطُّوبَى.", "b27": "> مِنَ السَّمَاءِ جَاءَ رَسُولٌ جَدِيدٌ،\n> وَكَانَ الْمَلَاكَ جِبْرَائِيلَ.\n\nإِلَى مَدِينَةٍ فِي الْجَلِيلِ\nتُدْعَى النَّاصِرَةَ،\nهُنَاكَ حَيْثُ وُلِدَتِ الْعَذْرَاءُ وَأَقَامَتْ،\nوَكَانَتْ مَخْطُوبَةً لِيُوسُفَ.\n\nأُرْسِلَ الْمَلَاكُ مِنَ اللهِ،\nأَحْسَنَ الْبَدْءَ وَأَحْسَنَ الْخِتَامَ:\nبِحِكْمَةٍ، بِلَا شَرٍّ،\nأَعْلَنَ رِسَالَتَهُ:\n\n«السَّلَامُ عَلَيْكِ يَا مَرْيَمُ، يَا مُمْتَلِئَةً نِعْمَةً،\nلِيَحْفَظْكِ اللهُ، يَا نَجْمَةً صَافِيَةً!\nاللهُ مَعَكِ، وَهُوَ يَقُودُكِ\nإِلَى الْفِرْدَوْسِ الْجَمِيلِ».", "b28": "> هَبْ لِي يَا اللهُ عَزَاءً وَفَرَحًا،\n> وَمَحَبَّةً كَامِلَةً وَحُبًّا.\n\nهَبْ لِي يَا اللهُ عَزَاءً وَحَرَارَةً،\nوَبِالْمَحَبَّةِ اشْدُدْ قَلْبِي؛\n\nحَتَّى لَا يُمْنَعَ عَنِّي حُبُّكَ،\nوَلَا يَقْوَى فِيَّ أَيُّ سُخْطٍ شِرِّيرٍ.\n\nهَبْ لِي بَهْجَةً وَسُرُورًا وَانْشِرَاحًا،\nوَفِي قَلْبِي هَبْ دُمُوعَ عَزَاءٍ؛\n\nلِأَتَنَهَّدَ وَأُرَنِّمَ وَأَكُونَ حَكِيمًا،\nحَتَّى لَا أَفْقِدَ حُبَّكَ الصَّافِيَ.", "b29": "> عَلَى مَوْتِ الْمَسِيحِ الْقَاسِي\n> لِيَبْكِ كُلُّ إِنْسَانٍ بِمَرَارَةٍ.\n\nحِينَ قَبَضَ الْيَهُودُ عَلَى الْمَسِيحِ،\nأَحَاطُوا بِهِ مِنْ كُلِّ جَانِبٍ،\nوَقَيَّدُوا يَدَيْهِ بِشِدَّةٍ\nكَلِصٍّ، بِخِسَّةٍ.\n\nثَلَاثُونَ دِرْهَمًا كَانَتِ الصَّفْقَةُ\nالَّتِي عَقَدَهَا يَهُوذَا وَقَبَضَهَا:\nخَيْرٌ لَهُ لَوْ لَمْ يُولَدْ\nمِنْ أَنْ يَخْطَأَ هَذِهِ الْخَطِيئَةَ الْقَاسِيَةَ.\n\nعِنْدَ الْعَمُودِ جُرِّدَ مِنْ ثِيَابِهِ،\nوَجُلِدَ فِي جَسَدِهِ كُلِّهِ،\nوَتَخَضَّبَ بِالدَّمِ مِنْ كُلِّ جَانِبٍ\nكَأَنَّهُ مُذْنِبٌ، يَا لَلْمَرَارَةِ!\n\nصَرَخُوا جَمِيعًا بِصَوْتٍ عَالٍ:\n«لِيَمُتِ الْمُخَادِعُ، لِيَمُتْ سَرِيعًا؛\nلِيُعَلَّقْ عَلَى الصَّلِيبِ حَالًا،\nلِئَلَّا يُثِيرَ الشَّعْبَ كُلَّهُ».\n\nتَرَكَهُ رِفَاقُهُ،\nهَرَبُوا جَمِيعًا وَتَرَكُوهُ،\nوَهُوَ يَحْتَمِلُ عَذَابًا شَدِيدًا مُرًّا\nفِي جَسَدِهِ مِنْ أَجْلِ النَّاسِ.\n\nكَانَتِ الْقِدِّيسَةُ مَرْيَمُ حَزِينَةً جِدًّا\nحِينَ رَأَتِ ابْنَهَا عَلَى الصَّلِيبِ؛\nكَانَتْ تَبْكِي بِأَلَمٍ شَدِيدٍ\nقَائِلَةً: «يَا لِي مِنْ حَزِينَةٍ مُتْعَبَةٍ مُتَأَلِّمَةٍ!»", "b30": "> الْمَجْدُ فِي السَّمَاءِ وَالسَّلَامُ عَلَى الْأَرْضِ:\n> وُلِدَ مُخَلِّصُنَا!\n\nوُلِدَ الْمَسِيحُ الْمَجِيدُ،\nاللهُ الْعَلِيُّ الْعَجِيبُ،\nصَارَ إِنْسَانًا مُشْتَهًى،\nالْخَالِقُ الْحَنُونُ.\n\nلِيُرَنَّمِ السَّلَامُ عَلَى الْأَرْضِ،\nوَالْمَجْدُ الْمُشْتَهَى فِي السَّمَاءِ:\nفَالْعَذْرَاءُ الْمُكَرَّسَةُ\nقَدْ وَلَدَتِ الْمُخَلِّصَ.", "b31": "> لِيُرَنَّمْ مَدِيحٌ جَدِيدٌ\n> لِلسَّيِّدَةِ الْعَلِيَّةِ الْمُكَلَّلَةِ.\n\nأَيَّتُهَا الْعَذْرَاءُ الْفَتَاةُ النَّضِرَةُ،\nيَا أَوَّلَ زَهْرَةٍ، يَا وَرْدَةً جَدِيدَةً،\nالْعَالَمُ كُلُّهُ يَسْتَغِيثُ بِكِ؛\nفِي سَاعَةٍ مُبَارَكَةٍ وُلِدْتِ.\n\nأَنْتِ يَنْبُوعُ مَاءٍ يَتَفَجَّرُ،\nأُمُّ اللهِ الْحَيِّ؛\nأَنْتِ نُورُ الشُّعُوبِ،\nالْمُرْتَفِعَةُ فَوْقَ الْمَلَائِكَةِ.\n\nأَنْتِ الْغُصْنُ، أَنْتِ الزَّهْرَةُ،\nأَنْتِ الْقَمَرُ السَّاطِعُ؛\nلَنَا رَغْبَةٌ وَقَلْبٌ\nأَنْ نَأْتِيَ إِلَيْكِ أَيَّتُهَا الْبَهِيَّةُ.\n\nأَنْتِ تَابُوتُ التَّوَاضُعِ،\nإِنَاءُ كُلِّ قَدَاسَةٍ:\nفِيكِ حَلَّ اللَّاهُوتُ،\nوَمِنَ الْمَلَاكِ تَلَقَّيْتِ السَّلَامَ.\n\nأَتَوَسَّلُ إِلَيْكِ يَا شَفِيعَتِي\nأَنْ تَضَعِينَا عَلَى الطَّرِيقِ الصَّالِحِ:\nلِتَكُنْ جَمَاعَتُنَا هَذِهِ\nفِي رِعَايَتِكِ دَائِمًا.", "b33": "> لِيَسْمَعْ كُلُّ وَاحِدٍ بِخُشُوعٍ\n> الْبُكَاءَ الَّذِي بَكَتْهُ مَرْيَمُ الْمُتَأَلِّمَةُ\n> عَلَى ابْنِهَا الرَّقِيقِ جِدًّا.\n\nيَا يَسُوعُ الْمَسِيحُ، يَا ابْنِيَ الْجَمِيلُ،\nيَا يَسُوعُ الْجَمِيلُ، الْأَبْيَضُ وَالْقُرْمُزِيُّ،\nيَا سَنَدَ الْأُمِّ الْحَزِينَةِ،\nقَدْ سُمِّرْتَ الْآنَ عَلَى الصَّلِيبِ.", "b34": "> لِيُسَبِّحْ كُلُّ إِنْسَانٍ بِصَوْتٍ عَالٍ\n> الصَّلِيبَ الْحَقِيقِيَّ.\n\nمَا أَجْدَرَهُ بِالتَّسْبِيحِ:\nلَا يَقْدِرُ الْقَلْبُ أَنْ يَتَصَوَّرَهُ،\nوَلَا يَقْدِرُ اللِّسَانُ أَنْ يَصِفَهُ،\nالصَّلِيبُ الْمُقَدَّسُ الْحَقِيقِيُّ.\n\nهَذِهِ الْخَشَبَةُ الثَّمِينَةُ\nهِيَ لَنَا عَلَامَةُ قُوَّةٍ،\nبِهَا خُذِلَ الْعَدُوُّ\nبِقُوَّةِ الصَّلِيبِ.", "b35": "> يُضَيِّعُ وَقْتَهُ كَثِيرًا مَنْ لَا يُحِبُّكَ حَقًّا،\n> يَا يَسُوعُ، يَا حُبًّا عَذْبًا فَوْقَ كُلِّ حُبٍّ.\n\nيَا حُبُّ، مَنْ يُحِبُّكَ لَا يَبْقَى خَامِلًا،\nفَمَا أَعْذَبَ أَنْ يَتَذَوَّقَكَ!\nبَلْ يَعِيشُ مُشْتَاقًا كُلَّ حِينٍ\nكَيْفَ يُحِبُّكَ أَكْثَرَ وَأَشَدَّ؛\nفَالْقَلْبُ مِنْ أَجْلِكَ فَرِحٌ جِدًّا:\nوَمَنْ لَمْ يَخْتَبِرْ ذَلِكَ لَا يَعْرِفُ أَنْ يَقُولَ\nكَمْ هُوَ عَذْبٌ تَذَوُّقُ طَعْمِكَ.\n\nطَعْمٌ لَا شَبِيهَ لَهُ،\nوَيْحِي! قَلْبِي يَتَذَوَّقُكَ قَلِيلًا؛\nلَا شَيْءَ آخَرَ يُعَزِّينِي،\nوَلَوْ مَلَكْتُ الْعَالَمَ كُلَّهُ وَلَمْ أَمْلِكْكَ.\nيَا يَسُوعُ، يَا حُبًّا عَذْبًا، فِيكَ رَجَائِي،\nاسْنُدْ قَلْبِي لِئَلَّا يَسْقُطَ بَعِيدًا عَنْكَ،\nبَلْ لِتَشُدَّهُ عُذُوبَتُكَ إِلَيْكَ أَكْثَرَ فَأَكْثَرَ.\n\nيَا عُذُوبَةً تَنْزِعُ الْقُوَّةَ مِنْ كُلِّ مَرَارَةٍ\nوَتُحَوِّلُ كُلَّ شَيْءٍ إِلَى حَلَاوَتِكَ؛\nهَذَا يَعْرِفُهُ الْقِدِّيسُونَ الَّذِينَ اخْتَبَرُوهُ،\nفَجَعَلُوا الْمَوْتَ عَذْبًا وَسَطَ الْمَرَارَةِ،\nإِذْ عَزَّاهُمْ دَوَاؤُكَ الْعَذْبُ\nيَا يَسُوعُ، فَغَلَبُوا كُلَّ قَسْوَةٍ،\nلِأَنَّكَ كُنْتَ عَذْبًا جِدًّا فِي قُلُوبِهِمْ.\n\nالْقَلْبُ الَّذِي لَا يَشْعُرُ بِكَ حَقِيقٌ أَنْ يَحْزَنَ،\nيَا يَسُوعُ، يَا فَرَحَ النَّاسِ وَبَهْجَتَهُمْ؛\nلَا عَزَاءَ بِدُونِ الْمَسِيحِ؛\nوَيْحِي أَنَا الْبَائِسَ لِأَنِّي لَا أُحِبُّكَ بِحَرَارَةٍ!\nمَنْ رَبِحَ كُلَّ شَيْءٍ آخَرَ\nوَلَمْ يَمْلِكْكَ، فَقَدْ خَسِرَ كُلَّ شَيْءٍ،\nوَبِدُونِكَ يَبْقَى فِي الْمَرَارَةِ.\n\nخِدْمَتُكَ يَا يَسُوعُ، يَا حَبِيبِي،\nأَعْذَبُ مِنْ كُلِّ لَذَّةٍ أُخْرَى؛\nلَا يَعْرِفُ مَنْ يَبْقَى خَامِلًا عَنْكَ\nكَمْ هُوَ عَذْبٌ أَنْ نُحِبَّكَ بِحَنَانٍ:\nلَا يَجِدُ الْقَلْبُ رَاحَةً أُخْرَى أَبَدًا\nإِلَّا فِيكَ يَا يَسُوعُ، يَا حُبًّا كَامِلًا،\nيَا مُعَزِّيَ عَبِيدِكَ.", "b36": "أَقُولُ دَائِمًا، وَلَا أَسْكُتُ عَنْهُ،\nمُسَبِّحًا إِيَّاهُ بِالتَّرْنِيمِ:\n\n> يَسُوعُ، يَسُوعُ،\n> يَسُوعُ الْعَذْبُ فِي الْحُبِّ.\n\nأَنْتَظِرُهُ دَائِمًا، وَقَلْبِي يَبْتَهِجُ،\nفَهُوَ يُفَرِّحُنِي.\n\nلَا أَمْنَعُ نَفْسِي عَنْ سَنَدِي الْعَظِيمِ،\nوَأُرِيدُ أَنْ أَدْعُوَهُ دَائِمًا.\n\nأُرِيدُ أَنْ تُكَلِّمَنِي حَيَاتِيَ الْعَذْبَةُ\nالَّتِي سَتُخَلِّصُنِي.\n\nأَيُّهَا الْحُبُّ الْحَبِيبُ، يَا حَيَاةَ قَلْبِي،\nهَبْ لِي الْآنَ أَنْ أَجِدَكَ!\n\nانْتَشِلْنِي إِلَيْكَ مِنْ هَذَا الْعَذَابِ الْعَظِيمِ،\nفَأَنَا أَحْيَا فِي الْأَلَمِ!\n\nلَا أُرِيدُ أَنْ أَفْقِدَكَ بِسَبَبِ سُقُوطِي\nفِي تَجْرِبَةٍ كَاذِبَةٍ.\n\nأَعِيشُ فِي خَوْفٍ عَلَيْكَ يَا عُذُوبَتِي،\nفَمَاذَا أَصْنَعُ؟\n\nأَنْتَ هَوَائِي، وَأَنَا خَلِيقَتُكَ،\nفَلَا تَتْرُكْنِي!\n\nلَنْ يُصِيبَنِي فَقْرٌ وَلَا نَقْصٌ،\nوَأُرِيدُ أَنْ أَبْقَى مَعَكَ!", "b37": "> تَعَالَوْا نُسَبِّحْ،\n> وَبِالْحُبِّ نُرَنِّمْ\n> لِمَرْيَمَ الْعَذْرَاءِ الْمُحِبَّةِ!\n\nيَا مَرْيَمُ الْمَجِيدَةُ الطُّوبَاوِيَّةُ،\nلِتُسَبَّحِي دَائِمًا كَثِيرًا:\nنُصَلِّي أَنْ تَكُونِي شَفِيعَتَنَا\nلَدَى ابْنِكِ، أَيَّتُهَا الْعَذْرَاءُ التَّقِيَّةُ!\n\nيَا مَنْ تَدْعُوكِ الشُّعُوبُ كُلُّهَا،\nلَكِ يُرَنَّمُ هَذَا الْمَدِيحُ:\nأَنْتِ أُمُّنَا الْمُكَرَّمَةُ،\nأَكْثَرُ الْأُمَّهَاتِ أَمَانَةً عَلَى الْإِطْلَاقِ.", "b38": "> يَا مَنْ تُحِبُّونَ الْخَالِقَ،\n> تَأَمَّلُوا فِي أَلَمِي.\n\nفَأَنَا مَرْيَمُ ذَاتُ الْقَلْبِ الْحَزِينِ،\nالَّتِي كَانَ لَهَا الْمَسِيحُ ابْنًا:\nرَجَائِي وَكَنْزِيَ الْعَذْبُ\nصُلِبَ مِنْ أَجْلِ الْخَطَأَةِ.\n\nيَا رَأْسًا جَمِيلًا رَقِيقًا،\nكَيْفَ أَرَاكَ مُنْحَنِيًا!\nشَعْرُكَ مَضْفُورٌ بِالدَّمِ،\nيَسِيلُ حَتَّى اللِّحْيَةِ.\n\nيَا فَمًا جَمِيلًا رَقِيقًا،\nكَيْفَ أَرَاكَ مُطْبَقًا!\nسُقِيتَ مَرَارَةً وَخَلًّا،\nوَأَنَا حَزِينَةٌ مُتَأَلِّمَةٌ فِي قَلْبِي."};
const BUILTIN = [{"id": "b1", "order": 1, "title": "Adeste fideles", "title_ar": "هلمّوا يا مؤمنين", "sec": "lat", "lang": "la", "body": "Adeste fideles,\nlaeti triumphantes:\nvenite, venite in Bethlehem.\nNatum videte\nregem angelorum:\n\n> Venite adoremus (3 v.)\n> Dominum.\n\nEn grege relicto,\nhumiles ad cunas\nvocati pastores approperant.\nEt nos ovanti\ngradu festinemus.\n\nAeterni Parentis\nsplendorem aeternum\nvelatum sub carne videbimus.\nDeum infantem,\npannis involutum."}, {"id": "b2", "order": 2, "title": "Adoro te devote", "title_ar": "أسجد لك بخشوع", "sec": "lat", "lang": "la", "body": "Adoro te devote, latens Deitas,\nquae sub his figuris vere latitas:\ntibi se cor meum totum subjicit,\nquia te contemplans totum deficit.\n\nVisus, tactus, gustus in te fallitur,\nsed auditu solo tuto creditur:\ncredo quidquid dixit Dei Filius:\nnihil hoc verbo veritatis verius.\n\nIn cruce latebat sola Deitas,\nat hic latet simul et humanitas:\nambo tamen credens atque confitens\npeto quod petivit latro paenitens.\n\nPlagas, sicut Thomas, non intueor:\nDeum tamen meum te confiteor:\nfac me tibi semper magis credere,\nin te spem habere, te diligere.\n\nO memoriale mortis Domini,\npanis vivus vitam praestans homini,\npraesta meae menti de te vivere,\net te illi semper dulce sapere.\n\nPie pellicane Jesu Domine,\nme immundum munda tuo sanguine,\ncujus una stilla salvum facere\ntotum mundum quit ab omni scelere.\n\nJesu, quem velatum nunc aspicio,\noro fiat illud quod tam sitio:\nut te revelata cernens facie,\nvisu sim beatus tuae gloriae. Amen."}, {"id": "b3", "order": 3, "title": "Attende Domine", "title_ar": "انظر يا رب", "sec": "lat", "lang": "la", "body": "> Attende Domine, et miserere\n> quia peccavimus tibi.\n\nAd te Rex summe, omnium Redemptor\noculos nostros sublevamus flentes:\nexaudi, Christe, supplicantum preces.\n\nDextera Patris, lapis angularis,\nvia salutis, janua coelestis,\nablue nostri maculas delicti.\n\nRogamus, Deus, tuam majestatem:\nauribus sacris gemitus exaudi:\ncrimina nostra placidus indulge.\n\nTibi fatemur crimina admissa:\ncontrito corde pandimus occulta:\ntua, Redemptor, pietas ignoscat.\n\nInnocens captus, nec repugnans ductus,\ntestibus falsis pro impiis damnatus:\nquos redemisti tu conserva, Christe."}, {"id": "b4", "order": 4, "title": "Ave maris stella", "title_ar": "السلام يا نجمة البحر", "sec": "lat", "lang": "la", "body": "Ave, maris stella,\nDei mater alma\natque semper virgo,\nfelix coeli porta!\n\nSumens illud Ave\nGabrielis ab ore,\nfunda nos in pace,\nmutans Evae nomen.\n\nSolve vincla reis,\nprofer lumen caecis,\nmala nostra pelle,\nbona cuncta posce.\n\nMonstra te esse Matrem,\nsumat per te precem\nqui, pro nobis natus,\ntulit esse tuus.\n\nVirgo singularis,\ninter omnes mitis,\nnos, culpis solutos,\nmites fac et castos.\n\nVitam praesta puram,\niter para tutum,\nut, videntes Jesum,\nsemper collaetemur.\n\nSit laus Deo Patri,\nsummo Christo decus,\nSpiritui Sancto,\ntribus honor unus.\nAmen."}, {"id": "b5", "order": 5, "title": "Christe cunctorum", "title_ar": "أيها المسيح، سيّد الجميع", "sec": "lat", "lang": "la", "body": "Christe, cunctorum dominator alme\nmente Supremi generate Patris,\nsupplicum voces pariterque carmen\ncerne benignus.\n\nCerne, quod templi, Deus, ad decorem\nplebs tua supplex resonet per aedem,\nannuo cuius redeunt colenda\ntempore festa.\n\nHaec domus surgit tibi dedicata\nrite, ubi sumit populus sacratum\nCorpus ex aris, bibit et beati\nSanguinis haustum.\n\nHic sacrosancti latices nocentum\ndiluunt culpas, perimuntque noxas:\nchrismate invictum genus et creatur\nchristicolarum.\n\nHic salus aegris, medicina fessis,\nlumen et caecis datur: hic reatu,\nChriste, nos solvis; timor atque moeror\npellitur omnis.\n\nDaemonis saevi perit hic rapina:\npervicax monstrum pavet, et retentos\ndeserens artus, fugit in remotas\nocyus auras.\n\nHic locus Regis vocitatur aula\nnempe coelestis, rutilansque coeli\nporta, quae vitae patriam petentes\naccipit omnes.\n\nTurbo quem nullus quatit, aut vagantes\ndiruunt venti; penetrantque nimbi,\nhanc domum tetris piceus tenebris\nTartarus horret.\n\nErgo te votis petimus sereno\nannuas vultu; famulos gubernes,\nqui tui summo celebrant amore\ngaudia templi.\n\nNulla nos vitae cruciet procella:\nsint dies laeti placidaeque noctes,\nnullus ex nobis, pereunte mundo,\nsentiat ignem.\n\nHic dies, in quo tibi consecratum\nconspicis templum, tribuat perenne\ngaudium nobis, vigeatque longo\ntemporis usu.\n\nLaus poli summum resonet Parentem,\nlaus Patris Natum pariterque Sanctum\nSpiritum dulci moduletur hymno\nomne per aevum. Amen."}, {"id": "b6", "order": 6, "title": "Crux fidelis", "title_ar": "أيها الصليب الأمين", "sec": "lat", "lang": "la", "body": "> Crux fidelis, inter omnes\n> arbor una nobilis:\n> nulla silva talem profert,\n> fronde, flore, germine.\n> Dulce lignum, dulces clavos,\n> dulce pondus sustinet.\n\nPange, lingua, gloriosi\nlauream certaminis,\net super Crucis trophaeo\ndic triumphum nobilem:\nqualiter Redemptor orbis\nimmolatus vicerit.\n\nFelle potus ecce languet:\nspina, clavi, lancea\nmite corpus perforarunt,\nunda manat, et cruor:\nterra, pontus, astra, mundus,\nquo lavantur flumine!\n\nFlecte ramos, arbor alta,\ntensa laxa viscera,\net rigor lentescat ille,\nquem dedit nativitas:\net superni membra Regis\ntende miti stipite.\n\nSola digna tu fuisti\nferre mundi victimam:\natque portum praeparare\narca mundo naufrago:\nquam sacer cruor perunxit\nfusus Agni corpore.\n\nSempiterna sit beatae\nTrinitati gloria:\naequa Patri Filioque;\npar decus Paraclito:\nUnius Trinique nomen\nlaudet universitas."}, {"id": "b7", "order": 7, "title": "Dulcis Christe", "title_ar": "أيها المسيح العذب", "sec": "lat", "lang": "la", "body": "Dulcis Christe, o bone Deus,\no amor meus, o vita mea,\no salus mea, o gloria mea.\nTu es Creator, tu es Salvator mundi.\nTe volo, te quaero,\nte adoro, o dulcis amor,\nte adoro, o care Jesu."}, {"id": "b8", "order": 8, "title": "Exaudi Domine", "title_ar": "استجب يا رب", "sec": "lat", "lang": "la", "body": "Exaudi Domine vocem meam\nqua clamavi ad te,\nmiserere mei et exaudi me.\nTibi dixit cor meum, exquisivit te facies mea.\nFaciem tuam, Domine, requiram.\nNe avertas faciem tuam a me.\nNe declines in ira a servo tuo."}, {"id": "b9", "order": 9, "title": "Gaudete", "title_ar": "افرحوا", "sec": "lat", "lang": "la", "body": "> Gaudete, gaudete! Christus est natus\n> ex Maria virgine: gaudete!\n\nTempus adest gratiae hoc quod optabamus,\ncarmina laetitiae devote reddamus.\n\nDeus homo factus est natura mirante,\nmundus renovatus est a Christo regnante.\n\nErgo nostra contio psallat iam in lustro:\nbenedicat Domino salus regi nostro."}, {"id": "b10", "order": 10, "title": "In cordis jubilo", "title_ar": "بابتهاج القلب", "sec": "lat", "lang": "la", "body": "Puer natus in Bethlehem, alleluia:\nunde gaudet Jerusalem, alleluia, alleluia.\n\n> In cordis jubilo,\n> Christum natum adoremus\n> cum novo cantico.\n\nAssumpsit carnem Filius, alleluia,\nDei Patris altissimus, alleluia, alleluia.\n\nPer Gabrielem nuntium, alleluia,\nVirgo concepit Filium, alleluia, alleluia.\n\nTamquam sponsus de thalamo, alleluia,\nprocessit Matris utero, alleluia, alleluia.\n\nHic iacet in praesepio, alleluia:\nqui regnat sine termino, alleluia, alleluia.\n\nEt Angelus pastoribus, alleluia,\nrevelat quod sit Dominus, alleluia, alleluia.\n\nReges de Saba veniunt, alleluia,\naurum, thus, myrrham offerunt, alleluia, alleluia.\n\nIn hoc natali gaudio, alleluia:\nbenedicamus Domino, alleluia, alleluia.\n\nLaudetur sancta Trinitas, alleluia,\nDeo dicamus gratias, alleluia, alleluia."}, {"id": "b11", "order": 11, "title": "Isti sunt agni novelli", "title_ar": "هؤلاء هم الحملان الجدد", "sec": "lat", "lang": "la", "body": "> Isti sunt agni novelli,\n> qui annuntiaverunt, alleluia:\n> modo venerunt ad fontes,\n> repleti sunt claritate, alleluia, alleluia.\n\nO Regina, quam divina\npraeelegit gratia,\ncujus partus sacrosanctus\ninstauravit omnia.\n\nO Maria, Mater pia,\ntuum da subsidium,\nquo vincamus et vivamus\nin terra viventium.\n\nChristianis vitae panis\ndatur in edulium:\ndatur tristi sanguis Christi\ndulce refrigerium.\n\nPrimum quidem nobis fidem\ntuis auge precibus,\net da nobis ut te probis\nimitemur actibus.\n\nSpe labentes firma mentes,\ncaritate robora:\nfac concordes, pelle sordes,\nexcusa facinora.\n\nMater bona, nobis dona\ntuum patrocinium,\nut regnemus et laudemus\ntuum semper Filium."}, {"id": "b12", "order": 12, "title": "Jesu dulcis memoria", "title_ar": "يا يسوع، ما أعذب ذكرك", "sec": "lat", "lang": "la", "body": "Jesu, dulcis memoria,\ndans vera cordis gaudia:\nsed super mel et omnia,\nejus dulcis praesentia.\n\nNil canitur suavius,\nnil auditur jucundius,\nnil cogitatur dulcius,\nquam Jesus Dei Filius.\n\nJesu, spes paenitentibus,\nquam pius es petentibus!\nQuam bonus te quaerentibus!\nSed quid invenientibus?\n\nNec lingua valet dicere,\nnec littera exprimere:\nexpertus potest credere,\nquid sit Jesum diligere.\n\nSis, Jesu, nostrum gaudium,\nqui es futurus praemium:\nsit nostra in te gloria\nper cuncta semper saecula. Amen."}, {"id": "b13", "order": 13, "title": "Jesu tibi vivo", "title_ar": "يا يسوع، لك أحيا", "sec": "lat", "lang": "la", "body": "Jesu tibi vivo;\nJesu tibi morior.\nJesu sive vivo, sive morior\ntuus sum."}, {"id": "b14", "order": 14, "title": "Non nobis", "title_ar": "ليس لنا يا رب", "sec": "lat", "lang": "la", "body": "Non nobis, Domine, Domine,\nnon nobis, Domine,\nsed nomini, sed nomini tuo da gloriam."}, {"id": "b15", "order": 15, "title": "O filii et filiae", "title_ar": "أيها الأبناء والبنات", "sec": "lat", "lang": "la", "body": "> Alleluia, alleluia, alleluia!\n\nO filii et filiae,\nRex coelestis, Rex gloriae\nmorte surrexit hodie, alleluia.\n\nEt mane prima sabbati\nad ostium monumenti\naccesserunt discipuli, alleluia.\n\nEt Maria Magdalena\net Jacobi et Salome\nvenerunt corpus ungere, alleluia.\n\nIn albis sedens Angelus\npraedixit mulieribus:\nin Galilaea est Dominus, alleluia.\n\nIn hoc festo sanctissimo\nsit laus et jubilatio,\nbenedicamus Domino, alleluia.\n\nDe quibus nos humillimas\ndevotas atque debitas\nDeo dicamus gratias, alleluia."}, {"id": "b16", "order": 16, "title": "O spes mea cara", "title_ar": "يا رجائي العزيز", "sec": "lat", "lang": "la", "body": "O spes mea cara, Maria praeclara,\ne valle amara imploro te.\nExaudi precantem, solare clamantem,\nconfirma labantem, et serva me.\n\nPer blanda, per dura, ad non peritura,\no fortis, o pura, duc debilem.\nDum turget procella et suscitat bella,\nad portum, o stella, duc exulem.\n\nPatrona decora, in exitus hora\npro me, Mater, ora tu Filium,\nut inserar gratis, remissis peccatis,\ncatervis beatis coelestium."}, {"id": "b17", "order": 17, "title": "Omni die", "title_ar": "كل يوم", "sec": "lat", "lang": "la", "body": "Omni die, dic Mariae\nmea laudes anima;\neius festa, eius gesta\ncole splendidissima.\n\nPulchra tota, sine nota\ncuiuscumque maculae,\nfac me mundum et iucundum\nte laudare sedule.\n\nUt sim castus et modestus,\ndulcis, blandus, sobrius,\npius, rectus, circumspectus,\nsimultatis nescius.\n\nEruditus et munitus\ndivinis eloquiis,\ntimoratus et ornatus\nsacris exercitiis.\n\nVirgo sancta, cerne quanta\nperferamus jugiter\ntentamenta, et sustenta\nnos ut stemus fortiter.\n\nEsto tutrix et adiutrix\nchristiani populi;\npacem praesta, ne molesta\nnos perturbent saecula.\nAmen."}, {"id": "b18", "order": 18, "title": "Polorum regina", "title_ar": "يا ملكة السماوات", "sec": "lat", "lang": "la", "body": "> Polorum regina omnium nostra.\n> Stella matutina, dele scelera.\n\nAnte partum virgo Deo gravida\nsemper permansisti inviolata.\nStella matutina, dele scelera.\n\nEt in partu virgo Deo fecunda\nsemper permansisti inviolata.\nStella matutina, dele scelera.\n\nEt post partum virgo mater enixa\nsemper permansisti inviolata.\nStella matutina, dele scelera."}, {"id": "b19", "order": 19, "title": "Prosternimus preces", "title_ar": "نرفع إليك صلواتنا ساجدين", "sec": "lat", "lang": "la", "body": "Prosternimus preces ante faciem tuam,\nparce Christe:\n\n> Et exaudi, populo supplicanti miserere.\n\nQui triumpho Crucis tuae\nsalvasti solus orbem,\ntu cruoris tui\npoena nos libera.\n\nQui moriens mortem damnas,\nresurgens vitam praestas,\nsustines pro nobis\npoenam indebitam.\n\nPassionis tuae dies\ncelebremus indemnes:\nut per hoc dulcedo\ntua nos foveat.\n\nPro quibus es passus crucem,\nnon permittas perire:\nsed per crucem duc\nad vitam perpetuam."}, {"id": "b20", "order": 20, "title": "Regina coeli", "title_ar": "افرحي يا ملكة السماء", "sec": "lat", "lang": "la", "body": "Regina coeli, laetare, alleluia.\nQuia quem meruisti portare, alleluia.\nResurrexit, sicut dixit, alleluia.\nOra pro nobis Deum, alleluia."}, {"id": "b21", "order": 21, "title": "Resonet in laudibus", "title_ar": "لتتردّد التسابيح", "sec": "lat", "lang": "la", "body": "Resonet in laudibus\ncum jucundis plausibus,\nSion cum fidelibus.\nApparuit quem genuit Maria.\n\n> Gaudete, gaudete, Christus natus hodie!\n> Gaudete, gaudete, ex Maria Virgine.\n\nPueri concinite,\nnato regi psallite,\nvoce pia dicite:\nApparuit quem genuit Maria.\n\nSion lauda Dominum,\nsalvatorem hominum,\nlavatorem criminum.\nApparuit quem genuit Maria."}, {"id": "b22", "order": 22, "title": "Rorate coeli desuper", "title_ar": "اقطري أيتها السماوات من فوق", "sec": "lat", "lang": "la", "body": "> Rorate coeli desuper\n> et nubes pluant Iustum.\n\nNe irascaris Domine,\nne ultra memineris iniquitatis:\necce civitas Sancti facta est deserta,\nSion deserta facta est;\nJerusalem desolata est,\ndomus sanctificationis tuae et gloriae tuae,\nubi laudaverunt te patres nostri.\n\nPeccavimus,\net facti sumus tamquam immundus nos,\net cecidimus quasi folium universi,\net iniquitates nostrae\nquasi ventus abstulerunt nos:\nabscondisti faciem tuam a nobis,\net allisisti nos in manu iniquitatis nostrae.\n\nVide Domine afflictionem populi tui\net mitte quem missurus es;\nemitte Agnum dominatorem terrae\nde petra deserti ad montem filiae Sion,\nut auferat ipse jugum captivitatis nostrae.\n\nConsolamini, consolamini, popule meus,\ncito veniet salus tua;\nquare moerore consumeris,\nquia innovavit te dolor?\nSalvabo te, noli timere;\nego enim sum Dominus Deus tuus,\nSanctus Israel, Redemptor tuus."}, {"id": "b23", "order": 23, "title": "Salve Regina", "title_ar": "السلام عليكِ أيتها الملكة", "sec": "lat", "lang": "la", "body": "Salve, Regina, mater misericordiae;\nvita, dulcedo et spes nostra, salve.\nAd te clamamus, exules filii Evae,\nad te suspiramus, gementes et flentes\nin hac lacrimarum valle.\nEia ergo, advocata nostra,\nillos tuos misericordes oculos\nad nos converte.\nEt Jesum, benedictum fructum ventris tui,\nnobis post hoc exilium ostende.\nO clemens, o pia,\no dulcis virgo Maria."}, {"id": "b24", "order": 24, "title": "Ubi caritas et amor", "title_ar": "حيث المحبة والمودة", "sec": "lat", "lang": "la", "body": "> Ubi caritas et amor, Deus ibi est.\n\nCongregavit nos in unum Christi amor:\nexultemus et in ipso jucundemur.\nTimeamus et amemus Deum vivum\net ex corde diligamus nos sincero.\n\nSimul ergo cum in unum congregamur,\nne nos mente dividamur caveamus.\nCessent jurgia maligna, cessent lites\net in medio nostri sit Christus Deus.\n\nSimul quoque cum beatis videamus\nglorianter vultum tuum, Christe Deus:\ngaudium, quod est immensum atque probum,\nsaecula per infinita saeculorum. Amen."}, {"id": "b25", "order": 25, "title": "Altissima luce", "title_ar": "يا نورًا عليًّا", "sec": "laudi", "lang": "it", "body": "> Altissima luce col grande splendore,\n> in voi, dolze amore, aggiam consolanza.\n\nAve, regina, pulzella amorosa,\nstella marina che non stai nascosa,\nluce divina, virtù grazïosa,\nbelleza formosa: de Dio se' semblanza!\n\nTemplo sacrato, ornato vasello,\nannunzïato da san Gabriello,\nCristo è 'ncarnato nel tuo ventre bello,\nfrutto novello cum gran delettanza.\n\nFresca rivera ornata di fiori,\ntu se' la spera di tutti i colori:\nguida la schiera di noi peccatori,\nsì ch'asavori de tua beninanza."}, {"id": "b26", "order": 26, "title": "Ave donna santissima", "title_ar": "السلام أيتها السيدة الكلية القداسة", "sec": "laudi", "lang": "it", "body": "> Ave donna santissima,\n> Regina potentissima.\n\nLa virtù celestïale\ncon la grazia supernale\nen te virgo virginale\ndiscese benignissima.\n\nLa nostra redenzïone\nprese incarnazïone\nin santa concezïone\nda te Madre purïssima.\n\nAltresì per tuo candore\nsovra il mondo del dolore\nvenne il sole dell'amore\nnei cieli beatissima."}, {"id": "b27", "order": 27, "title": "Da ciel venne messo novello", "title_ar": "من السماء جاء رسول جديد", "sec": "laudi", "lang": "it", "body": "> Da ciel venne messo novello,\n> ciò fo l'angel Gabriello.\n\nNella cità di Galilea\nch'è chiamata Nazarèth,\nlà u la Vergin nacque e stette\nsposa era di Joseffe.\n\nL'angelo fo messo da Dio,\nben comenzò e ben finio:\nsaviamente, senza rio,\nannuntiò lo suo libello:\n\n«Ave Maria, gratia plena,\nDio ti salvi, stella serena!\nDio è con teco che ti mena\nenn el paradiso bello»."}, {"id": "b28", "order": 28, "title": "Da mi conforto, Dio", "title_ar": "هبني العزاء يا الله", "sec": "laudi", "lang": "it", "body": "> Da mi conforto, Dio, et allegranza\n> et carità perfecta et amoranza.\n\nDa mi conforto, Dio, et ardore,\na caritade lega lo mio core;\n\nche non mi sia vetato lo tuo amore,\nin me non possa nulla ria indignanza.\n\nDa mi letizia, gaudio e diporto\ne nel mio cor da' pianto di conforto;\n\nche io suspiri e canti e stia sì dotto,\nche io non perda la tua fin amanza."}, {"id": "b29", "order": 29, "title": "De la crudel morte del Cristo", "title_ar": "على موت المسيح القاسي", "sec": "laudi", "lang": "it", "body": "> De la crudel morte del Cristo\n> ogn'om pianga amaramente.\n\nQuando Juderi Cristo pilïaro,\nd'ogne parte lo circumdaro,\nle sue mane strecto legaro,\ncomo ladro villanamente.\n\nTrenta denar fo lo mercato\nche fece Juda e fo pagato:\nmellio li fora non esser nato\nch'aver peccato sì duramente.\n\nA la colonna fu spolïato,\nper tutto 'l corpo flagellato,\nd'ogne parte fo 'nsanguinato\ncommo falso amaramente.\n\nTutti gridaro ad alta voce:\n\"Moia 'l falso, moia veloce;\nsbrigatamente sia posto en croce,\nche non turbi tutta la gente\".\n\nLi soi compagni l'abbandonaro,\ntutti fugiero e lui lassaro;\nstando tormento forte ed amaro\nde lo suo corpo per la gente.\n\nMolt'era trista santa Maria\nquando 'l suo figlio en croce vedea;\ncum gran dolore forte piangea\ndicendo: \"Trista, lassa, dolente\"."}, {"id": "b30", "order": 30, "title": "Gloria 'n cielo", "title_ar": "المجد في السماء", "sec": "laudi", "lang": "it", "body": "> Gloria 'n cielo e pace 'n terra:\n> nat'è 'l nostro Salvatore!\n\nNat'è Cristo glorïoso,\nl'alto Dio maravellioso,\nfatto è hom desideroso\nlo benigno Creatore.\n\nPace 'n terra sia cantata,\ngloria in ciel desiderata,\nla donzella consacrata\nparturit' à 'l Salvatore."}, {"id": "b31", "order": 31, "title": "Laude novella", "title_ar": "مديح جديد", "sec": "laudi", "lang": "it", "body": "> Laude novella sia cantata\n> a l'alta donna encoronata.\n\nFresca vergene donzella,\nprimo fior, rosa novella,\ntutto 'l mondo a te s'appella;\nnella bonor fosti nata.\n\nFonte se' d'acqua surgente,\nmadre de Dio vivente;\ntu se' luce de la gente,\nsovra li angeli esaltata.\n\nTu se' verga, tu se' fiore,\ntu se' luna de splendore;\nvoluntà avemo e core\nde venir a te, ornata.\n\nArcha se' d'umilitade,\nvaso d'ogne sanctitade:\nen te venne deitade;\nd'angel foste salutata.\n\nPregot', avocata mia,\nche ne metti en bona via:\nquesta nostra compania\nsiate sempre commendata."}, {"id": "b32", "order": 32, "title": "Ma vïele", "title_ar": "كمانجتي", "sec": "laudi", "lang": "fr", "body": "Ma vïele, vïeler vieut un biau son\nde la bele qui seur toutes a biau nom.\nEn qui Dieux devenir hom voult jadis,\ndont chantent en Paradis\nanges et archanges a haut ton.\n\nPorte dou ciel, du Paradis planche et ponz,\nsourse de miel, de doucer pecine et fonz;\nd'enfer qui tant est parfonz, nous desfen,\nqui en doute a pauvre sens\ncar enfer n'a rive ni fond!\n\nDouce Dame, par mout vraie entencïon\ncors et ame, met je en ta protecïon;\nprie sanz delatïon ten fil douz\nqu'il nos face vivre touz\nin terra viventium. (Amen)."}, {"id": "b33", "order": 33, "title": "Ognun m'entenda", "title_ar": "ليسمعني كل واحد", "sec": "laudi", "lang": "it", "body": "> Ognun m'entenda divotamente\n> lo pianto che fece Maria dolente\n> del suo figliol tanto dilicato.\n\nO Jesu Christo, bello mio figlio,\no Jesu bello, bianco e vermeglio,\no de la trista Madre el conseglio\nsu ne la croce già conficato."}, {"id": "b34", "order": 34, "title": "Omne homo ad alta voce", "title_ar": "ليسبّح كل إنسان بصوت عالٍ", "sec": "laudi", "lang": "it", "body": "> Omne homo ad alta voce\n> laudi la verace Croce.\n\nQuant'è digna de laudare:\ncore non lo po' pensare,\nlengua ne lo po' contare,\nla verace santa Croce.\n\nQuesto legno prezioso\nè ne segno vertüoso,\nlo nimico ha confuso\nper la forza de la Croce."}, {"id": "b35", "order": 35, "title": "Troppo perde il tempo", "title_ar": "يضيّع وقته كثيرًا", "sec": "laudi", "lang": "it", "body": "> Troppo perde il tempo chi ben non t'ama,\n> dolc'amor Jesù sovr'ogni amore.\n\nAmor, chi t'ama non sta ozioso,\ntanto li par dolze de Te gustare;\nma tutto sor vive desideroso\ncome te possa stretto più amare;\nchè tanto sta per te lo cor gioioso:\nchi non sentisse nol saprie parlare\nquant'è dolz'a gustare lo tuo savore.\n\nSavor cui non si trova simillianza,\no lasso! Lo mio cor poco t'asaggia;\nnull'altra cosa non m'è consolanza,\nse tutto 'l mondo avesse e te non agio.\nO dulz'amor Jesù in cui ho speranza,\ntu regi mio cor che da te non caggia,\nma sempre più restringa 'l tuo dolzore.\n\nDulcior che tolli forza ad ogni amaro\net ogne cosa muti in tua dulcezza;\nquesto sanno li sancti che 'l provaro\nche feciar dolze morte in amarezza,\nma confortolli el dolze latovare\ndi te Jesù che vensar ogni asprezza,\ntanto fosti suave in li lor cori.\n\nCor che te non sente ben pò star tristo,\nJesù, letitia e gaudio de la gente;\nsolazo non pot'essar senza Cristo;\ntaupino ch'eo non t'amo ben fervente!\nChi far potesse totto ogni altro acquisto\ne te non aggia di tutt'è perdente;\ne senza te sirebbe in amarore.\n\nServire a Te, Jesù, mi' amoroso,\npiù soav'è che nul altro delecto;\nnon può saper chi di Te sta otïoso\nquant'è dolze ad amar Te con affecto:\ngemai el cor non trova altro riposo\nsi non se en Te, Jesù, amor perfecto\nche de li tuoi servi se' consolatore."}, {"id": "b36", "order": 36, "title": "Tutor dicendo", "title_ar": "أقولها دائمًا", "sec": "laudi", "lang": "it", "body": "Tutor dicendo, di lui non tacendo,\nlaudandol cum cantare.\n\n> Jesù, Jesù,\n> Jesù dolce ad amare.\n\nSempre l'atendo, col mio cor gaudendo,\nfa mi rallegrare.\n\nNon mi ritegno, da mi' gran sostegno,\ne vogliol pur chiamare.\n\nVo' che mi dica la mia dolce vita,\nche mi farà salvare.\n\nAmor diletto, del mio cor se' vita,\nor damit'a trovare!\n\nTra'mi a te di questo gran tormento,\nchè vivo in dolorare!\n\nCh'io non ti perda per mio fallimento,\ncum falso tentare.\n\nVivo in paura di te mia dolzura,\ncome ne posso fare?\n\nTu se' il mio áire, io son tua creatura,\nnon m'abandonare!\n\nNon averò povertà, né difetto,\ne vo' con teco stare!"}, {"id": "b37", "order": 37, "title": "Venite a laudare", "title_ar": "تعالوا نسبّح", "sec": "laudi", "lang": "it", "body": "> Venite a laudare,\n> per amore cantare\n> l'amorosa vergene Maria!\n\nMaria gloriosa, biata,\nsempre si' molto laudata:\npreghiam che ne si' avocata\nal tuo filiol, virgo pia!\n\nDa tutte le genti invocata\nper te è questa laude cantata:\ntu sei Madre nostra adorata\nla più fedel che mai sia."}, {"id": "b38", "order": 38, "title": "Voi ch'amate lo Criatore", "title_ar": "يا من تحبّون الخالق", "sec": "laudi", "lang": "it", "body": "> Voi ch'amate lo Criatore,\n> ponete mente a lo meo dolore.\n\nCh'io son Maria co' lo cor tristo\nla quale avea per figliuol Cristo:\nla speme mia e dolce acquisto\nfue crocifisso per li peccatori.\n\nCapo bello e delicato,\ncome ti veggio stare enchinato;\nli tuoi capelli di sangue intrecciati,\nfin a la barba ne va irrigore.\n\nBocca bella e delicata,\ncome ti veggio stare asserrata;\ndi fiele e aceto fosti abbeverata,\ntrista e dolente dentr'al mio core."}];

morte. Amen."}],"grp":"main"},{"id":"gloria","it":"Gloria al Padre","ar":"المَجْدَلَةُ","tr":"al-majdala","lines":[{"r":"","ar":"المَجْدُ لِلآبِ وَالابْنِ وَالرُّوحِ القُدُسِ،","tr":"al-majdu li-l-ābi wa-l-ibni wa-r-rūḥi l-qudus,","it":"Gloria al Padre e al Figlio e allo Spirito Santo,"},{"r":"","ar":"الآنَ وَكُلَّ أَوَانٍ، وَإِلَى دَهْرِ الدَّاهِرِينَ. آمِين.","tr":"al-āna wa-kulla awān, wa-ilā dahri d-dāhirīn. āmīn.","it":"ora e in ogni tempo, e nei secoli dei secoli. Amen."}],"grp":"main"},{"id":"credo-niceno","it":"Credo niceno-costantinopolitano","ar":"قَانُونُ الإِيمَانِ النِّيقَاوِيُّ","tr":"qānūnu l-īmāni n-nīqāwī","lines":[{"r":"","ar":"نُؤْمِنُ بِإِلٰهٍ وَاحِدٍ، آبٍ ضَابِطِ الكُلِّ،","tr":"nuʾminu bi-ilāhin wāḥid, ābin ḍābiṭi l-kull,","it":"Crediamo in un solo Dio, Padre onnipotente,"},{"r":"","ar":"خَالِقِ السَّمَاءِ وَالأَرْضِ، كُلِّ مَا يُرَى وَمَا لَا يُرَى.","tr":"khāliqi s-samāʾi wa-l-arḍ, kulli mā yurā wa-mā lā yurā.","it":"creatore del cielo e della terra, di tutte le cose visibili e invisibili."},{"r":"","ar":"وَبِرَبٍّ وَاحِدٍ يَسُوعَ المَسِيحِ، ابْنِ اللهِ الوَحِيدِ،","tr":"wa-bi-rabbin wāḥidin yasūعa l-masīḥ, ibni llāhi l-waḥīd,","it":"E in un solo Signore, Gesù Cristo, unigenito Figlio di Dio,"},{"r":"","ar":"المَوْلُودِ مِنَ الآبِ قَبْلَ كُلِّ الدُّهُورِ،","tr":"al-mawlūdi mina l-ābi qabla kulli d-duhūr,","it":"nato dal Padre prima di tutti i secoli:"},{"r":"","ar":"إِلٰهٍ مِنْ إِلٰهٍ، نُورٍ مِنْ نُورٍ، إِلٰهٍ حَقٍّ مِنْ إِلٰهٍ حَقٍّ،","tr":"ilāhin min ilāh, nūrin min nūr, ilāhin ḥaqqin min ilāhin ḥaqq,","it":"Dio da Dio, Luce da Luce, Dio vero da Dio vero,"},{"r":"","ar":"مَوْلُودٍ غَيْرِ مَخْلُوقٍ، مُسَاوٍ لِلآبِ فِي الجَوْهَرِ،","tr":"mawlūdin gheyri makhlūq, musāwin li-l-ābi fi l-jawhar,","it":"generato, non creato, della stessa sostanza del Padre;"},{"r":"","ar":"الَّذِي بِهِ كَانَ كُلُّ شَيْءٍ.","tr":"alladhī bihi kāna kullu sheyʾ.","it":"per mezzo di lui tutte le cose sono state create."},{"r":"","ar":"الَّذِي مِنْ أَجْلِنَا نَحْنُ البَشَرَ، وَمِنْ أَجْلِ خَلَاصِنَا، نَزَلَ مِنَ السَّمَاءِ،","tr":"alladhī min ajlinā naḥnu l-bashar, wa-min ajli khalāṣinā, nazala mina s-samāʾ,","it":"Per noi uomini e per la nostra salvezza discese dal cielo,"},{"r":"","ar":"وَتَجَسَّدَ مِنَ الرُّوحِ القُدُسِ وَمِنْ مَرْيَمَ العَذْرَاءِ، وَتَأَنَّسَ.","tr":"wa-tajassada mina r-rūḥi l-qudusi wa-min maryama l-عadhrāʾ, wa-taʾannas.","it":"si è incarnato per opera dello Spirito Santo e da Maria Vergine, e si è fatto uomo."},{"r":"","ar":"وَصُلِبَ عَنَّا عَلَى عَهْدِ بِيلَاطُسَ البُنْطِيِّ،","tr":"wa-ṣuliba عannā عalā عahdi bīlāṭusa l-bunṭī,","it":"Fu crocifisso per noi sotto Ponzio Pilato,"},{"r":"","ar":"وَتَأَلَّمَ وَقُبِرَ،","tr":"wa-taʾallama wa-qubir,","it":"patì e fu sepolto."},{"r":"","ar":"وَقَامَ فِي اليَوْمِ الثَّالِثِ كَمَا فِي الكُتُبِ،","tr":"wa-qāma fi l-yawmi th-thālithi kamā fi l-kutub,","it":"Il terzo giorno è risuscitato, secondo le Scritture,"},{"r":"","ar":"وَصَعِدَ إِلَى السَّمَاءِ، وَجَلَسَ عَنْ يَمِينِ الآبِ،","tr":"wa-ṣaعida ila s-samāʾ, wa-jalasa عan yamīni l-āb,","it":"è salito al cielo, siede alla destra del Padre."},{"r":"","ar":"وَأَيْضًا يَأْتِي بِمَجْدٍ لِيَدِينَ الأَحْيَاءَ وَالأَمْوَاتَ،","tr":"wa-eyḍan yaʾtī bi-majdin li-yadīna l-aḥyāʾa wa-l-amwāt,","it":"E di nuovo verrà, nella gloria, per giudicare i vivi e i morti,"},{"r":"","ar":"الَّذِي لَا فَنَاءَ لِمُلْكِهِ.","tr":"alladhī lā fanāʾa li-mulkihi.","it":"e il suo regno non avrà fine."},{"r":"","ar":"وَنُؤْمِنُ بِالرُّوحِ القُدُسِ، الرَّبِّ المُحْيِي،","tr":"wa-nuʾminu bi-r-rūḥi l-qudus, ar-rabbi l-muḥyī,","it":"Crediamo nello Spirito Santo, che è Signore e dà la vita,"},{"r":"","ar":"المُنْبَثِقِ مِنَ الآبِ وَالابْنِ،","tr":"al-munbathiqi mina l-ābi wa-l-ibn,","it":"e procede dal Padre e dal Figlio."},{"r":"","ar":"الَّذِي هُوَ مَعَ الآبِ وَالابْنِ يُسْجَدُ لَهُ وَيُمَجَّدُ،","tr":"alladhī huwa maعa l-ābi wa-l-ibni yusjadu lahu wa-yumajjad,","it":"Con il Padre e il Figlio è adorato e glorificato,"},{"r":"","ar":"النَّاطِقِ بِالأَنْبِيَاءِ.","tr":"an-nāṭiqi bi-l-anbiyāʾ.","it":"e ha parlato per mezzo dei profeti."},{"r":"","ar":"وَبِكَنِيسَةٍ وَاحِدَةٍ، جَامِعَةٍ، مُقَدَّسَةٍ، رَسُولِيَّةٍ.","tr":"wa-bi-kanīsatin wāḥida, jāmiعa, muqaddasa, rasūliyya.","it":"Crediamo la Chiesa, una, cattolica, santa e apostolica."},{"r":"","ar":"وَنَعْتَرِفُ بِمَعْمُودِيَّةٍ وَاحِدَةٍ لِمَغْفِرَةِ الخَطَايَا.","tr":"wa-naعtarifu bi-maعmūdiyyatin wāḥidatin li-maghfirati l-khaṭāyā.","it":"Professiamo un solo battesimo per il perdono dei peccati."},{"r":"","ar":"وَنَتَرَجَّى قِيَامَةَ المَوْتَى، وَالحَيَاةَ فِي الدَّهْرِ الآتِي. آمِين.","tr":"wa-natarajjā qiyāmata l-mawtā, wa-l-ḥayāta fi d-dahri l-ātī. āmīn.","it":"Aspettiamo la risurrezione dei morti e la vita del mondo che verrà. Amen."}],"note":"Il Credo della Messa; si recita anche all’inizio del Rosario.","grp":"main"},{"id":"salve","it":"Salve Regina","ar":"السَّلَامُ عَلَيْكِ أَيَّتُهَا المَلِكَةُ","tr":"as-salāmu عaleyki ayyatuha l-malika","lines":[{"r":"","ar":"السَّلَامُ عَلَيْكِ أَيَّتُهَا المَلِكَةُ، يَا أُمَّ الرَّحْمَةِ،","tr":"as-salāmu عaleyki ayyatuha l-malika, yā umma r-raḥma,","it":"Salve, Regina, Madre di misericordia,"},{"r":"","ar":"يَا حَيَاتَنَا وَعُذُوبَتَنَا وَرَجَاءَنَا، السَّلَامُ عَلَيْكِ.","tr":"yā ḥayātanā wa-عudhūbatanā wa-rajāʾanā, as-salāmu عaleyki.","it":"vita, dolcezza e speranza nostra, salve."},{"r":"","ar":"إِلَيْكِ نَصْرُخُ نَحْنُ المَنْفِيِّينَ أَوْلَادَ حَوَّاءَ،","tr":"ileyki naṣrukhu naḥnu l-manfiyyīna awlāda ḥawwāʾ,","it":"A te gridiamo, noi esuli figli di Eva;"},{"r":"","ar":"وَإِلَيْكِ نَتَنَهَّدُ نَائِحِينَ وَبَاكِينَ فِي هٰذَا الوَادِي، وَادِي الدُّمُوعِ.","tr":"wa-ileyki natanahhadu nāʾiḥīna wa-bākīna fī hādha l-wādī, wādi d-dumūع.","it":"a te sospiriamo, gementi e piangenti in questa valle di lacrime."},{"r":"","ar":"فَيَا شَفِيعَتَنَا، انْعَطِفِي إِلَيْنَا بِنَظَرَاتِكِ الرَّؤُوفَةِ.","tr":"fa-yā shafīعatanā, inعaṭifī ileynā bi-naẓarātiki r-raʾūfa.","it":"Orsù dunque, avvocata nostra, rivolgi a noi gli occhi tuoi misericordiosi."},{"r":"","ar":"وَأَرِينَا بَعْدَ هٰذَا المَنْفَى يَسُوعَ، ثَمَرَةَ بَطْنِكِ المُبَارَكَةَ.","tr":"wa-arīnā baعda hādha l-manfā yasūع, thamarata baṭniki l-mubāraka.","it":"E mostraci, dopo questo esilio, Gesù, il frutto benedetto del tuo seno."},{"r":"","ar":"يَا رَؤُوفَةُ، يَا حَنُونَةُ، يَا مَرْيَمُ البَتُولُ الحُلْوَةُ.","tr":"yā raʾūfa, yā ḥanūna, yā maryamu l-batūlu l-ḥulwa.","it":"O clemente, o pia, o dolce Vergine Maria."}],"grp":"main"},{"id":"angelo","it":"Angelo di Dio","ar":"صَلَاةٌ إِلَى المَلَاكِ الحَارِسِ","tr":"ṣalātun ila l-malāki l-ḥāris","lines":[{"r":"","ar":"يَا مَلَاكَ اللهِ، يَا حَارِسِي،","tr":"yā malāka llāh, yā ḥārisī,","it":"Angelo di Dio, che sei il mio custode,"},{"r":"","ar":"أَنِرْنِي، وَاحْرُسْنِي، وَدَبِّرْنِي، وَاهْدِنِي،","tr":"anirnī, wa-ḥrusnī, wa-dabbirnī, wa-hdinī,","it":"illumina, custodisci, reggi e governa me,"},{"r":"","ar":"أَنَا الَّذِي عُهِدَ بِي إِلَيْكَ مِنَ الرَّحْمَةِ السَّمَاوِيَّةِ. آمِين.","tr":"ana lladhī عuhida bī ileyka mina r-raḥmati s-samāwiyya. āmīn.","it":"che ti fui affidato dalla pietà celeste. Amen."}],"grp":"main"},{"id":"requiem","it":"L’eterno riposo","ar":"صَلَاةٌ لِأَجْلِ المَوْتَى","tr":"ṣalātun li-ajli l-mawtā","lines":[{"r":"","ar":"الرَّاحَةَ الأَبَدِيَّةَ أَعْطِهِمْ يَا رَبُّ،","tr":"ar-rāḥata l-abadiyyata aعṭihim yā rabb,","it":"L’eterno riposo dona loro, o Signore,"},{"r":"","ar":"وَلْيُشْرِقْ عَلَيْهِمْ نُورُكَ الدَّائِمُ.","tr":"wa-l-yushriq عaleyhim nūruka d-dāʾim.","it":"e splenda ad essi la luce perpetua."},{"r":"","ar":"وَلْيَسْتَرِيحُوا بِسَلَامٍ. آمِين.","tr":"wa-l-yastarīḥū bi-salām. āmīn.","it":"Riposino in pace. Amen."}],"grp":"main"},{"id":"apertura","it":"Inizio del Rosario","ar":"بَدْءُ الوَرْدِيَّةِ","tr":"badʾu l-wardiyya","lines":[{"r":"rub","it":"Segno della croce, poi:","rar":"إِشَارَةُ الصَّلِيبِ، ثُمَّ:","links":["segno"]},{"r":"V","ar":"اللّٰهُمَّ، الْتَفِتْ إِلَى مَعُونَتِي.","tr":"allāhumma ltafit ilā maعūnatī.","it":"O Dio, vieni a salvarmi."},{"r":"R", function slugT(x){return "f-"+String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,"-").replace(/^-|-$/g,"").slice(0,60)}
function parseCanti(txt){
  const out=[];let cur=null,part="body";const seen={};
  for(const raw of String(txt).replace(/\r/g,"").split("\n")){
    const l=raw.replace(/\s+$/,"");
    if(/^===/.test(l)){
      if(cur)out.push(cur);
      const f=l.replace(/^=+\s*/,"").split("|").map(x=>x.trim());
      const title=f[0]||"";if(!title){cur=null;continue}
      const secK=(f[2]||"").toLowerCase(), lgK=(f[3]||"").toLowerCase();
      const lang=LANGMAP[lgK]||(SECMAP[secK]==="arabi"?"ar":SECMAP[secK]==="ita"?"it":"xx");
      let id=slugT(title);if(seen[id])id+="-"+(++seen[id]);else seen[id]=1;
      cur={id,title,title_ar:f[1]||"",sec:SECMAP[secK]||(lang==="ar"?"arabi":lang==="it"?"ita":"altre"),lang,body:"",translit_ar:"",trad_ar:"",note_ar:"",order:5000+out.length};part="body";continue}
    if(!cur)continue;
    const m=l.match(/^---\s*(pronuncia|pronunciación|نطق|traslitterazione|spiegazione|explicación|nota|شرح)\s*-*$/i);
    const mt=l.match(/^---\s*(traduzione|traducción|traduccion|ترجمة|الترجمة)\s*-*$/i);if(mt){part="trad_ar";continue}
    if(m){part=/spieg|explic|nota|شرح/i.test(m[1])?"note_ar":"translit_ar";continue}
    cur[part]+=(cur[part]?"\n":"")+l;
  }
  if(cur)out.push(cur);
  return out.map(s=>{let n=s.note_ar.trim(),author="",author_ar="";const ls=n.split("\n");if(ls[0]&&/[A-Za-zÀ-ÿ]/.test(ls[0])){const ap=ls[0].split("|");author=ap[0].trim();author_ar=(ap[1]||"").trim();n=ls.slice(1).join("\n").trim()}
    return {...s,author,author_ar,body:s.body.trim(),translit_ar:s.translit_ar.trim(),trad_ar:s.trad_ar.trim(),note_ar:n}}).filter(s=>s.body);
}

const IDX={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11,c:0,d:2,e:4,f:5,g:7,a:9,b:11,h:11};
function trNote(n,k){const m=n.match(/^(Do|Re|Mi|Fa|Sol|La|Si|[A-H])([#b]?)/i);if(!m)return n;
  let i=IDX[m[1].toLowerCase()];if(i==null)return n;i+=m[2]==="#"?1:m[2]==="b"?-1:0;

  if(!show) return `<span class="ln">${esc(l.replace(/\[[^\]]+\]/g,""))||"&nbsp;"}</span>`;
  const parts=l.split(/(\[[^\]]+\])/);let out="",ch="";
  const seg=(c,x)=>`<span class="seg"><span class="c">${esc(c?trChord(c,k):"")}</span><span>${esc(x)||(c?"&nbsp;":"")}</span></span>`;
  parts.forEach((p,i)=>{ if(/^\[[^\]]+\]$/.test(p)){ if(ch) out+=seg(ch,""); ch=p.slice(1,-1);} else if(p||ch){ out+=seg(ch,p); ch="";} });

}
